    <div class="p-5 fade-in" key=${card.id}>
      <p class="text-[15px] leading-relaxed text-plum-300 font-medium mb-5 border-l-2 border-plum-600 pl-3.5"
         dangerouslySetInnerHTML=${{ __html: prose(p.lead) }}></p>

      ${p.body.map((para, i) => html`
        <p class="text-[13.5px] leading-[1.75] text-slate-300 mb-4"
           dangerouslySetInnerHTML=${{ __html: prose(para) }}></p>`)}

      <div class="my-5">
        <div class="text-[10px] uppercase tracking-[0.18em] text-slate-500 mb-2">the picture</div>
        <div class="diagram" title="click to enlarge" onClick=${() => setZoom(true)}>${p.diagram}</div>
        <div class="text-[10px] text-slate-600 mt-1.5">click the diagram to enlarge</div>
      </div>

      ${zoom ? html`
        <div class="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-6"
             onClick=${() => setZoom(false)}>
          <div class="max-w-[95vw] max-h-[90vh] overflow-auto rounded-2xl border border-plum-600/50 bg-ink-800 p-6 glow"
               onClick=${e => e.stopPropagation()}>
            <div class="flex items-center justify-between mb-3 gap-6">
              <div class="text-[11px] uppercase tracking-[0.18em] text-plum-400">${card.id}. ${card.title}</div>
              <button onClick=${() => setZoom(false)} class="text-slate-500 hover:text-slate-200 text-lg leading-none">✕</button>
            </div>
            <pre class="diagram-zoom" onClick=${() => setZoom(false)}>${p.diagram}</pre>
          </div>
        </div>` : null}

      <div class="rounded-xl border border-mint-500/30 bg-mint-500/[0.06] px-4 py-3">
        <div class="text-[10px] uppercase tracking-[0.18em] text-mint-400 mb-1.5">take this with you</div>

      </div>

function Flashcard({ card, flipped, onFlip, known }) {
  return html`
    <div class="flip w-full cursor-pointer select-none" onClick=${onFlip}>
      <div class="flip-inner ${flipped ? 'flipped' : ''}">
        <div class="face">
          <div class="rounded-2xl border border-plum-600/40 bg-gradient-to-br from-ink-700 to-ink-800 p-6 glow min-h-[300px] flex flex-col">
            <div class="flex items-center gap-2 mb-5">
              <span class="text-[10px] uppercase tracking-[0.2em] text-plum-400 font-bold">question</span>
              <span class="h-px flex-1 bg-ink-500"></span>
              ${known ? html`<span class="text-[10px] text-mint-400">✓ known</span>` : null}
            </div>
            <h3 class="text-[19px] font-semibold leading-snug text-slate-100 mb-4">${card.title}</h3>
            <p class="text-[14.5px] leading-relaxed text-slate-300 flex-1"
               dangerouslySetInnerHTML=${{ __html: prose(card.front) }}></p>
            <div class="mt-6 text-[11px] text-slate-500 flex items-center gap-2">
              <kbd class="px-1.5 py-0.5 rounded border border-ink-500 bg-ink-700 text-slate-400">space</kbd>
              <span>or click to reveal</span>
            </div>
          </div>
        </div>

        <div class="face face-back">
          <div class="rounded-2xl border border-mint-500/35 bg-gradient-to-br from-[#10201f] to-ink-800 p-6 min-h-[300px] flex flex-col">
            <div class="flex items-center gap-2 mb-5">
              <span class="text-[10px] uppercase tracking-[0.2em] text-mint-400 font-bold">answer</span>
              <span class="h-px flex-1 bg-ink-500"></span>
            </div>
            <p class="text-[14.5px] leading-[1.75] text-slate-200 flex-1"
               dangerouslySetInnerHTML=${{ __html: prose(card.back) }}></p>
            <div class="mt-6 text-[11px] text-slate-500">click to flip back</div>
          </div>
        </div>
      </div>
    </div>`;
}

function Drawer({ open, onClose, cards, current, onPick, knownSet }) {
  const [q, setQ] = useState('');
  if (!open) return null;

  const term = q.trim().toLowerCase();
  const filtered = term
    ? cards.filter(c => (c.title + ' ' + c.front + ' ' + c.back + ' ' + c.mod).toLowerCase().includes(term))
    : cards;

  const groups = [];
  filtered.forEach(c => {
    const last = groups[groups.length - 1];
    if (last && last.mod === c.mod) last.items.push(c);
    else groups.push({ mod: c.mod, items: [c] });
  });

  return html`
    <div class="fixed inset-0 z-40 bg-black/70 backdrop-blur-sm" onClick=${onClose}>
      <div class="absolute left-0 top-0 h-full w-full max-w-md bg-ink-900 border-r border-ink-600 flex flex-col"
           onClick=${e => e.stopPropagation()}>
        <div class="p-4 border-b border-ink-600 shrink-0">
          <div class="flex items-center justify-between mb-3">
            <h2 class="text-sm font-bold tracking-wide text-plum-300">CURRICULUM · ${cards.length} CARDS</h2>
            <button onClick=${onClose} class="text-slate-500 hover:text-slate-200 text-lg leading-none px-2">✕</button>
          </div>
          <input
            autofocus
            value=${q}
            onInput=${e => setQ(e.target.value)}
            placeholder="search cards…"
            class="w-full bg-ink-700 border border-ink-500 rounded-lg px-3 py-2 text-[13px] text-slate-200
                   placeholder:text-slate-500 outline-none focus:border-plum-500" />
        </div>

        <div class="flex-1 overflow-y-auto p-3">
          ${groups.map(g => html`
            <div class="mb-4">
              <div class="text-[10px] uppercase tracking-[0.18em] text-slate-500 px-2 mb-1.5">${g.mod}</div>
              ${g.items.map(c => html`
                <button
                  onClick=${() => { onPick(c.id - 1); onClose(); }}
                  class="w-full text-left px-2.5 py-1.5 rounded-lg flex items-center gap-2.5 transition
                         ${c.id - 1 === current ? 'bg-plum-600/25 text-plum-200' : 'hover:bg-ink-700 text-slate-300'}">
                  <span class="text-[10px] font-mono w-6 shrink-0 ${knownSet.has(c.id) ? 'text-mint-400' : 'text-slate-600'}">
                    ${knownSet.has(c.id) ? '✓' : String(c.id).padStart(2, '0')}
                  </span>
                  <span class="text-[12.5px] truncate">${c.title}</span>
                </button>`)}
            </div>`)}
          ${filtered.length === 0 ? html`<div class="text-center text-slate-500 text-sm py-10">nothing matches</div>` : null}
        </div>
      </div>
    </div>`;
}

/* ============================================================
   App
   ============================================================ */
function App() {
  const saved = useMemo(loadState, []);
  const [idx, setIdx] = useState(Math.min(saved.idx || 0, CARDS.length - 1));
  const [flipped, setFlipped] = useState(false);
  const [known, setKnown] = useState(() => new Set(saved.known || []));
  const [drawer, setDrawer] = useState(false);

  const card = CARDS[idx];

  useEffect(() => { saveState({ idx, known: Array.from(known) }); }, [idx, known]);
  useEffect(() => { setFlipped(false); }, [idx]);

  const go = useCallback((delta) => {
    setIdx(i => Math.max(0, Math.min(CARDS.length - 1, i + delta)));
  }, []);

  const idxRef = useRef(idx);
  idxRef.current = idx;

  const toggleKnown = useCallback(() => {
    setKnown(prev => {
      const next = new Set(prev);
      if (next.has(CARDS[idxRef.current].id)) next.delete(CARDS[idxRef.current].id);
      else next.add(CARDS[idxRef.current].id);
      return next;
    });
  }, []);

  useEffect(() => {
    const onKey = (e) => {
      if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
      if (e.key === 'ArrowRight' || e.key === 'j') { e.preventDefault(); go(1); }
      else if (e.key === 'ArrowLeft' || e.key === 'k') { e.preventDefault(); go(-1); }
      else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setFlipped(f => !f); }
      else if (e.key === 'm') { toggleKnown(); }
      else if (e.key === '/') { e.preventDefault(); setDrawer(true); }
      else if (e.key === 'Escape') { setDrawer(false); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [go, toggleKnown]);

  const pct = Math.round((known.size / CARDS.length) * 100);

  return html`
    <div class="h-full flex flex-col">
      <!-- ======= header ======= -->
      <header class="shrink-0 border-b border-ink-600 bg-ink-800/80 backdrop-blur px-4 py-2.5 flex items-center gap-4">
        <button onClick=${() => setDrawer(true)}
                class="text-slate-400 hover:text-plum-300 px-2 py-1 rounded-lg border border-ink-500 hover:border-plum-600 text-[11px] tracking-wide">
          ☰ deck
        </button>

        <div class="flex items-baseline gap-2.5 min-w-0">
          <span class="font-bold tracking-tight text-[15px] text-slate-100">Learn<span class="text-plum-400">Elixir</span></span>
          <span class="hidden sm:inline text-[11px] text-slate-500 truncate">${card.mod}</span>
        </div>

        <div class="flex-1 flex items-center gap-3 min-w-0">
          <div class="h-1.5 flex-1 rounded-full bg-ink-600 overflow-hidden max-w-md">
            <div class="h-full bg-gradient-to-r from-plum-500 to-mint-500 transition-all duration-300"
                 style=${{ width: ((idx + 1) / CARDS.length * 100) + '%' }}></div>
          </div>
          <span class="text-[11px] font-mono text-slate-500 shrink-0">${String(idx + 1).padStart(2, '0')} / ${CARDS.length}</span>
        </div>

        <div class="hidden md:flex items-center gap-2 text-[11px] text-slate-500 shrink-0">
          <span class="text-mint-400">${known.size}</span> mastered · ${pct}%
        </div>

        <div class="flex items-center gap-1.5 shrink-0">
          <button onClick=${() => go(-1)} disabled=${idx === 0}
                  class="px-2.5 py-1 rounded-lg border border-ink-500 text-slate-400 hover:text-plum-300 hover:border-plum-600 disabled:opacity-30 text-sm">←</button>
          <button onClick=${() => go(1)} disabled=${idx === CARDS.length - 1}
                  class="px-2.5 py-1 rounded-lg border border-ink-500 text-slate-400 hover:text-plum-300 hover:border-plum-600 disabled:opacity-30 text-sm">→</button>
        </div>
      </header>

      <!-- ======= three panels ======= -->
      <main class="panels flex-1 min-h-0 gap-3 p-3">

        <${Panel} title="Philosophy" tint="text-plum-400" badge="why it works this way">
          <${Philosophy} card=${card} />
        <//>

        <${Panel} title="Flashcard" tint="text-slate-300" badge=${'card ' + card.id}>
          <div class="p-5 flex flex-col gap-4 fade-in" key=${card.id}>
            <${Flashcard} card=${card} flipped=${flipped} known=${known.has(card.id)}
                          onFlip=${() => setFlipped(f => !f)} />

            <div class="flex items-center gap-2">
              <button onClick=${() => go(-1)} disabled=${idx === 0}
                      class="flex-1 py-2 rounded-xl border border-ink-500 text-slate-400 text-[12px] hover:border-plum-600 hover:text-plum-300 disabled:opacity-30">
                ← previous
              </button>
              <button onClick=${toggleKnown}
                      class="px-4 py-2 rounded-xl border text-[12px] transition
                             ${known.has(card.id)
                               ? 'border-mint-500 text-mint-400 bg-mint-500/10'
                               : 'border-ink-500 text-slate-400 hover:border-mint-500 hover:text-mint-400'}">
                ${known.has(card.id) ? '✓ mastered' : 'mark mastered'}
              </button>
              <button onClick=${() => go(1)} disabled=${idx === CARDS.length - 1}
                      class="flex-1 py-2 rounded-xl border border-ink-500 text-slate-400 text-[12px] hover:border-plum-600 hover:text-plum-300 disabled:opacity-30">
                next →
              </button>
            </div>

            <div class="rounded-xl border border-ink-600 bg-ink-800/60 px-4 py-3">
              <div class="text-[10px] uppercase tracking-[0.18em] text-slate-500 mb-2">where you are</div>
              <div class="text-[12px] text-slate-400 leading-relaxed">
                <span class="text-plum-300">${card.mod}</span> · card ${card.id} of ${CARDS.length}
              </div>
              <div class="mt-3 flex flex-wrap gap-1">
                ${CARDS.map((c, i) => html`
                  <button title=${c.id + '. ' + c.title}
                          onClick=${() => setIdx(i)}
                          class="h-1.5 w-[9px] rounded-full transition
                                 ${i === idx ? 'bg-plum-400' : known.has(c.id) ? 'bg-mint-500/70' : 'bg-ink-500 hover:bg-ink-500/60'}"></button>`)}
              </div>
            </div>

            <div class="text-[11px] text-slate-600 leading-relaxed">
              <span class="text-slate-500">keys:</span>
              <kbd class="px-1 rounded bg-ink-700 border border-ink-500">←</kbd>
              <kbd class="px-1 rounded bg-ink-700 border border-ink-500">→</kbd> move ·
              <kbd class="px-1 rounded bg-ink-700 border border-ink-500">space</kbd> flip ·
              <kbd class="px-1 rounded bg-ink-700 border border-ink-500">m</kbd> mastered ·
              <kbd class="px-1 rounded bg-ink-700 border border-ink-500">/</kbd> deck
            </div>
          </div>
        <//>

        <${Panel} title="Try it in iex" tint="text-mint-400" badge=${card.code.length + ' sample' + (card.code.length > 1 ? 's' : '')}>
          <div class="p-4 fade-in" key=${card.id}>
            ${card.code.map((s, i) => html`<${CodeBlock} sample=${s} key=${card.id + '-' + i} />`)}
          </div>
        <//>
      </main>

      <${Drawer} open=${drawer} onClose=${() => setDrawer(false)} cards=${CARDS}
                 current=${idx} onPick=${setIdx} knownSet=${known} />
    </div>`;
}

render(html`<${App} />`, document.getElementById('root'));
</script>
</body>
</html>
