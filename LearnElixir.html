/* ============================================================
   CURRICULUM — 74 cards, strictly cumulative.
   Each card: { id, mod, title, front, back, phil{lead,body[],diagram,takeaway}, code[{title,note,code}] }
   ============================================================ */
const CARDS = [
{
  id:1, mod:"1 · The Ground", title:"Why Elixir: the BEAM",
  front:"You start one Elixir program on a 8-core laptop and it happily runs 200,000 concurrent chat users. What is actually running them?",
  back:"The BEAM virtual machine. It runs ONE operating-system process, but inside it schedules millions of tiny **BEAM processes** — each ~2KB, each with its own heap and garbage collector, each preemptively scheduled. They share no memory; they only send messages. That is why one crashing user's connection cannot corrupt or freeze the other 199,999.",
  phil:{
    lead:"Elixir is not a language that got concurrency added later. Concurrency is the material it is made of.",
    body:[
      "Most backend languages give you one big shared heap and then hand you locks, mutexes and thread pools so you can carefully avoid stepping on your own toes. Elixir refuses the premise. There is no shared memory to protect. A BEAM process owns its data completely, and if another process wants that data it must be sent a copy as a message.",
      "This sounds wasteful until you see what it buys. Each process gets its own garbage collector, so a GC pause is 40 microseconds on one tiny heap instead of a stop-the-world freeze. Each process is preemptively scheduled by the BEAM (about every 4000 reductions), so one process running an infinite loop cannot starve the others — unlike Node.js, where one blocking loop freezes the whole server.",
      "And because processes are isolated, a crash is local. In most stacks a crash is a catastrophe you must prevent. On the BEAM a crash is a routine event you supervise and recover from. That single inversion — 'let it crash' — is the philosophy every later card builds on."
    ],
    diagram:`   ┌───────────────── ONE OS process: the BEAM VM ──────────────────┐
   │                                                                │
   │  Scheduler 1        Scheduler 2        Scheduler 3   (1/core)  │
   │  ┌────┐┌────┐       ┌────┐┌────┐       ┌────┐┌────┐            │
   │  │ p1 ││ p2 │       │ p3 ││ p4 │       │ p5 ││ p6 │  processes │
   │  └────┘└────┘       └────┘└────┘       └────┘└────┘  ~2KB each │
   │    │      ▲            │                              own heap │
   │    └─msg──┘            └── crash ✗  (nobody else notices)      │
   │                                                                │
   │   NO shared memory  ·  NO locks  ·  messages only              │
   └────────────────────────────────────────────────────────────────┘
        Java/Node: 1 heap + N threads + locks   →  a crash is global
        BEAM:      N heaps + N processes + msgs →  a crash is local`,
    takeaway:"Isolation first, messages second, crashes are normal. Everything else in Elixir is a consequence."
  },
  code:[
    {title:"Prove it in iex", note:"Start iex in a terminal, then paste. You are spawning 200k real processes.", code:`# terminal:  iex
:erlang.system_info(:process_count)      # how many live right now
:erlang.system_info(:logical_processors)  # schedulers = cores

# spawn 200_000 processes that each just sleep
for _ <- 1..200_000, do: spawn(fn -> Process.sleep(10_000) end)
:erlang.system_info(:process_count)      # look at the number now`},
    {title:"Memory per process", note:"Compare this to an OS thread (~1MB) or a Go goroutine (~4KB).", code:`pid = spawn(fn -> Process.sleep(:infinity) end)
Process.info(pid, :memory)   # {:memory, ~2600} bytes
Process.info(pid, :status)`}
  ]
},
{
  id:2, mod:"1 · The Ground", title:"iex — your laboratory",
  front:"Before writing any file, where do you try Elixir ideas out — and how do you get out when you make a mistake?",
  back:"`iex` is the interactive shell. Type expressions, get values. `h Enum.map` shows docs, `i value` inspects a value's type, `recompile()` reloads your project, and `Ctrl+C` twice (or `Ctrl+\\`) exits. Inside a Mix project you use `iex -S mix` so all your modules and dependencies are loaded.",
  phil:{
    lead:"Elixir is a REPL-first language. The shell is not a toy; it is a live window into a running system — including a production one.",
    body:[
      "In most languages the REPL is where you test snippets. On the BEAM, the shell is a process like any other, attached to a live node. You can connect to a running production server and inspect its state, call functions, even hot-load new code. That is why we start here: every card in this deck is meant to be pasted into iex and felt, not just read.",
      "Three helpers will carry you the whole way. `h` gives you documentation, because Elixir docs are data stored in the compiled bytecode. `i` tells you what a value actually is — invaluable while your intuition for types is forming. And multi-line input just works: iex waits for you to close the expression.",
      "Get comfortable here. When you later debug a GenServer or a database query, you will do it from exactly this prompt."
    ],
    diagram:`   your keyboard
        │
        ▼
   ┌──────────┐   evaluates in a       ┌────────────────────────┐
   │   iex>   │──── real BEAM ────────▶│  running node          │
   └──────────┘      process           │  (your app, your deps, │
        ▲                              │   your live state)     │
        └────────── value ─────────────┘

   h Enum.map     → documentation      i "hi"        → type info
   recompile()    → reload project     v(3)          → re-use result #3
   Ctrl+C Ctrl+C  → quit               #iex:break    → escape bad input`,
    takeaway:"If you cannot paste it into iex, you do not understand it yet."
  },
  code:[
    {title:"First contact", note:"Type `iex` in your terminal and paste these one at a time.", code:`1 + 1
"hello" <> " world"
h Enum.map
i :an_atom
i "a string"`},
    {title:"Multi-line + history", note:"iex keeps evaluating until the expression is complete.", code:`total =
  [1, 2, 3]
  |> Enum.map(fn n -> n * 10 end)
  |> Enum.sum()

v()      # the last value
v(1)     # the value of line 1`},
    {title:"Escape hatches", note:"When iex is stuck waiting for a closing quote or bracket.", code:`# type this and press enter to abort a broken expression:
#iex:break

# clear the screen
clear()

# exit iex:  press Ctrl+C twice`}
  ]
},
{
  id:3, mod:"1 · The Ground", title:"Immutability & rebinding",
  front:"You write `list = [1,2,3]` then `Enum.map(list, & &1 * 2)`. What is `list` afterwards, and why does that matter for concurrency?",
  back:"`list` is still `[1,2,3]`. Data in Elixir is immutable — functions never mutate their arguments, they return NEW values. You may rebind the NAME (`list = [9]` is legal), but the old value is untouched, and anyone else holding it still sees the original. That is precisely what makes it safe to share values between processes without locks.",
  phil:{
    lead:"A variable in Elixir is a label you can move. The thing it labels can never change.",
    body:[
      "This is the single biggest mental shift coming from Python, Java or JavaScript. There, `list.append(4)` reaches into an object and changes it, and every other reference to that object silently changes too. That is the source of most 'spooky action at a distance' bugs, and it is why concurrent code needs locks — two threads must not touch the same object at once.",
      "In Elixir, `Enum.map` cannot modify anything. It reads the old value and builds a new one. Since nobody can mutate a value, two processes reading the same value can never race. Concurrency safety is not something you add with discipline; it falls out of the data model.",
      "Rebinding is allowed and idiomatic — `conn = Plug.Conn.put_status(conn, 404)` reads naturally and is everywhere in Phoenix. Just hold the distinction: the *name* moved, the *value* did not change. (And rebinding is scoped — a name rebound inside an `if` does not leak out, which trips up every newcomer exactly once.)"
    ],
    diagram:`   MUTABLE world (Python/JS)          IMMUTABLE world (Elixir)
   ───────────────────────────        ────────────────────────────
   a ──┐                              a ──▶ [1,2,3]   (frozen)
       ├──▶ [1,2,3]  ← append(4)
   b ──┘        │                     b ──▶ [1,2,3]   (same frozen
                ▼                                      value, safe
   a and b BOTH now [1,2,3,4]                          to share)
   😱 b never asked for that
                                      a = [9]  ← the LABEL moves
                                      a ──▶ [9]
                                      b ──▶ [1,2,3]  unchanged ✓

   consequence:  no shared mutable state  ⇒  no locks  ⇒  free concurrency`,
    takeaway:"Functions return new data. Rebinding moves a name, never a value."
  },
  code:[
    {title:"Watch the value survive", note:"Nothing you do to `list` changes `list`.", code:`list = [1, 2, 3]
doubled = Enum.map(list, fn n -> n * 2 end)

list      # [1, 2, 3]   <- untouched
doubled   # [2, 4, 6]

map = %{name: "Ada"}
map2 = Map.put(map, :age, 36)
map       # %{name: "Ada"}
map2      # %{age: 36, name: "Ada"}`},
    {title:"Rebinding is fine — and scoped", note:"The classic beginner trap is at the bottom.", code:`x = 1
x = x + 1
x           # 2  (the name moved twice)

# but rebinding inside a block does NOT leak out:
y = 1
if true do
  y = 99      # warning: this will be unused
end
y           # still 1  !!

# do this instead — return the value:
y = if true, do: 99, else: 1
y           # 99`}
  ]
},
{
  id:4, mod:"1 · The Ground", title:"Basic types & the atom",
  front:"What is `:ok`, and why does nearly every Elixir function you will ever call return something like `{:ok, value}`?",
  back:"`:ok` is an **atom** — a constant whose name is its own value, like a symbol or enum member. Atoms are compared in O(1) by pointer, never allocated twice, and read beautifully. Elixir uses them as tags: `:ok`, `:error`, `:noreply`, `:infinity`, `true`/`false`/`nil` are themselves atoms. Tagging results makes success and failure pattern-matchable instead of exception-driven.",
  phil:{
    lead:"An atom is a name that means only itself. It is the cheapest possible way to say 'this thing is of this kind'.",
    body:[
      "Elixir's scalar types are few and honest: integers (arbitrary precision — no overflow, ever), floats (64-bit), booleans, atoms, binaries (strings), and nil. Booleans are secretly atoms; `true == :true`. So is `nil`. This uniformity means one mechanism, pattern matching, can inspect everything.",
      "Atoms shine as *tags*. Instead of returning null, or throwing, an Elixir function returns `{:ok, user}` or `{:error, :not_found}`. The caller pattern-matches the tag and both paths are visible in the code. Errors stop being invisible control flow and become ordinary data you can pipe, log, and match on.",
      "One caution that matters in real services: atoms are never garbage collected, and the table caps around 1,048,576. Never call `String.to_atom/1` on user input — an attacker could exhaust the table and kill the node. Use `String.to_existing_atom/1` instead. This is a genuine production footgun worth memorising now."
    ],
    diagram:`   TYPES YOU WILL USE HOURLY
   ┌──────────┬───────────────────┬───────────────────────────────┐
   │ integer  │ 42, 1_000_000     │ arbitrary precision, no limit │
   │ float    │ 3.14, 1.0e-3      │ always 64-bit                 │
   │ atom     │ :ok :error nil    │ constant, name == value       │
   │ boolean  │ true false        │ these ARE atoms               │
   │ binary   │ "hello"           │ UTF-8 bytes                   │
   └──────────┴───────────────────┴───────────────────────────────┘

   THE TAGGED RESULT — the spine of every Elixir API
        Repo.insert(user)
              │
       ┌──────┴───────┐
       ▼              ▼
   {:ok, user}   {:error, changeset}
       │              │
       └── you MATCH on the tag, you do not catch an exception`,
    takeaway:"Atoms are free constants. Tagged tuples turn errors into data."
  },
  code:[
    {title:"Meet the types", note:"", code:`i 42
i 3.14
i :ok
i true            # secretly an atom
is_atom(true)     # true
is_atom(nil)      # true

# integers never overflow:
2 ** 200

# division always returns a float; use div/rem for integers
7 / 2      # 3.5
div(7, 2)  # 3
rem(7, 2)  # 1`},
    {title:"The tagged-tuple habit", note:"You will write hundreds of these.", code:`result = {:ok, %{id: 1, name: "Ada"}}

case result do
  {:ok, user}      -> "welcome " <> user.name
  {:error, reason} -> "failed: " <> inspect(reason)
end`},
    {title:"The atom-table footgun", note:"Remember this before you ever parse JSON keys into atoms.", code:`String.to_atom("safe_now")            # creates an atom forever

# NEVER on user input. Do this instead:
String.to_existing_atom("ok")         # :ok
# String.to_existing_atom("hax0r")    # raises ArgumentError ✓

:erlang.system_info(:atom_count)      # you have ~1M total, ever`}
  ]
},
{
  id:5, mod:"1 · The Ground", title:"Strings are binaries",
  front:"`\"héllo\"` — what is `byte_size/1` versus `String.length/1`, and why are there two answers?",
  back:"An Elixir string is a **binary**: a contiguous chunk of UTF-8 encoded bytes, written between double quotes. `byte_size(\"héllo\")` is 6 because `é` takes two bytes; `String.length(\"héllo\")` is 5 because it counts graphemes. Single quotes make a *charlist* (a list of codepoints) which you only need when talking to old Erlang libraries.",
  phil:{
    lead:"Elixir chose one string representation and made it the same thing the network and the disk speak: bytes.",
    body:[
      "Because a string is just a binary, the exact same value flows from a TCP socket, through your JSON decoder, into Postgres, and back out — with no conversion layer. That is a quiet but enormous win for a backend language. The `<>` operator concatenates binaries, and `<<>>` lets you pattern-match raw bytes, which is how people write protocol parsers in Elixir in twenty lines.",
      "The two size functions exist because bytes and human characters are genuinely different questions. Anything user-facing (truncating a bio, counting a tweet) uses the `String` module, which is Unicode-aware. Anything about storage or transport uses `byte_size`.",
      "Also: string concatenation in a loop is a trap in any language. Elixir's answer is the **iolist** — a nested list of binaries that the VM writes out without ever flattening it. Phoenix renders every HTML page this way. You will meet iolists again when we build responses."
    ],
    diagram:`   "héllo"  is a binary:
   ┌────┬────┬────┬────┬────┬────┐
   │ 68 │ C3 │ A9 │ 6C │ 6C │ 6F │   ← 6 BYTES  (byte_size = 6)
   └────┴────┴────┴────┴────┴────┘
     h   └── é ──┘   l    l    o     ← 5 GRAPHEMES (String.length = 5)

   "hi" <> " there"        concatenate
   <<104, 105>>            same thing, raw
   'hi'                    charlist [104,105]  ← Erlang interop only

   IOLIST — build output without copying:
   ["<h1>", name, "</h1>"]  ──▶ socket writes the parts in place`,
    takeaway:"Strings are UTF-8 binaries. String.* for humans, byte_size for wires."
  },
  code:[
    {title:"Two kinds of length", note:"", code:`s = "héllo"
byte_size(s)       # 6
String.length(s)   # 5
String.upcase(s)
String.slice(s, 0, 3)
String.split("a,b,c", ",")`},
    {title:"Interpolation & concatenation", note:"", code:`name = "Ada"
"hello #{name}, you are #{1815 + 200 - 1815} years old"
"hello " <> name

# multiline / heredoc
"""
Dear #{name},
  welcome to the BEAM.
"""`},
    {title:"Binaries are bytes you can match", note:"This is how protocol parsers are written.", code:`<<first::binary-size(1), rest::binary>> = "hello"
first   # "h"
rest    # "ello"

# is this a PNG file?
png = <<137, 80, 78, 71, 0, 0>>
match?(<<137, "PNG", _rest::binary>>, png)   # true`},
    {title:"iolists — cheap output", note:"Never build big strings with <> in a loop.", code:`parts = ["<ul>", Enum.map(1..3, fn i -> ["<li>", to_string(i), "</li>"] end), "</ul>"]
IO.iodata_to_binary(parts)
IO.puts(parts)     # the VM writes it without flattening`}
  ]
},
{
  id:6, mod:"1 · The Ground", title:"Lists vs tuples",
  front:"You have a collection of 10,000 orders, and separately a return value `{:ok, order}`. Which is a list and which is a tuple — and why is that not arbitrary?",
  back:"The 10,000 orders are a **list**: a singly-linked list, cheap to prepend (O(1)) and to walk, expensive to index or append (O(n)). `{:ok, order}` is a **tuple**: contiguous in memory, O(1) access by index, cheap to pattern-match — but copied whole when changed. Rule of thumb: lists for *many of the same thing*, tuples for *a few related things of different kinds*.",
  phil:{
    lead:"The two collection types encode two different intentions, and Elixir's whole style follows from picking the right one.",
    body:[
      "A list is a chain of cons cells: each cell holds a value and a pointer to the rest. That is why `[head | tail]` is the most natural pattern in the language, why prepending is instant, and why `length/1` has to walk the entire chain. If you find yourself indexing a list by position, you almost always wanted a different structure.",
      "A tuple is a fixed-size record laid out contiguously. It has no natural 'rest'. That makes it perfect for small, known shapes — coordinates `{x, y}`, results `{:ok, value}`, GenServer replies `{:reply, answer, state}`. Because the size and shape are fixed, pattern matching against a tuple is essentially free.",
      "Once you internalise this, you can read unfamiliar Elixir at a glance: a tuple in a signature says 'this has a known shape, match it', a list says 'this repeats, fold over it'."
    ],
    diagram:`   LIST  [1, 2, 3]   — singly linked, grows at the FRONT
   ┌───┬──┐  ┌───┬──┐  ┌───┬──┐
   │ 1 │ ●─┼─▶│ 2 │ ●─┼─▶│ 3 │ ●─┼─▶ []
   └───┴──┘  └───┴──┘  └───┴──┘
   [0 | list]  O(1) ✓      list ++ [4]  O(n) ✗    Enum.at(list, 900) O(n) ✗

   TUPLE {:ok, user}  — contiguous, fixed size
   ┌──────┬──────┐
   │ :ok  │ user │   elem(t,0) O(1) ✓   put_elem copies the whole tuple
   └──────┴──────┘

   USE LISTS for: many homogeneous items you will iterate
   USE TUPLES for: a few heterogeneous fields you will match`,
    takeaway:"Lists repeat and are walked. Tuples have a shape and are matched."
  },
  code:[
    {title:"List mechanics", note:"Feel the head/tail structure.", code:`list = [1, 2, 3]
hd(list)          # 1
tl(list)          # [2, 3]
[0 | list]        # [0,1,2,3]   fast
list ++ [4]       # [1,2,3,4]   slow, walks the whole list
length(list)      # walks the list — O(n)

[head | tail] = [10, 20, 30]
head   # 10
tail   # [20, 30]`},
    {title:"Tuple mechanics", note:"", code:`t = {:ok, "payload", 200}
elem(t, 0)          # :ok
tuple_size(t)       # 3
put_elem(t, 2, 404) # a NEW tuple

{status, body, code} = t
status  # :ok`},
    {title:"Why the guideline is real", note:"Benchmark the wrong choice once and you will never forget it.", code:`big = Enum.to_list(1..200_000)

# fast: prepend
:timer.tc(fn -> [0 | big] end) |> elem(0)          # microseconds ~1

# slow: append
:timer.tc(fn -> big ++ [0] end) |> elem(0)         # thousands of µs

# idiomatic: build reversed, then reverse once
Enum.reduce([1,2,3], [], fn x, acc -> [x | acc] end) |> Enum.reverse()`}
  ]
},
{
  id:7, mod:"2 · Pattern Matching", title:"= is a match, not an assignment",
  front:"Why does `1 = x` compile, and what does the `=` operator actually do?",
  back:"`=` is the **match operator**. It asserts that the left side and the right side have the same shape, binding any unbound variables on the left to make it true. `x = 1` binds x. `1 = x` succeeds if x already equals 1, and raises `MatchError` if not. It is an equation, not a command.",
  phil:{
    lead:"Everything you already know about lists, tuples, maps and atoms now becomes a language for describing shapes — and matching a shape is how Elixir makes decisions.",
    body:[
      "In imperative languages, `=` copies a value into a box. In Elixir `=` is closer to algebra: you write down a claim about structure, and the runtime either makes it true by binding variables, or blows up loudly because your data was not the shape you expected.",
      "That loud failure is a feature. Instead of defensively checking `if response != nil and response.status == 200`, you write `{:ok, %{status: 200, body: body}} = response` and you are done: either you have `body`, or the process crashes with a message showing exactly what it got instead. Combined with supervision (later cards), crashing on unexpected shapes is safer than limping along with bad data.",
      "From here on, almost every construct — function heads, `case`, `with`, `receive`, `for` — is just pattern matching wearing a different hat. Learn it once, get all of them."
    ],
    diagram:`         x  =  1              1  =  x            {a, b} = {1, 2}
         ▲     ▲              ▲     ▲
         │     │              │     └── already bound to 1
      unbound  │            literal
         │     │              │
      BINDS x=1 ✓          ASSERTS equal ✓      BINDS a=1, b=2 ✓


   {:ok, body} = {:error, :timeout}
    └────┬───┘    └──────┬───────┘
      expected         actual        ⇒  ** (MatchError)  💥 loud, immediate

   "match" answers TWO questions at once:
        1. is this the shape I expected?      (a test)
        2. give me the pieces inside it       (a destructure)`,
    takeaway:"= asserts a shape and binds the holes. Failure is a crash, and that is good."
  },
  code:[
    {title:"Both directions", note:"", code:`x = 1        # binds
1 = x        # asserts, ok
# 2 = x      # ** (MatchError) right hand side value: 1

{a, b} = {:ok, "payload"}
a  # :ok
b  # "payload"

# _ matches anything and discards it
{_, value} = {:ignored, 42}
value`},
    {title:"match?/2 — a boolean test", note:"Useful in filters and tests where you do not want a crash.", code:`match?({:ok, _}, {:ok, 1})       # true
match?({:ok, _}, {:error, :x})   # false

[{:ok, 1}, {:error, :nope}, {:ok, 3}]
|> Enum.filter(&match?({:ok, _}, &1))`},
    {title:"Crash-on-surprise style", note:"This is idiomatic, not sloppy.", code:`# say this comes from an HTTP client
response = {:ok, %{status: 200, body: "hi"}}

{:ok, %{status: 200, body: body}} = response
body     # "hi"

# if the server returned 500 you get an immediate, descriptive crash
# instead of a nil sneaking three layers deeper into your code`}
  ]
},
{
  id:8, mod:"2 · Pattern Matching", title:"Destructuring nested data",
  front:"Given `%{user: %{name: name, roles: [primary | _]}} = payload`, what did you just extract in one line?",
  back:"Both the user's name AND their first role, while simultaneously asserting that `payload` has a `:user` key, that the user has `:name` and `:roles`, and that `roles` is a non-empty list. One line, one shape, many guarantees. Map patterns are **partial** — extra keys are allowed and ignored — while list and tuple patterns are exact.",
  phil:{
    lead:"Real payloads are nested. Pattern matching lets you reach into them declaratively, describing the shape you need instead of navigating it step by step.",
    body:[
      "Notice the asymmetry, because it is deliberate. A map pattern says 'this map must contain at least these keys'. That makes it perfect for JSON payloads, options and structs, where new fields appear over time and old code should keep working. A tuple pattern says 'exactly this many elements'; a list pattern with `[a, b]` means exactly two.",
      "This is Elixir's answer to the endless `payload && payload.user && payload.user.roles && payload.user.roles[0]` dance. You write the shape you require. If reality disagrees, you find out immediately and precisely.",
      "Everywhere you go next — parsing HTTP params, reading a database row, handling a websocket frame — this exact skill is what you will use."
    ],
    diagram:`   payload = %{
     user: %{ name: "Ada", roles: ["admin","dev"], email: "a@b.c" },
     meta: %{ ip: "1.2.3.4" }
   }

   %{user: %{name: name, roles: [primary | rest]}} = payload
        │         │            │        │
        │         │            │        └── rest  = ["dev"]
        │         │            └─────────── primary = "admin"
        │         └──────────────────────── name  = "Ada"
        └────────────────────────────────── :meta and :email simply ignored

   MAPS   %{a: 1}        partial  → matches any map containing :a   ✓ open
   TUPLES {a, b}         exact    → must be exactly 2 elements      ✗ closed
   LISTS  [a, b]         exact    → exactly 2;  [a | rest] = 1+`,
    takeaway:"Describe the shape you need. Maps are open, tuples and lists are exact."
  },
  code:[
    {title:"Reach in deep", note:"", code:`payload = %{
  user: %{name: "Ada", roles: ["admin", "dev"], email: "a@b.c"},
  meta: %{ip: "1.2.3.4"}
}

%{user: %{name: name, roles: [primary | rest]}} = payload
name; primary; rest`},
    {title:"Open vs closed", note:"", code:`%{a: x} = %{a: 1, b: 2, c: 3}    # ok, maps are partial
x

# [a, b] = [1, 2, 3]             # MatchError — lists are exact
[a, b | rest] = [1, 2, 3, 4]     # ok
rest                             # [3, 4]`},
    {title:"Real-world: HTTP params", note:"Exactly how you will read Phoenix params later.", code:`params = %{"page" => %{"size" => 25, "num" => 2}, "q" => "elixir"}

%{"page" => %{"size" => size}, "q" => q} = params
{size, q}

# string keys and atom keys are DIFFERENT keys — a classic first bug
%{"q" => _} = params      # ok
# %{q: _} = params        # MatchError`}
  ]
},
{
  id:9, mod:"2 · Pattern Matching", title:"The pin operator ^",
  front:"`expected = 200` then `^expected = status`. What does the caret change?",
  back:"Without `^`, a variable on the left of `=` is REBOUND. With `^` it is **pinned** — its current value is used as a literal to match against. `^expected = status` means 'assert status equals 200'. You will need this constantly in `case`, function guards, and especially Ecto queries.",
  phil:{
    lead:"Since a bare name on the left always binds, Elixir needs one explicit symbol for the opposite intention: compare, do not rebind.",
    body:[
      "This tiny operator prevents a whole class of silent bugs. Imagine matching `case resp do {:ok, status} -> ...` when you meant to check a specific status — without the pin you would happily rebind `status` to anything and your check would always pass. The caret makes the intention visible in the code.",
      "It matters far beyond toy examples. When you write Ecto queries against Postgres, `where: u.id == ^user_id` uses the pin to mean 'take the value from Elixir and send it as a bound SQL parameter'. That is not decoration — it is what makes your queries injection-safe. Every value you interpolate into a query gets pinned, and Ecto turns it into `$1` in the SQL.",
      "So: caret means 'this value comes from outside, use it as data'. Hold that meaning; it returns in card 58."
    ],
    diagram:`   expected = 200

   expected = 404      →  REBIND.  expected is now 404.  no error. 😱
   ^expected = 404     →  MATCH.   200 vs 404  ⇒ MatchError ✓
   ^expected = 200     →  MATCH.   ok ✓

   ┌──────────────── where you will actually need it ─────────────────┐
   │  case  →  match against a value you already computed             │
   │  Ecto  →  from u in User, where: u.id == ^user_id                │
   │           becomes:  SELECT ... WHERE id = $1   ← bound parameter │
   │           (this is why Ecto is SQL-injection safe by default)    │
   └──────────────────────────────────────────────────────────────────┘`,
    takeaway:"^ means compare with the existing value instead of rebinding it."
  },
  code:[
    {title:"Rebind vs pin", note:"", code:`expected = 200

expected = 404       # rebinds! no error
expected             # 404

expected = 200
# ^expected = 404    # ** (MatchError)
^expected = 200      # ok`},
    {title:"Pin inside case", note:"The bug the pin exists to prevent.", code:`allowed_status = 200
resp = {:ok, 500}

case resp do
  {:ok, ^allowed_status} -> "great"
  {:ok, other}           -> "unexpected status #{other}"
  {:error, r}            -> "boom #{inspect(r)}"
end`},
    {title:"Preview: pin in Ecto", note:"You will write this in card 58. Same operator, same meaning.", code:`# import Ecto.Query
# user_id = 42
# from u in "users", where: u.id == ^user_id, select: u.email
#
# generated SQL:  SELECT u0."email" FROM "users" AS u0 WHERE (u0."id" = $1)
# params: [42]    ← never string-interpolated, never injectable`}
  ]
},
{
  id:10, mod:"2 · Pattern Matching", title:"Maps — the workhorse",
  front:"When do you write `%{name: \"Ada\"}` versus `%{\"name\" => \"Ada\"}`, and how do you update a key safely?",
  back:"Atom keys (`%{name: ...}`) are for data YOU control — structs, internal state, options. String keys (`%{\"name\" => ...}`) are for data from OUTSIDE — JSON bodies, HTTP params, database rows before casting. Update with `%{map | key: v}` (raises if the key is missing — good for state) or `Map.put/3` (adds it). Read with `map.key` (raises) or `map[:key]` (returns nil).",
  phil:{
    lead:"The map is Elixir's default container for a labelled record, and its two key styles mark a real trust boundary.",
    body:[
      "The atom/string distinction is not stylistic — it is a security posture. Data arriving from the network must never be blindly converted to atoms (card 4: the atom table is finite and never collected). So Phoenix hands you `%{\"email\" => ...}` with string keys, and you convert to atoms only through an explicit whitelist — which is exactly what an Ecto changeset does in card 57. When you see string keys, you are looking at untrusted input.",
      "The two access styles matter too. `map.key` is a strict access that raises if the key is absent, which is what you want for internal state where a missing key is a bug. `map[:key]` is a lenient access returning nil, which is what you want for optional data. Picking deliberately turns a class of nil-propagation bugs into immediate crashes.",
      "Maps are implemented as flat arrays under 32 keys and as HAMTs above that, so they are fast at both sizes. They are also the substrate for structs (card 24), GenServer state (card 39) and Ecto schemas (card 56)."
    ],
    diagram:`   TRUST BOUNDARY
   ─────────────────────────────────────────────────────────────
   outside world                 │        your application
   (JSON, params, CSV)           │        (structs, state)
   %{"email" => "a@b.c"}   ──cast/validate──▶   %{email: "a@b.c"}
   STRING keys, untrusted        │        ATOM keys, trusted
                                 │        (changeset does this)

   READ                          UPDATE
   map.email    raise if absent  %{map | email: v}   raise if absent
   map[:email]  nil if absent    Map.put(map,:e,v)   insert or replace
   Map.fetch(map,:email)         Map.update(map,:n,0,&(&1+1))
     → {:ok,v} | :error          Map.merge(a, b)`,
    takeaway:"String keys = untrusted input. Atom keys = your own data. Choose strict or lenient access on purpose."
  },
  code:[
    {title:"Building and reading", note:"", code:`user = %{name: "Ada", age: 36}
user.name              # "Ada"
user[:name]            # "Ada"
user[:nope]            # nil
# user.nope            # ** (KeyError)
Map.fetch(user, :age)  # {:ok, 36}
Map.fetch(user, :x)    # :error`},
    {title:"Updating", note:"The pipe-friendly forms are what you use inside GenServers.", code:`user = %{name: "Ada", age: 36}

%{user | age: 37}                    # strict update, key must exist
Map.put(user, :email, "a@b.c")       # add or replace
Map.update(user, :age, 0, &(&1 + 1)) # transform with default
Map.merge(user, %{age: 40, tz: "UTC"})
Map.delete(user, :age)
Map.keys(user); Map.values(user)`},
    {title:"Nested updates", note:"put_in / update_in save you from rebuilding by hand.", code:`state = %{users: %{1 => %{name: "Ada", visits: 3}}}

put_in(state, [:users, 1, :name], "Ada L.")
update_in(state, [:users, 1, :visits], &(&1 + 1))
get_in(state, [:users, 1, :visits])   # 3`},
    {title:"Crossing the boundary", note:"Never String.to_atom on keys from the wire.", code:`params = %{"name" => "Ada", "age" => "36", "is_admin" => "true"}

# a hand-rolled whitelist (Ecto changesets automate this):
allowed = ~w(name age)
Enum.reduce(allowed, %{}, fn k, acc ->
  case Map.fetch(params, k) do
    {:ok, v} -> Map.put(acc, String.to_existing_atom(k), v)
    :error   -> acc
  end
end)
# %{age: "36", name: "Ada"}   — is_admin was dropped ✓`}
  ]
},
{
  id:11, mod:"2 · Pattern Matching", title:"Keyword lists & options",
  front:"Why does `Repo.all(query, timeout: 5_000, log: false)` use a keyword list rather than a map?",
  back:"Keyword lists are lists of `{atom, value}` tuples. They are **ordered**, allow **duplicate keys**, and have literal syntax that can drop the brackets when last in a call. That makes them the canonical way to pass OPTIONS. Maps are for data; keyword lists are for options and for DSLs like Ecto queries, where order and repetition matter (`where:` can appear twice).",
  phil:{
    lead:"Two dictionary types exist because options and data have genuinely different requirements.",
    body:[
      "Options are read once, are few, arrive in source order, and sometimes repeat. A keyword list is literally `[{:timeout, 5000}, {:log, false}]` — a plain list you can pattern-match, prepend defaults to, and merge with `Keyword.merge/2`. Because Elixir lets you omit the square brackets for a trailing keyword list, `foo(a, b: 1, c: 2)` reads like named arguments in other languages.",
      "That same sugar is what makes Elixir DSLs possible without macro magic in the call site. `if cond do ... else ... end` is really `if(cond, [do: ..., else: ...])`. Ecto's `from u in User, where: ..., order_by: ...` is a keyword list. Once you see the trick, the language stops looking like it has special syntax.",
      "Rule: if you are looking things up by key, use a map. If you are configuring a call, use a keyword list."
    ],
    diagram:`   [timeout: 5_000, log: false]
        is literally
   [{:timeout, 5000}, {:log, false}]     ← a LIST of 2-tuples

   ┌──────────────┬──────────────────┬────────────────────────┐
   │              │ keyword list     │ map                    │
   ├──────────────┼──────────────────┼────────────────────────┤
   │ ordered      │ yes              │ no                     │
   │ dup keys     │ yes              │ no                     │
   │ lookup       │ O(n)             │ O(log n) / O(1)-ish    │
   │ used for     │ OPTIONS, DSLs    │ DATA, state, records   │
   └──────────────┴──────────────────┴────────────────────────┘

   the sugar:   foo(x, a: 1, b: 2)   ≡   foo(x, [{:a,1},{:b,2}])
   which is why:  if x do y else z end  ≡  if(x, do: y, else: z)`,
    takeaway:"Keyword lists = options and DSLs. Maps = data. The bracket-dropping sugar is why Elixir DSLs read so well."
  },
  code:[
    {title:"They are just lists of tuples", note:"", code:`opts = [timeout: 5_000, log: false]
opts == [{:timeout, 5_000}, {:log, false}]   # true

Keyword.get(opts, :timeout)          # 5000
Keyword.get(opts, :retries, 3)       # 3 (default)
Keyword.put(opts, :retries, 5)
Keyword.merge([timeout: 1, log: true], opts)`},
    {title:"The options pattern you will write in every module", note:"", code:`defmodule Fetcher do
  @defaults [timeout: 5_000, retries: 3, log: true]

  def fetch(url, opts \\\\ []) do
    opts = Keyword.merge(@defaults, opts)
    {url, opts[:timeout], opts[:retries]}
  end
end

Fetcher.fetch("http://x.dev")
Fetcher.fetch("http://x.dev", timeout: 100)`},
    {title:"Duplicates and order — why Ecto needs them", note:"", code:`q = [where: "age > 18", where: "active = true", order_by: "name"]
Keyword.get_values(q, :where)   # ["age > 18", "active = true"]

# a map would have silently dropped the first where clause`},
    {title:"do/end is sugar", note:"Peek behind the curtain.", code:`if true, do: "yes", else: "no"

if true do
  "yes"
else
  "no"
end
# identical: both call if/2 with a keyword list`}
  ]
},
{
  id:12, mod:"2 · Pattern Matching", title:"Matching in function heads",
  front:"How do you write a function that behaves differently for `{:ok, v}` and `{:error, r}` without a single `if`?",
  back:"Write it twice. Elixir lets you define **multiple clauses** of the same function, each with its own pattern in the head. The runtime tries them top to bottom and runs the first that matches. This turns branching into declaration: the shape of the input selects the code, so conditionals largely disappear from idiomatic Elixir.",
  phil:{
    lead:"This is the payoff card for module 2 — pattern matching moves from an operator you use to the way you structure code.",
    body:[
      "Every branch you would write as an if/else in another language becomes a clause here. The benefit is not brevity, it is exhaustiveness and locality: each case sits at the top level of its own function body, at the same indentation, with its own name in the stack trace. Deeply nested conditionals are structurally hard to write in Elixir, which is a large part of why Elixir codebases stay flat and readable.",
      "It also gives you honest failure. If no clause matches, you get FunctionClauseError naming the function and the arguments — a far better error than a nil that surfaces three modules later. Add a catch-all clause only when you genuinely want to handle the unknown case.",
      "Order matters: clauses are tried in source order, so specific patterns must come before general ones. The compiler warns you when a clause can never match."
    ],
    diagram:`   def handle({:ok, value}),      do: ...   ◀── tried 1st
   def handle({:error, reason}),  do: ...   ◀── tried 2nd
   def handle(other),             do: ...   ◀── catch-all, tried last

              input  {:error, :timeout}
                        │
        ┌───────────────┼───────────────┐
        ▼               ▼               ▼
    {:ok, v}?      {:error, r}?      other?
      ✗ no            ✓ MATCH        (never reached)
                        │
                        ▼  r = :timeout

   no match at all  ⇒  ** (FunctionClauseError) no function clause
                       matching in Mod.handle/1 with arg {:weird}

   ORDER MATTERS: put specific clauses above general ones.`,
    takeaway:"Multiple clauses replace if/else. The input's shape chooses the code path."
  },
  code:[
    {title:"Branching by shape", note:"Paste the whole module into iex — it compiles in memory.", code:`defmodule Result do
  def describe({:ok, value}),        do: "success: #{inspect(value)}"
  def describe({:error, :timeout}),  do: "the server was too slow"
  def describe({:error, reason}),    do: "failed: #{inspect(reason)}"
  def describe(other),               do: "unknown: #{inspect(other)}"
end

Result.describe({:ok, 42})
Result.describe({:error, :timeout})
Result.describe({:error, :nope})
Result.describe(:banana)`},
    {title:"Recursion falls out naturally", note:"The empty-list clause is the base case.", code:`defmodule MyList do
  def sum([]),             do: 0
  def sum([head | tail]),  do: head + sum(tail)

  def map([], _f),            do: []
  def map([h | t], f),        do: [f.(h) | map(t, f)]
end

MyList.sum([1,2,3,4])
MyList.map([1,2,3], fn x -> x * x end)`},
    {title:"Matching maps in the head", note:"This is exactly how Phoenix controllers read params.", code:`defmodule Router do
  def route(%{"action" => "show", "id" => id}), do: "showing #{id}"
  def route(%{"action" => "index"}),            do: "listing all"
  def route(%{"action" => a}),                  do: "no such action: #{a}"
end

Router.route(%{"action" => "show", "id" => "7"})
Router.route(%{"action" => "index", "page" => "2"})`}
  ]
},
{
  id:13, mod:"3 · Functions & Flow", title:"Modules & named functions",
  front:"What is `Enum.map/2` — and what do the dot and the slash-2 actually mean?",
  back:"`Enum` is a **module** (a namespace of functions, compiled into one BEAM file). `map` is a public function inside it, defined with `def`. `/2` is its **arity** — the number of arguments. In Elixir, name+arity is the identity of a function: `map/2` and `map/3` are entirely different functions. `defp` makes a function private to its module.",
  phil:{
    lead:"Elixir has no objects. It has modules holding functions, and data passed between them. That is the whole organising principle.",
    body:[
      "Coming from OOP, the instinct is to look for the class that owns the data. There is none. A `%User{}` map has no methods; `Accounts.deactivate(user)` is a function in a module that takes a user and returns a new one. Data and behaviour are deliberately separated, which is what makes it safe to send data to another process — you are sending values, never live objects with hidden state.",
      "Arity being part of the name is more important than it sounds. It is why you see `&Enum.map/2` in captures, `{Mod, :fun, 2}` in stack traces, and why default arguments generate several arities from one definition. When someone says 'implement `handle_call/3`', they are naming an exact contract.",
      "Modules nest by convention only: `MyApp.Accounts.User` is one flat atom with dots in it, not a hierarchy. Nesting communicates intent to humans and nothing to the compiler."
    ],
    diagram:`   defmodule MyApp.Accounts do        module name is just an atom:
     def create(attrs), do: ...        :"Elixir.MyApp.Accounts"
     def create(attrs, opts), do: ...
     defp validate(attrs), do: ...     private — invisible outside
   end

   MyApp.Accounts.create/1  ─┐  DIFFERENT functions.
   MyApp.Accounts.create/2  ─┘  name + arity = identity

   ┌── OOP ────────────────┐   ┌── Elixir ────────────────────┐
   │ user.deactivate()     │   │ Accounts.deactivate(user)    │
   │ data owns behaviour   │   │ data is inert; modules act   │
   │ object has state      │   │ value in → new value out     │
   └───────────────────────┘   └──────────────────────────────┘`,
    takeaway:"Modules group functions; data is inert. name/arity is the true function name."
  },
  code:[
    {title:"Define one in iex", note:"Whole modules can be pasted straight into the shell.", code:`defmodule Math do
  @moduledoc "Small maths helpers."

  @doc "Squares a number."
  def square(n), do: n * n

  def cube(n) do
    n * square(n)
  end

  defp secret, do: :hidden
end

Math.square(5)
Math.cube(3)
# Math.secret()      # ** (UndefinedFunctionError) — defp is private
h Math.square`},
    {title:"Arity is identity", note:"", code:`defmodule Greeter do
  def hello(name), do: "hi #{name}"
  def hello(name, title), do: "hi #{title} #{name}"
end

Greeter.hello("Ada")
Greeter.hello("Ada", "Dr.")
function_exported?(Greeter, :hello, 1)   # true
function_exported?(Greeter, :hello, 3)   # false`},
    {title:"Default arguments generate arities", note:"Note the double backslash.", code:`defmodule Pager do
  def page(items, num \\\\ 1, size \\\\ 10) do
    Enum.slice(items, (num - 1) * size, size)
  end
end

Pager.page(Enum.to_list(1..30))
Pager.page(Enum.to_list(1..30), 2)
Pager.page(Enum.to_list(1..30), 2, 5)
# one definition, three arities: page/1, page/2, page/3`}
  ]
},
{
  id:14, mod:"3 · Functions & Flow", title:"Anonymous functions & capture",
  front:"Why does calling an anonymous function need a dot — `f.(1)` — while a named one does not?",
  back:"Because they are different things. A named function is resolved at compile time from module+name+arity. An anonymous function is a **value** held in a variable, and the dot says explicitly 'invoke the function stored in this name' rather than 'call a local function called f'. `&Mod.fun/1` captures a named function as a value, and `&(&1 * 2)` is shorthand for a small anonymous function.",
  phil:{
    lead:"Functions are values you can put in lists, send to other processes, and store in state. The dot marks the moment a value becomes a call.",
    body:[
      "This ceremony is unusual but it removes real ambiguity: in Elixir you can have a variable `length` and a function `length/1` in scope at the same time, and the syntax tells you unambiguously which you meant. Erlang made the same choice for the same reason.",
      "The capture operator `&` is the workhorse. `&String.upcase/1` turns a named function into a value with zero boilerplate. `&(&1 + &2)` builds a two-argument lambda inline. You will see it constantly in pipelines, in `Enum` calls, and in supervisor child specs where you hand a function to be run in another process.",
      "Anonymous functions are closures: they capture the variables in scope when they were created. Because those values are immutable, sending a closure to another process is safe — nothing it captured can change under it."
    ],
    diagram:`   double = fn n -> n * 2 end      double.(21)      ← DOT required
   double = &(&1 * 2)              same thing, shorthand
   upcase = &String.upcase/1       capture a NAMED function as a value

   &1 &2 &3  =  first, second, third argument

   ┌── why the dot ────────────────────────────────────┐
   │  length = fn l -> :custom end                     │
   │  length([1,2,3])   → calls Kernel.length/1  → 3   │
   │  length.([1,2,3])  → calls YOUR function → :custom│
   │  no ambiguity, ever                               │
   └───────────────────────────────────────────────────┘

   functions are VALUES:
   [&String.upcase/1, &String.reverse/1]
   |> Enum.reduce("hello", fn f, acc -> f.(acc) end)   # "OLLEH"`,
    takeaway:"fn ... end makes a value; the dot calls it; & captures and abbreviates."
  },
  code:[
    {title:"Three ways to write the same lambda", note:"", code:`a = fn n -> n * 2 end
b = &(&1 * 2)
c = fn
  n when is_integer(n) -> n * 2
  n -> n
end

a.(21); b.(21); c.(21)`},

{
  id:15, mod:"3 · Functions & Flow", title:"Guards",
  front:"Function clauses match on shape. How do you branch on a CONDITION, like 'only if n is a positive integer'?",
  back:"A **guard**: `def f(n) when is_integer(n) and n > 0`. Guards run after the pattern matches and must be built only from a whitelist of side-effect-free, guaranteed-to-terminate expressions (`is_*`, comparisons, arithmetic, `in`, `and/or/not`). A guard that raises simply fails the clause instead of crashing — so you can safely test things that would otherwise error.",
  phil:{
    lead:"Guards extend pattern matching from 'what shape is this' to 'what shape is this, and does it satisfy a cheap predicate'.",
    body:[
      "The restricted grammar is not an oversight. Guards are evaluated by the BEAM in a special context: they cannot have side effects, cannot loop forever, and are used in places like `receive` clauses where arbitrary code would be catastrophic. That is why you cannot call your own function in a guard — unless you define it with `defguard`, which macro-expands into allowed primitives.",
      "The failure semantics are elegant. `def f(x) when x.age > 18` on a non-map does not blow up; the guard just fails and the next clause is tried. This makes guards a safe filter over messy input, which is exactly what you want at the edges of a service.",
      "Guards also appear in `case`, `cond`, `with`, `for` and `receive`. Once again: learn the concept once, reuse it in six places."
    ],
    diagram:`   def bucket(n) when is_integer(n) and n < 0,     do: :negative
   def bucket(0),                                   do: :zero
   def bucket(n) when is_integer(n) and n <= 100,   do: :small
   def bucket(n) when is_integer(n),                do: :large
   def bucket(_),                                   do: :not_a_number
                    └────────── GUARD ──────────┘

     match shape ──▶ run guard ──▶ true?  ── yes ─▶ execute body
                          │          │
                          │          no  ─▶ try the NEXT clause
                     raises? ─────────────▶ treated as false (no crash) ✓

   ALLOWED IN GUARDS            NOT ALLOWED
   is_integer/is_map/is_pid…    your own functions (unless defguard)
   ==  !=  <  >  <=  >=         String.contains?/2, Enum.*, IO.*
   +  -  *  div  rem  abs       anything with side effects
   in, and, or, not             case/if with side effects
   map_size, length, hd, tl, elem, byte_size, binary_part`,
    takeaway:"Guards are cheap, pure, non-crashing predicates attached to a pattern."
  },
  code:[
    {title:"Classify input", note:"", code:`defmodule Bucket do
  def of(n) when is_integer(n) and n < 0,   do: :negative
  def of(0),                                 do: :zero
  def of(n) when is_integer(n) and n <= 100, do: :small
  def of(n) when is_integer(n),              do: :large
  def of(n) when is_binary(n),               do: :a_string
  def of(_),                                 do: :unknown
end

Enum.map([-5, 0, 7, 9999, "hi", :atom], &Bucket.of/1)`},
    {title:"Guards do not crash", note:"A failing guard just skips the clause.", code:`defmodule Age do
  def adult?(%{age: age}) when age >= 18, do: true
  def adult?(_), do: false
end

Age.adult?(%{age: 30})    # true
Age.adult?(%{age: 10})    # false
Age.adult?("nonsense")    # false — no crash ✓
Age.adult?(nil)           # false`},
    {title:"defguard — reusable, composable", note:"", code:`defmodule Checks do
  defguard is_pos_int(n) when is_integer(n) and n > 0
  defguard is_http_ok(s) when is_integer(s) and s >= 200 and s < 300

  def take(n) when is_pos_int(n), do: "taking #{n}"
  def take(_), do: "invalid"

  def handle(status) when is_http_ok(status), do: :fine
  def handle(_), do: :problem
end

Checks.take(5); Checks.take(-1); Checks.handle(204); Checks.handle(500)`},

  @redirects [301, 302, 307, 308]
  def kind(s) when s in 200..299, do: :success
  def kind(s) when s in @redirects, do: :redirect
  def kind(s) when s in 400..499 when s == 418, do: :client_error
  def kind(s) when s >= 500, do: :server_error
end

Enum.map([200, 302, 404, 503], &Http.kind/1)`}

{
  id:16, mod:"3 · Functions & Flow", title:"The pipe operator |>",
  front:"Rewrite `Enum.sum(Enum.filter(Enum.map(list, &(&1*2)), &(&1>4)))` so a human can read it.",
  back:"`list |> Enum.map(&(&1*2)) |> Enum.filter(&(&1>4)) |> Enum.sum()`. The pipe takes the value on its left and injects it as the FIRST argument of the function on its right. This is why every Elixir standard-library function takes its subject first — the whole library is designed to be piped.",
  phil:{
    lead:"The pipe turns nested calls inside-out, so code reads in the order it executes: data first, then each transformation.",
    body:[
      "This is more than sugar. It shapes API design across the entire ecosystem. `Enum.map(list, fun)`, `Map.put(map, k, v)`, `Plug.Conn.put_status(conn, 404)`, `Ecto.Changeset.cast(changeset, attrs, fields)` — the subject is always first, precisely so it can flow. When you write your own modules, follow the same rule or your functions will feel foreign.",
      "A pipeline is also a picture of a data transformation, which is what a backend request really is. In card 48 you will see a Phoenix request as `conn |> parse |> authenticate |> authorize |> handle |> render` — the same shape, at the level of a whole web framework.",
      "Two habits keep pipelines honest: start from a plain value, not a function call, and keep every step returning the same kind of thing. When a step could fail, you want `with` (card 22) instead."
    ],
    diagram:`   NESTED (read inside-out, right-to-left) 😖
   Enum.sum(Enum.filter(Enum.map(list, f), g))
        ▲        ▲          ▲
        4        3          2      1 = list

   PIPED (read top-to-bottom, in execution order) 😀
   list
   |> Enum.map(f)          x |> f(a, b)   ≡   f(x, a, b)
   |> Enum.filter(g)                          └── x goes FIRST
   |> Enum.sum()

   ┌────────┐   ┌────────┐   ┌────────┐   ┌────────┐
   │  list  │──▶│  map   │──▶│ filter │──▶│  sum   │──▶ 18
   └────────┘   └────────┘   └────────┘   └────────┘

   this is why every Elixir API puts the SUBJECT first.`,
    takeaway:"x |> f(a) is f(x, a). Design your own functions subject-first so they pipe."
  },
  code:[
    {title:"Flatten a nest", note:"", code:`list = [1, 2, 3, 4, 5]

Enum.sum(Enum.filter(Enum.map(list, &(&1 * 2)), &(&1 > 4)))

list
|> Enum.map(&(&1 * 2))
|> Enum.filter(&(&1 > 4))
|> Enum.sum()`},
    {title:"A realistic text pipeline", note:"Word frequency in 6 readable steps.", code:`"""
the quick brown fox jumps over the lazy dog
the dog barks and the fox runs
"""
|> String.downcase()
|> String.split(~r/[^a-z]+/, trim: true)
|> Enum.frequencies()
|> Enum.sort_by(fn {_word, count} -> -count end)
|> Enum.take(5)`},
    {title:"Piping into your own subject-first API", note:"", code:`defmodule Cart do
  def new(), do: %{items: [], total: 0}
  def add(cart, name, price) do
    %{cart | items: [name | cart.items], total: cart.total + price}
  end
  def discount(cart, pct), do: %{cart | total: round(cart.total * (1 - pct/100))}
end

Cart.new()
|> Cart.add("book", 1200)
|> Cart.add("pen", 300)
|> Cart.discount(10)`},
    {title:"Pipe pitfalls", note:"Two rules that save real debugging time.", code:`# 1. start from a value, not a call
# BAD:  String.split("a b") |> Enum.count()
# GOOD:
"a b" |> String.split() |> Enum.count()

# 2. anonymous functions need then/2 (or the capture form)
[1,2,3]
|> Enum.sum()
|> then(fn total -> "total is #{total}" end)

# tap/2 lets you peek without breaking the chain
[1,2,3]
|> tap(&IO.inspect(&1, label: "before"))
|> Enum.map(&(&1 * 10))
|> IO.inspect(label: "after")`}
  ]

{
  id:17, mod:"3 · Functions & Flow", title:"Enum — the standard vocabulary",
  front:"You need to group 10k orders by status, sum each group's total, and keep only groups over $1000. Which module, and roughly which functions?",
  back:"`Enum` — the eager, universal collection API: `group_by/2`, then `Map.new/2` with `Enum.sum`, then `Enum.filter/2`. Enum works on anything implementing the `Enumerable` protocol: lists, maps, ranges, streams, and even Ecto results. Learning ~20 of its functions covers most day-to-day Elixir.",
  phil:{
    lead:"Elixir has no for-loops. Enum is the loop, expressed as a vocabulary of intentions.",
    body:[
      "Each Enum function names WHAT you want rather than HOW to iterate: map means transform each, filter means keep some, reduce means fold into an accumulator, group_by means partition by a key. Because the intention is in the name, a pipeline of Enum calls is close to a plain-English description of the transformation — which is a real advantage when you return to code six months later.",
      "`reduce/3` is the primitive underneath all the others; everything else could be written with it. Learn it properly, because in card 20 you will see that reduce is itself just recursion with an accumulator, and in card 39 you will see that a GenServer is a reduce over incoming messages that never ends. It is the same idea at three scales.",
      "Enum is EAGER: every step builds a full intermediate collection. That is exactly right for a few thousand items and exactly wrong for a million-row file — which is what the next card is for."
    ],
    diagram:`   THE 20 THAT COVER 90% OF REAL CODE

   transform     map/2  flat_map/2  with_index/2  zip/2
   select        filter/2  reject/2  take/2  drop/2  take_while/2  uniq/2
   collapse      reduce/3  sum/1  count/1  min_max/1  join/2  frequencies/1
   reorganise    sort/1  sort_by/2  group_by/2  chunk_every/2  split/2
   ask           any?/2  all?/2  find/2  member?/2  empty?/1
   convert       into/2  Map.new/2  Enum.to_list/1

   reduce IS the engine:
   [1,2,3] |> Enum.reduce(0, fn x, acc -> acc + x end)
              acc=0 ─x=1─▶ 1 ─x=2─▶ 3 ─x=3─▶ 6

   map, filter, sum, group_by … all expressible as reduce.`,
    takeaway:"Name the intention, not the loop. reduce is the primitive under all of it."
  },
  code:[
    {title:"The order report from the question", note:"", code:`orders = [
  %{id: 1, status: :paid,    total: 500},
  %{id: 2, status: :paid,    total: 900},
  %{id: 3, status: :pending, total: 300},
  %{id: 4, status: :refunded,total: 150},
  %{id: 5, status: :pending, total: 1200}
]

orders
|> Enum.group_by(& &1.status, & &1.total)
|> Map.new(fn {status, totals} -> {status, Enum.sum(totals)} end)
|> Enum.filter(fn {_status, sum} -> sum > 1000 end)`},
    {title:"reduce, the engine", note:"Rebuild map and filter from it to prove the point.", code:`Enum.reduce([1,2,3,4], 0, fn x, acc -> acc + x end)

# map via reduce
Enum.reduce([1,2,3], [], fn x, acc -> [x * 2 | acc] end) |> Enum.reverse()

# a word counter via reduce
~w(a b a c b a)
|> Enum.reduce(%{}, fn w, acc -> Map.update(acc, w, 1, &(&1 + 1)) end)

# reduce_while for early exit
Enum.reduce_while(1..1_000_000, 0, fn i, acc ->
  if acc > 100, do: {:halt, acc}, else: {:cont, acc + i}
end)`},
    {title:"The rest of the vocabulary", note:"", code:`Enum.with_index(["a","b","c"])
Enum.chunk_every(1..10, 3)
Enum.zip([1,2,3], [:a,:b,:c])
Enum.sort_by([%{n: 3},%{n: 1}], & &1.n)
Enum.join(["a","b","c"], ", ")
Enum.uniq_by([%{id: 1},%{id: 1},%{id: 2}], & &1.id)
Enum.any?([1,2,3], &(&1 > 2))
Enum.find([1,2,3], &(&1 > 1))
Enum.into([a: 1, b: 2], %{})
Enum.frequencies(~w(x y x))
Enum.min_max([5,1,9])`},
    {title:"Enum works on more than lists", note:"Anything implementing Enumerable.", code:`Enum.map(1..5, &(&1 * &1))                 # a Range
Enum.map(%{a: 1, b: 2}, fn {k, v} -> {k, v * 10} end)   # a Map
Enum.take(Stream.cycle([:a, :b]), 5)       # an infinite Stream
File.stream!("/etc/hosts") |> Enum.take(3) # a File stream`}
  ]

{
  id:18, mod:"3 · Functions & Flow", title:"Stream — laziness",
  front:"You must process a 4GB CSV and sum one column. Why does the Enum pipeline from the last card kill your server, and what replaces it?",
  back:"Enum is eager: `File.read!` loads 4GB into memory, and every `Enum.map` builds another full copy. `Stream` is lazy — it composes the operations into a single recipe and runs them one element at a time, only when a final eager function (`Enum.sum`, `Stream.run`, `Enum.to_list`) pulls. Constant memory, one pass.",
  phil:{
    lead:"Same vocabulary, different execution strategy: describe the pipeline first, run it element by element later.",
    body:[
      "Every `Stream` function returns a new Stream struct rather than data. Nothing happens until something demands a value. Then one element is pulled through the whole chain, emitted, and discarded before the next is read. Memory stays flat whether the source is 100 rows or 100 million.",
      "This is your first taste of a much bigger BEAM idea: **demand-driven flow**. The consumer asks, the producer supplies. That is the exact model of GenStage, Broadway and Flow, the libraries used for real data pipelines in Elixir, and it is how backpressure works — a slow consumer automatically slows the producer instead of exploding a queue.",
      "The trade-off is per-element overhead. For a few thousand items in memory, Enum is faster. Use Stream when the collection is large, infinite, or comes from I/O."
    ],
    diagram:`   EAGER (Enum)                     LAZY (Stream)
   ────────────────────────         ─────────────────────────────
   [1..1_000_000]                   [1..1_000_000]
        │  builds full list              │  builds a RECIPE
        ▼                                ▼
   [x2 ...] 1M items in RAM        Stream{ops: [map, filter]}
        │                                │
        ▼                                │  Enum.sum() pulls ⇒
   [filtered] another list          1 ─▶ map ─▶ filter ─▶ acc
        │                           2 ─▶ map ─▶ filter ─▶ acc
        ▼                           3 ─▶ …   (one at a time)
       sum                                │
                                          ▼  constant memory ✓
   4GB file + Enum  =  💥            4GB file + Stream = 😌

   Streams are also INFINITE-safe:
   Stream.iterate(1, &(&1*2)) |> Enum.take(10)`,
    takeaway:"Stream builds a recipe; an eager call runs it one element at a time. Demand pulls data."
  },
  code:[
    {title:"Lazy is visible", note:"Watch when the IO.inspect actually fires.", code:`stream =
  1..5
  |> Stream.map(fn x -> IO.inspect(x, label: "mapping"); x * 2 end)
  |> Stream.filter(fn x -> x > 4 end)

# nothing printed yet — it is only a recipe:
stream

# now pull:
Enum.to_list(stream)`},
    {title:"The 4GB file, safely", note:"Constant memory regardless of file size.", code:`# create a sample file first
File.write!("/tmp/nums.csv", Enum.map_join(1..200_000, "\\n", &"row#{&1},#{&1}"))

total =
  "/tmp/nums.csv"
  |> File.stream!()                       # lazy, line by line
  |> Stream.map(&String.trim/1)
  |> Stream.map(&String.split(&1, ","))
  |> Stream.map(fn [_name, amount] -> String.to_integer(amount) end)
  |> Enum.sum()                           # only NOW does it read

total`},
    {title:"Infinite streams", note:"Impossible with Enum.", code:`Stream.iterate(1, &(&1 * 2)) |> Enum.take(10)
Stream.cycle([:red, :green, :blue]) |> Enum.take(7)
Stream.repeatedly(fn -> :rand.uniform(100) end) |> Enum.take(5)

# fibonacci
Stream.unfold({0, 1}, fn {a, b} -> {a, {b, a + b}} end) |> Enum.take(12)`},
    {title:"Chunked writes — the ETL shape", note:"Read lazily, batch, write. This is a real import job.", code:`"/tmp/nums.csv"
|> File.stream!()
|> Stream.map(&String.trim/1)
|> Stream.chunk_every(1_000)              # batch for the DB
|> Stream.map(fn batch -> {:inserted, length(batch)} end)
|> Enum.take(3)
# later you will replace the map with Repo.insert_all/3`}
  ]
},
{
  id:19, mod:"3 · Functions & Flow", title:"Comprehensions (for)",
  front:"`for` in Elixir is not a loop. What is it, and what do `into:` and the filter position do?",
  back:"`for` is a **comprehension**: it draws elements from one or more generators, keeps only those matching the generator pattern and any filters, transforms each, and collects results — into a list by default, or into anything with `into:`. It is Enum.map + Enum.filter + Enum.into with pattern matching built in, and multiple generators nest as a cartesian product.",
  phil:{
    lead:"A comprehension is a declarative description of a set: take these, where this holds, produce that.",
    body:[
      "The under-appreciated feature is that a generator pattern that does not match simply SKIPS the element — no crash, no separate filter step. `for {:ok, value} <- results` is the cleanest way in the language to keep only successes from a list of tagged tuples. You will use that exact line when processing batches of database or HTTP results.",
      "`into:` makes the output shape explicit, which is how you build a map, a binary or even write into a file stream directly. And `reduce:` (Elixir 1.8+) turns a comprehension into a fold when you need an accumulator.",
      "Use `for` when the shape of the transformation is set-like and readable; use pipelines of Enum when it is a sequence of stages. Both compile to efficient code."
    ],
    diagram:`   for  x <- 1..3,          ← generator (can be several)
        y <- [:a, :b],      ← nested: cartesian product
        x != 2,             ← filter (any boolean expression)
        do: {x, y}          ← the element to emit
   ⇒ [{1,:a},{1,:b},{3,:a},{3,:b}]

   PATTERN IN THE GENERATOR = automatic filter, no crash:
   for {:ok, v} <- [{:ok,1}, {:error,:x}, {:ok,3}], do: v   ⇒ [1, 3]
                        └── does not match ⇒ silently skipped ✓

   into: chooses the container
   for {k, v} <- [a: 1, b: 2], into: %{}, do: {k, v * 10}  ⇒ %{a:10,b:20}
   for c <- ~w(a b c), into: "", do: String.upcase(c)      ⇒ "ABC"

   reduce: turns it into a fold
   for x <- 1..5, reduce: 0 do acc -> acc + x end          ⇒ 15`,
    takeaway:"for = generators + patterns-as-filters + into:. Non-matching elements are skipped, not fatal."
  },
  code:[
    {title:"Basics and cartesian product", note:"", code:`for x <- 1..5, do: x * x
for x <- 1..3, y <- [:a, :b], do: {x, y}
for x <- 1..10, rem(x, 3) == 0, do: x

# a deck of cards in one line
for rank <- ~w(A K Q J), suit <- ~w(♠ ♥ ♦ ♣), do: rank <> suit`},

for {:ok, v} <- results, do: v            # [1, 3]
for {:error, r} <- results, do: r         # [:timeout, :nope]

users = [%{name: "Ada", age: 36}, %{name: "Kid", age: 9}]
for %{name: n, age: a} <- users, a >= 18, do: n`},
    {title:"into: and reduce:", note:"", code:`for {k, v} <- [a: 1, b: 2, c: 3], into: %{}, do: {k, v * 10}
for c <- ~w(e l i x i r), into: "", do: String.upcase(c)

for x <- 1..5, reduce: 0 do
  acc -> acc + x
end

# group into a map with reduce:
for w <- ~w(apple avocado banana), reduce: %{} do
  acc ->
    key = String.first(w)
    Map.update(acc, key, [w], &[w | &1])
end`},
    {title:"Bitstring generators", note:"Parse binary formats declaratively.", code:`pixels = <<255, 0, 0,  0, 255, 0,  0, 0, 255>>
for <<r::8, g::8, b::8 <- pixels>>, do: {r, g, b}`}
  ]
},
{
  id:20, mod:"3 · Functions & Flow", title:"Recursion instead of loops",
  front:"There is no `while`. How do you keep doing something until a condition changes — and why is this not a stack overflow risk?",
  back:"You write a function that calls itself with new arguments, and a clause that stops. When the recursive call is the LAST expression in the body, the BEAM performs **tail-call optimisation**: it reuses the same stack frame, so the loop can run forever in constant memory. That is literally how every long-running process on the BEAM works.",
  phil:{
    lead:"Recursion is not an exotic technique here. It is the loop primitive, and tail calls make an infinite loop a legitimate, memory-safe program.",
    body:[
      "Because there is no mutable loop counter, state must be passed along as arguments. That constraint forces you to name what actually changes between iterations, and the result reads like a small state machine. The accumulator pattern — carry the result so far as an extra argument — is the recursion equivalent of Enum.reduce.",
      "The tail-call rule is precise: the self-call must be the last thing evaluated. `[h | recurse(t)]` is NOT a tail call (the cons happens after), while `recurse(t, [h | acc])` is. Body-recursion is fine and often faster for short lists; tail recursion is essential for unbounded loops.",
      "Now hold this thought, because it is the bridge into concurrency. In card 33 you will write a process whose entire body is `receive a message, compute new state, call myself with it`. An infinite tail-recursive loop IS a stateful server on the BEAM. GenServer is that loop, generalised and given a name."
    ],
    diagram:`   BODY RECURSION                    TAIL RECURSION
   def sum([]), do: 0                def sum(l), do: sum(l, 0)
   def sum([h|t]), do: h + sum(t)    defp sum([], acc), do: acc
                                     defp sum([h|t], acc), do: sum(t, h+acc)
   stack grows:                      stack is FLAT:
     sum([1,2,3])                      sum([1,2,3], 0)
       1 + sum([2,3])                  sum([2,3], 1)     ← same frame reused
           2 + sum([3])                sum([3], 3)
               3 + sum([])             sum([], 6)
   ✗ unbounded input = overflow      ✓ runs forever, constant memory

   ┌─── THE BRIDGE TO CONCURRENCY (card 33) ────────────────────┐
   │  def loop(state) do                                        │
   │    receive do msg -> loop(handle(msg, state)) end   ← tail │
   │  end                                                       │
   │  an infinite tail-recursive loop = a stateful SERVER       │
   └────────────────────────────────────────────────────────────┘`,
    takeaway:"Recursion + accumulator = loop. A tail call reuses the frame, which is why BEAM servers can loop forever."
  },
  code:[
    {title:"Both styles, side by side", note:"", code:`defmodule Sum do
  # body recursion — stack grows
  def naive([]), do: 0
  def naive([h | t]), do: h + naive(t)

  # tail recursion — constant stack
  def tail(list), do: do_tail(list, 0)
  defp do_tail([], acc), do: acc
  defp do_tail([h | t], acc), do: do_tail(t, h + acc)
end

Sum.naive(Enum.to_list(1..1000))
Sum.tail(Enum.to_list(1..5_000_000))     # fine ✓`},
    {title:"State machine by recursion", note:"Countdown with a stop clause.", code:`defmodule Countdown do
  def run(0), do: IO.puts("liftoff!")
  def run(n) when n > 0 do
    IO.puts(n)
    run(n - 1)
  end
end

Countdown.run(5)`},
    {title:"Rebuilding Enum functions", note:"Proves Enum is not magic.", code:`defmodule Mine do
  def map([], _f), do: []
  def map([h | t], f), do: [f.(h) | map(t, f)]

  def filter([], _f), do: []
  def filter([h | t], f) do
    if f.(h), do: [h | filter(t, f)], else: filter(t, f)
  end

  def reduce([], acc, _f), do: acc
  def reduce([h | t], acc, f), do: reduce(t, f.(h, acc), f)

  def reverse(list), do: reduce(list, [], fn x, acc -> [x | acc] end)
end

Mine.map([1,2,3], &(&1 * 2))
Mine.filter(1..10 |> Enum.to_list(), &(rem(&1,2)==0))
Mine.reduce([1,2,3], 0, &+/2)

  def call(fun, attempts \\\\ 3, delay \\\\ 100)
  def call(fun, 1, _delay), do: fun.()
  def call(fun, attempts, delay) do
    case fun.() do
      {:ok, v} -> {:ok, v}
      {:error, _} ->
        Process.sleep(delay)
        call(fun, attempts - 1, delay * 2)     # exponential backoff
    end
  end
end

{
  id:21, mod:"4 · Shape & Contracts", title:"case, cond, if",
  front:"You already have multi-clause functions. When do you still reach for case, cond or if?",
  back:"`case` when you are matching ONE value against several patterns inside a function. `cond` when you have several unrelated boolean conditions (Elixir's else-if chain). `if/unless` only for a simple true/false. All three are ordinary expressions that RETURN a value — there is no statement/expression split in Elixir.",
  phil:{
    lead:"These are conveniences layered on pattern matching, not new mechanisms. Reach for the smallest one that fits.",
    body:[
      "`case` is multi-clause matching scoped to a single expression, guards included. It is the right tool when the branch is local and naming a whole new function would add noise. When the branches grow bodies of more than a few lines, promote them back to function clauses — flat functions beat a case with five long arms.",
      "`cond` exists because sometimes the conditions have nothing to do with one another and no single value is being matched. It reads top to bottom and raises if nothing matches, so it usually ends with `true -> default`.",
      "Two things surprise newcomers. First, only `false` and `nil` are falsy — 0 and the empty list and the empty string are all truthy. Second, every branch returns a value, so `status = case resp do ... end` is the normal way to compute something conditionally. That is why rebinding inside an if (card 3) is a mistake: you want the return value, not a side effect."
    ],
    diagram:`   ONE value, many shapes           MANY unrelated conditions
   ┌───────────────────────┐         ┌──────────────────────────────┐
   │ case resp do          │         │ cond do                      │
   │   {:ok, %{status:200}}│         │   score > 90 -> :a           │
   │       -> :fine        │         │   attempts > 3 -> :locked    │
   │   {:ok, %{status: s}} │         │   is_nil(user) -> :anon      │
   │       when s >= 500   │         │   true -> :default   ← always│
   │       -> :retry       │         │ end                    add it│
   │   {:error, r} -> …    │         └──────────────────────────────┘
   │   _ -> :unknown       │
   │ end                   │         SIMPLE boolean
   └───────────────────────┘         if x, do: a, else: b

   TRUTHINESS:   falsy = false, nil       ← that is the entire list
                 truthy = 0, "", [], %{}, :ok, everything else

   EVERYTHING RETURNS A VALUE:
       status = case resp do … end        ✓ idiomatic
       case resp do … end;  status        ✗ not how this works`,
    takeaway:"case matches one value, cond chains conditions, if is boolean. All return values."
  },
  code:[
    {title:"case with guards", note:"", code:`resp = {:ok, %{status: 503, body: ""}}

case resp do
  {:ok, %{status: 200, body: body}} -> {:done, body}
  {:ok, %{status: s}} when s >= 500 -> {:retry, s}
  {:ok, %{status: s}}               -> {:give_up, s}
  {:error, reason}                  -> {:failed, reason}
end`},

attempts = 1

cond do

if [], do: :truthy, else: :falsy       # :truthy  (!)
if "", do: :truthy, else: :falsy       # :truthy  (!)
if nil, do: :truthy, else: :falsy      # :falsy
if false, do: :truthy, else: :falsy    # :falsy

# strict boolean operators require real booleans:
true and false
# 1 and true      # ** (BadBooleanError)
1 && true         # relaxed version works on truthy values
nil || "default"`},

  def handle({:ok, %{status: 200, body: b}}), do: {:done, b}
  def handle({:ok, %{status: s}}) when s >= 500, do: {:retry, s}

{
  id:22, mod:"4 · Shape & Contracts", title:"with — the happy path",
  front:"Three steps must each succeed before you can act: find the user, check the password, mint a token. Nested cases become a pyramid. What replaces them?",
  back:"`with`. Each clause uses `<-` to match an expected success pattern. If every clause matches, the `do` block runs. The moment one does NOT match, `with` short-circuits and returns that non-matching value untouched (or routes it into an optional `else`). It is the pipeline operator for operations that can fail.",
  phil:{
    lead:"Pipelines assume every step succeeds. Real backends have steps that fail. `with` is the pipeline for fallible steps.",
    body:[
      "The elegance is that failure needs no handling code at all in the common case: the offending `{:error, :not_found}` simply becomes the return value of the whole expression, and your caller — usually a Phoenix controller — pattern-matches on it. Your business logic reads as a straight line of successes, which is how you actually think about it.",
      "This is the payoff of the tagged-tuple convention from card 4. Because the whole ecosystem agrees that success is `{:ok, x}`, `with` composes functions from different libraries — Ecto, your context modules, an HTTP client — without adapters.",
      "Use `else` sparingly. If your else block has five clauses, that is a smell: the errors are ambiguous and you probably want each step to return a distinctly tagged error like `{:error, :invalid_password}` so the caller can tell them apart."
    ],
    diagram:`   WITHOUT with — the pyramid of doom
   case find_user(email) do
     {:ok, user} ->
       case check_password(user, pw) do
         {:ok, user} ->
           case mint_token(user) do
             {:ok, token} -> {:ok, token}
             err -> err
           end
         err -> err
       end
     err -> err
   end

   WITH with — a straight line
   with {:ok, user}  <- find_user(email),
        {:ok, user}  <- check_password(user, pw),
        {:ok, token} <- mint_token(user) do
     {:ok, token}
   end

        find_user ──ok──▶ check_password ──ok──▶ mint_token ──▶ {:ok, token}
            │                  │                     │
          no match          no match              no match
            └──────────────────┴─────────────────────┴──▶ returned AS IS
                                                          (or into else)`,
    takeaway:"with chains fallible steps and returns the first mismatch untouched."
  },
  code:[
    {title:"A login flow", note:"Paste it, then flip the inputs to see each failure path.", code:`defmodule Auth do
  @users %{"ada@x.dev" => %{id: 1, pw: "lovelace", active: true}}

  def find_user(email) do
    case Map.fetch(@users, email) do
      {:ok, u} -> {:ok, u}
      :error   -> {:error, :not_found}
    end
  end

  def check_password(%{pw: pw} = u, given) when pw == given, do: {:ok, u}
  def check_password(_u, _given), do: {:error, :bad_password}

  def check_active(%{active: true} = u), do: {:ok, u}
  def check_active(_), do: {:error, :suspended}

  def mint_token(u), do: {:ok, "tok_#{u.id}_#{System.unique_integer([:positive])}"}

  def login(email, password) do
    with {:ok, user}  <- find_user(email),
         {:ok, user}  <- check_password(user, password),
         {:ok, user}  <- check_active(user),
         {:ok, token} <- mint_token(user) do
      {:ok, %{user_id: user.id, token: token}}
    end
  end
end

Auth.login("ada@x.dev", "lovelace")
Auth.login("ada@x.dev", "wrong")     # {:error, :bad_password}
Auth.login("nobody@x.dev", "x")      # {:error, :not_found}`},
