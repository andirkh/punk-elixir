{
  id:60, mod:"9 · Postgres & Ecto", title:"Transactions and Ecto.Multi",
  front:"Placing an order must insert an order, insert items, decrement stock and record a payment — all or nothing. What do you reach for, and why not a plain `Repo.transaction(fn -> ... end)`?",
  back:"`Ecto.Multi`. You NAME each step and build the whole operation as a data structure, then run it once. On failure you get `{:error, failed_step_name, failed_value, changes_so_far}` — you know exactly which step failed and what had already succeeded. A function transaction only tells you it rolled back; a Multi tells you the story, and it is composable and testable without a database.",
  phil:{
    lead:"Ecto.Multi turns a transaction from a block of imperative code into a value you can build, inspect, compose and test.",
    body:[
      "The named-step error tuple is the practical win. In a controller you can pattern-match `{:error, :payment, %Stripe.Error{}, _}` and return a different status than `{:error, :order, %Changeset{}, _}` — no parsing of exception messages, no ambiguity. And because a Multi is just data, one context can build a partial Multi and another can append to it.",
      "`Multi.run/3` is the escape hatch for steps that are not Repo operations: call an external API, compute something, check an invariant. It must return `{:ok, value}` or `{:error, value}`, and returning an error rolls the whole transaction back. That is how you keep a payment charge and a database write consistent.",
      "Two things to remember about transactions on Postgres. First, they hold a connection from the pool for their entire duration (card 54), so never put a slow HTTP call inside one if you can avoid it — do the external call first, or use an idempotency key and reconcile. Second, `Repo.rollback/1` inside a function transaction returns your value from `Repo.transaction/1` as `{:error, value}`, which is the manual equivalent."
    ],
    diagram:`   Ecto.Multi.new()
   |> Ecto.Multi.insert(:order, order_changeset)          ← named steps
   |> Ecto.Multi.insert_all(:items, Item, items_fun)
   |> Ecto.Multi.update_all(:stock, stock_query, inc: [qty: -1])
   |> Ecto.Multi.run(:payment, fn _repo, %{order: order} ->
        Billing.charge(order)          ← any function; {:ok,_} | {:error,_}
      end)
   |> Ecto.Multi.run(:notify, fn _repo, %{order: o} -> …  end)
   |> Repo.transaction()

   SUCCESS  {:ok, %{order: %Order{}, items: {2, nil}, payment: %{id: "ch_1"},
                    stock: {2, nil}, notify: :sent}}

   FAILURE  {:error, :payment, %Stripe.Error{code: :card_declined},
                     %{order: %Order{}, items: {2, nil}, stock: {2, nil}}}
                        │              │                    │
                   which step     what went wrong    what had succeeded
                                                     (all rolled back)

   ┌── a Multi is DATA ────────────────────────────────────────────┐
   │ Ecto.Multi.to_list(multi)     inspect it without a database   │
   │ Ecto.Multi.append/prepend     compose across contexts         │
   │ Ecto.Multi.merge(fn changes -> … end)  branch on earlier steps│
   └───────────────────────────────────────────────────────────────┘

   ⚠ a transaction holds a POOL CONNECTION the whole time.
     Slow external calls inside one will starve your pool.`,
    takeaway:"Multi names every step, tells you which one failed, and is composable data."
  },
  code:[
    {title:"Checkout as a Multi", note:"The full pattern, including a non-Repo step.", code:`defmodule Shop.Checkout do
  alias Ecto.Multi
  alias Shop.{Repo, Orders.Order, Orders.Item}
  import Ecto.Query

  def place(user, %{"items" => item_params} = attrs) do
    Multi.new()
    |> Multi.insert(:order, Order.changeset(%Order{user_id: user.id}, attrs))
    |> Multi.insert_all(:items, Item, fn %{order: order} ->
         now = DateTime.utc_now()
         for i <- item_params do
           %{order_id: order.id, sku: i["sku"], qty: i["qty"],
             price_cents: i["price_cents"], inserted_at: now, updated_at: now}
         end
       end)
    |> Multi.update_all(:reserve_stock, fn _changes ->
         skus = Enum.map(item_params, & &1["sku"])
         from(s in "stock", where: s.sku in ^skus and s.qty > 0)
       end, inc: [qty: -1])
    |> Multi.run(:charge, fn _repo, %{order: order} ->
         Shop.Billing.charge(user, order.total_cents)
       end)
    |> Multi.run(:mark_paid, fn repo, %{order: order} ->
         order |> Ecto.Changeset.change(status: :paid) |> repo.update()
       end)
    |> Repo.transaction()
    |> case do
         {:ok, %{mark_paid: order}} -> {:ok, order}
         {:error, :charge, reason, _done} -> {:error, {:payment_failed, reason}}
         {:error, :order, changeset, _done} -> {:error, changeset}
         {:error, step, reason, _done} -> {:error, {step, reason}}
       end
  end
end`},
    {title:"Inspect a Multi without a database", note:"It is just data — that is the point.", code:`alias Ecto.Multi

multi =
  Multi.new()

  |> Multi.run(:b, fn _repo, %{a: a} -> {:ok, a.total_cents * 2} end)

Multi.to_list(multi) |> Enum.map(fn {name, {kind, _, _}} -> {name, kind} end)

other = Multi.new() |> Multi.run(:audit, fn _r, _c -> {:ok, :logged} end)

alias Shop.Repo

# SELECT ... FOR UPDATE — serialise concurrent updates to one row
Repo.transaction(fn ->
  stock =
    from(s in "stock", where: s.sku == ^"BOOK-1", select: %{id: s.id, qty: s.qty}, lock: "FOR UPDATE")

  end
end)

{
  id:61, mod:"9 · Postgres & Ecto", title:"Raw SQL and fragments",
  front:"You need a Postgres feature Ecto has no macro for — a window function, `ILIKE`, a jsonb operator, `tsvector` search. What are your options?",
  back:"`fragment/1` embeds raw SQL inside an Ecto query while keeping `?` placeholders parameterised and safe. For a whole statement, `Repo.query/3` with `$1` parameters returns a `%Postgrex.Result{}`. Both are first-class options — Ecto never tries to hide SQL from you, and reaching for raw SQL for a reporting query is normal, not a defeat.",
  phil:{
    lead:"Ecto covers the common 95% with macros and gives you an honest door to the other 5% without abandoning safety.",
    body:[
      "The rule with `fragment` is: interpolate VALUES with `?` (which become bound parameters), never build the fragment string itself from user input. `fragment(\"? ILIKE ?\", u.email, ^pattern)` is safe. Building the string with `#{}` from a request parameter is a SQL injection, exactly as it would be anywhere else. This is the one place in Ecto where you can get it wrong, so it is worth stating plainly.",
      "`Repo.query/3` is the full escape hatch, returning columns and rows as plain data. It skips schemas entirely, which is often correct for analytics and reports — you do not need a struct to compute a daily revenue chart. You can also load results into schemas with `Repo.load/2` when you do.",
      "A practical middle ground worth knowing: `select_merge` plus `fragment` lets you add a computed column (a rank, a distance, a jsonb extraction) onto an otherwise normal Ecto query, so you get schema structs plus your extra field."
    ],
    diagram:`   LEVEL 1 — fragment inside a normal Ecto query   (keeps composability)
   where(u, fragment("? ILIKE ?", u.email, ^("%" <> term <> "%")))
   select_merge(o, %{rank: fragment(
       "row_number() OVER (ORDER BY ? DESC)", o.total_cents)})
   where(o, fragment("?->>'source' = ?", o.metadata, ^"web"))     jsonb
   where(p, fragment("to_tsvector('english', ?) @@ plainto_tsquery(?)",
                     p.body, ^q))

   LEVEL 2 — whole statement
   Repo.query!("SELECT date_trunc('day', inserted_at) d,
                       sum(total_cents)
                FROM orders WHERE user_id = $1
                GROUP BY 1 ORDER BY 1", [user_id])
   ⇒ %Postgrex.Result{columns: ["d","sum"],
                      rows: [[~U[...], 12500], …]}

   ┌── SAFE vs UNSAFE ─────────────────────────────────────────────┐
   │ ✓ fragment("? ILIKE ?", u.email, ^pattern)   ← ? is a param   │
   │ ✓ Repo.query(sql, [user_id])                 ← $1 is a param  │
   │ ✗ fragment("#{user_input}")                  ← INJECTION      │
   │ ✗ Repo.query("… WHERE id = #{user_input}")   ← INJECTION      │
   │   the STRUCTURE may be built by you; the VALUES never are.    │
   └───────────────────────────────────────────────────────────────┘

   Repo.load(Order, {columns, row})    turn raw rows into structs
   type(^value, :integer)              tell Ecto the type of a param`,
    takeaway:"fragment for a piece, Repo.query for a whole statement. Values are always parameters, never interpolated."
  },
  code:[
    {title:"Fragments inside a query", note:"", code:`import Ecto.Query
alias Shop.{Repo, Orders.Order, Accounts.User}

term = "ada"

# case-insensitive search
from(u in User, where: fragment("? ILIKE ?", u.email, ^("%" <> term <> "%")))
|> Repo.all()

# jsonb access
from(o in Order, where: fragment("?->>'source' = ?", o.metadata, ^"web"))
|> Repo.all()

# a window function added onto a normal query
from(o in Order,
  select_merge: %{rank: fragment("row_number() OVER (ORDER BY ? DESC)", o.total_cents)}
)
|> limit(10)
|> Repo.all()

# date truncation + grouping
from(o in Order,
  group_by: fragment("date_trunc('day', ?)", o.inserted_at),
  select: %{

{
  id:62, mod:"9 · Postgres & Ecto", title:"Query performance in production",
  front:"An endpoint that was fast at 10k rows takes 4 seconds at 10 million. What are the four things you check, in order?",
  back:"(1) **Indexes** — run `EXPLAIN ANALYZE`; a sequential scan on a big table is your answer. (2) **N+1** — count the queries in your logs. (3) **Over-selecting** — are you loading whole rows and associations you never render? (4) **Pagination** — `OFFSET 100000` makes Postgres walk 100k rows; use keyset pagination. Ecto gives you the tools for all four; the discipline is measuring before guessing.",
  phil:{
    lead:"The BEAM makes your application concurrent; it does nothing for a missing index. Database work is where most Elixir services actually spend their time.",
    body:[
      "Measure first, always. `Ecto.Adapters.SQL.explain/4` runs EXPLAIN ANALYZE from Elixir, and Ecto's telemetry events give you real query timings per endpoint. Dev logs print every query with its duration, so an N+1 is visible as a wall of near-identical lines. Guessing at optimisations without this data wastes days.",
      "Keyset (cursor) pagination is the one non-obvious item on the list and worth adopting early. `OFFSET n` is O(n) because Postgres must count past the skipped rows; `WHERE (inserted_at, id) < (last_seen_at, last_seen_id) ORDER BY inserted_at DESC, id DESC LIMIT 20` is O(log n) with the right index and stays fast on page 5000. It also does not skip or duplicate rows when data changes between pages.",
      "Two more habits pay off constantly: index the columns you filter and sort on (composite indexes in the order you use them), and use `select` to fetch only the fields you render. Loading a 40-column row to display three fields is a hidden cost that multiplies across a result set."
    ],
    diagram:`   1. INDEXES        EXPLAIN ANALYZE first!
      Seq Scan on orders (cost=… rows=10000000)   ← the smoking gun
      create index(:orders, [:user_id, :inserted_at])
      composite index column ORDER = your WHERE + ORDER BY order

   2. N+1            dev log shows the same query 100 times
      ⇒ preload(:items)                                 (card 59)

   3. OVER-SELECTING
      Repo.all(Order)                 40 columns × 10k rows
      select: %{id: o.id, total: o.total_cents}   ← 2 columns ✓

   4. PAGINATION
      OFFSET pagination                 KEYSET (cursor) pagination
      LIMIT 20 OFFSET 100000            WHERE (inserted_at, id) <
      → Postgres walks 100k rows              (^last_at, ^last_id)
      → O(n), slower every page         ORDER BY inserted_at DESC, id DESC
      → duplicates/skips if data        LIMIT 20
        changes between pages           → O(log n), stable ✓

   MEASURE IT
   Ecto.Adapters.SQL.explain(Repo, :all, query, analyze: true)
   config :shop, Shop.Repo, log: :debug          see every query + timing
   :telemetry events [:shop, :repo, :query]      per-endpoint timings
   Repo.aggregate(q, :count)  before you Repo.all a million rows`,
    takeaway:"EXPLAIN before optimising. Index what you filter, preload what you render, and paginate by keyset."
  },
  code:[
    {title:"EXPLAIN from iex", note:"The first thing to run when something is slow.", code:`import Ecto.Query
alias Shop.{Repo, Orders.Order}

q = from o in Order, where: o.user_id == ^1, order_by: [desc: o.inserted_at], limit: 20

IO.puts(Ecto.Adapters.SQL.explain(Repo, :all, q))
IO.puts(Ecto.Adapters.SQL.explain(Repo, :all, q, analyze: true, buffers: true))

# look for:  Seq Scan  (bad on big tables)
#            Index Scan / Index Only Scan  (good)
#            rows=  estimate vs actual  (badly off ⇒ run ANALYZE)`},
    {title:"Keyset pagination", note:"Copy this; it stays fast at any depth.", code:`defmodule Shop.Pagination do
  import Ecto.Query

  @doc "Cursor pagination on (inserted_at, id) descending."
  def page(query, opts \\\\ []) do
    limit = Keyword.get(opts, :limit, 20)
    cursor = Keyword.get(opts, :after)

    query
    |> apply_cursor(cursor)
    |> order_by([o], desc: o.inserted_at, desc: o.id)
    |> limit(^(limit + 1))
    |> Shop.Repo.all()
    |> build_page(limit)
  end

  defp apply_cursor(query, nil), do: query
  defp apply_cursor(query, {at, id}) do
    where(query, [o], {o.inserted_at, o.id} < {type(^at, :utc_datetime_usec), ^id})
  end

  defp build_page(rows, limit) do
    {items, rest} = Enum.split(rows, limit)
    last = List.last(items)

    %{
      items: items,
      has_more?: rest != [],
      next_cursor: last && {last.inserted_at, last.id}
    }
  end
end

# usage:
# page1 = Shop.Pagination.page(Shop.Orders.Order, limit: 20)
# page2 = Shop.Pagination.page(Shop.Orders.Order, limit: 20, after: page1.next_cursor)

# and the index that makes it O(log n):
# create index(:orders, ["inserted_at DESC", "id DESC"])`},
    {title:"Find and fix an N+1", note:"", code:`import Ecto.Query
alias Shop.{Repo, Orders.Order}

# turn on query logging for this session
Logger.configure(level: :debug)

# BAD — 1 + N queries
orders = Repo.all(from o in Order, limit: 50)
Enum.map(orders, fn o -> Repo.preload(o, :items).items |> length() end)

# GOOD — 2 queries
orders = Repo.all(from o in Order, limit: 50, preload: [:items])
Enum.map(orders, fn o -> length(o.items) end)

# BETTER when you only need counts — 1 query, no item rows at all
from(o in Order,
  left_join: i in assoc(o, :items),
  group_by: o.id,
  select: %{id: o.id, item_count: count(i.id)},
  limit: 50
) |> Repo.all()`},
    {title:"Telemetry for query timings", note:"Attach once in application.ex and see your slowest queries.", code:`defmodule Shop.QueryLogger do
  require Logger

  def attach do
    :telemetry.attach(
      "slow-query-logger",
      [:shop, :repo, :query],
      &__MODULE__.handle/4,
      %{threshold_ms: 100}
    )
  end

  def handle(_event, measurements, metadata, %{threshold_ms: threshold}) do
    total_ms = System.convert_time_unit(measurements.total_time, :native, :millisecond)

    if total_ms >= threshold do
      Logger.warning("""
      SLOW QUERY #{total_ms}ms (queue #{div(measurements[:queue_time] || 0, 1_000_000)}ms)
      #{metadata.query}
      params: #{inspect(metadata.params)}
      """)
    end
  end
end

Shop.QueryLogger.attach()`}
  ]
},
{
  id:63, mod:"10 · Realtime & Production", title:"WebSockets: Socket and Channel",
  front:"A browser opens a websocket to your Phoenix app. How many processes appear, and what are they?",
  back:"Two layers. One **Socket** process per connection — it authenticates once and multiplexes. Then one **Channel** process per topic that connection joins. So a user subscribed to three topics has one TCP connection and four processes. Each channel is an isolated GenServer with `join/3`, `handle_in/3`, `handle_info/2` and its own state — everything from module 7 applies unchanged.",
  phil:{
    lead:"Phoenix channels are the payoff for all of OTP: a websocket connection is just a supervised process, so a million of them is an ordinary Tuesday.",
    body:[
      "The socket/channel split is what makes this scale and stay clean. Authentication happens once per connection in `UserSocket.connect/3`, and the resulting identity is copied into every channel that connection joins. Multiplexing means one TCP connection carries many logical subscriptions, so a client watching a room, a notification feed and a presence list still costs one socket.",
      "Each channel being its own process is the important structural fact. A crash in one user's chat channel does not touch anyone else's; a slow message handler blocks only that one subscription; per-connection state (the current room, a rate-limit counter, an unsent buffer) lives in that process's state with no shared memory anywhere.",
      "And because channels are ordinary processes, they subscribe to `Phoenix.PubSub` (card 53) like anything else. Your domain broadcasts a fact, the channel receives it in `handle_info/2`, and pushes it down the wire. The domain never knows a websocket exists."
    ],
    diagram:`   browser ──── ONE websocket (TCP) ────▶ ┌──────────────────────┐
                                          │ UserSocket process   │
                                          │ connect/3 authenticates
                                          │ id/1 → "user:42"     │
                                          └───────┬──────────────┘
                    multiplexed topics            │
        ┌─────────────────────┬───────────────────┴────────────┐
        ▼                     ▼                                ▼
   ┌──────────┐        ┌──────────────┐               ┌──────────────┐
   │ Channel  │        │ Channel      │               │ Channel      │
   │ room:123 │        │ notif:42     │               │ presence:123 │
   │ GenServer│        │ GenServer    │               │ GenServer    │
   └──────────┘        └──────────────┘               └──────────────┘
     own state           own state, own crash, own mailbox

   CALLBACKS (a GenServer with a websocket-shaped API)
   join(topic, params, socket)   → {:ok, socket} | {:ok, reply, socket}
                                 | {:error, %{reason: "unauthorized"}}
   handle_in(event, payload, socket)   ← messages FROM the client
   handle_info(msg, socket)            ← PubSub, timers, anything
   terminate(reason, socket)

   socket.assigns  = per-connection state (like conn.assigns)
   push/3          = to THIS client
   broadcast/3     = to everyone on this topic (cluster-wide)
   broadcast_from/3= everyone except the sender`,
    takeaway:"One socket process authenticates; one channel process per topic holds state and can crash alone."
  },
  code:[
    {title:"The socket — authenticate once", note:"lib/shop_web/channels/user_socket.ex", code:`defmodule ShopWeb.UserSocket do
  use Phoenix.Socket

  channel "room:*",   ShopWeb.RoomChannel
  channel "notif:*",  ShopWeb.NotificationChannel

  @impl true
  def connect(%{"token" => token}, socket, _connect_info) do
    case Phoenix.Token.verify(ShopWeb.Endpoint, "user socket", token, max_age: 86_400) do
      {:ok, user_id} -> {:ok, assign(socket, :current_user_id, user_id)}
      {:error, _reason} -> :error
    end
  end

  def connect(_params, _socket, _info), do: :error

  # lets you disconnect every socket for a user (e.g. on logout / ban)
  @impl true
  def id(socket), do: "user_socket:#{socket.assigns.current_user_id}"
end

# in endpoint.ex:
#   socket "/socket", ShopWeb.UserSocket, websocket: true, longpoll: false`},
    {title:"A channel", note:"lib/shop_web/channels/room_channel.ex", code:`defmodule ShopWeb.RoomChannel do
  use ShopWeb, :channel
  alias Shop.Chat

  @impl true
  def join("room:" <> room_id, _params, socket) do
    user_id = socket.assigns.current_user_id

    if Chat.can_join?(user_id, room_id) do
      # load recent history AFTER join returns, so the join is fast
      send(self(), :after_join)

      socket =
        socket
        |> assign(:room_id, room_id)
        |> assign(:joined_at, System.system_time(:second))

      {:ok, %{room_id: room_id}, socket}
    else
      {:error, %{reason: "unauthorized"}}
    end
  end

  @impl true
  def handle_info(:after_join, socket) do
    history = Chat.recent_messages(socket.assigns.room_id, 50)
    push(socket, "history", %{messages: history})
    {:noreply, socket}
  end

  # a domain event arriving from PubSub
  def handle_info({:message_created, msg}, socket) do
    push(socket, "new_msg", msg)
    {:noreply, socket}
  end

  def handle_info(_other, socket), do: {:noreply, socket}

  @impl true
  def terminate(reason, socket) do
    IO.puts("channel #{socket.topic} closed: #{inspect(reason)}")
    :ok
  end
end`},

{
  id:64, mod:"10 · Realtime & Production", title:"handle_in, push and broadcast",
  front:"A client sends a chat message. Trace the path from `handle_in/3` to every other connected client — including those on a different server.",
  back:"`handle_in(\"new_msg\", payload, socket)` runs in that client's channel process. It calls a context function to persist, then `broadcast!/3` publishes to the topic via `Phoenix.PubSub` — which forwards to every node in the cluster. Each subscribed channel process receives it and pushes down its own websocket. Reply to the sender with `{:reply, {:ok, map}, socket}`; use `{:noreply, socket}` for fire-and-forget.",
  phil:{
    lead:"handle_in is the server's request handler for websocket messages, and the reply tuple is the websocket equivalent of an HTTP status code.",
    body:[
      "The reply mechanism is easy to overlook and very useful: the JS client's `channel.push(...).receive(\"ok\", ...)` maps directly onto your `{:reply, {:ok, payload}, socket}`. That gives you request/response semantics over a websocket, with per-message acknowledgement — which is what you want for anything the user needs confirmation of.",
      "`broadcast!/3` goes through PubSub, so it crosses nodes automatically; `push/3` goes to this one client only; `broadcast_from!/4` skips the sender, which is the right choice when the sender already rendered the message optimistically. Choosing correctly is most of what channel code is.",
      "Two production habits. First, validate and authorise in `handle_in` — a websocket message is untrusted input exactly like an HTTP body, and the channel's assigns are the only identity you should trust. Second, rate-limit per socket: a channel is a process, so a counter in `socket.assigns` with a timestamp is a complete, correct rate limiter with no shared state."
    ],
    diagram:`   client A                                        clients B, C (any node)
      │ channel.push("new_msg", %{body: "hi"})
      ▼
   ┌─────────────────────────────────────────┐
   │ RoomChannel process for A               │
   │  handle_in("new_msg", payload, socket)  │
   │    1. authorise + validate              │
   │    2. Chat.create_message(...)          │  persist FIRST
   │    3. broadcast!(socket, "new_msg", m)  │
   │    4. {:reply, {:ok, %{id: m.id}}, s}   │──ack──▶ client A
   └───────────────┬─────────────────────────┘
                   ▼ Phoenix.PubSub  (cluster-wide)
      ┌────────────┴────────────┬─────────────────────┐
      ▼                         ▼                     ▼
   Channel for B            Channel for C      Channel on NODE 2
   handle_info → push       handle_info → push  handle_info → push

   REPLY SHAPES                       WHO RECEIVES IT
   {:reply, {:ok, map}, socket}       push/3            this client only
   {:reply, {:error, map}, socket}    broadcast!/3      everyone on topic
   {:noreply, socket}                 broadcast_from!/4 everyone but sender
   {:stop, reason, socket}            Endpoint.broadcast/3  from anywhere

   ⚠ handle_in payloads are UNTRUSTED. Validate; trust only socket.assigns.
   ⚠ rate-limit per socket — the channel process is the perfect place.`,
    takeaway:"Persist, then broadcast, then reply. push is one client, broadcast is the whole topic across the cluster."
  },
  code:[
    {title:"A complete chat channel", note:"Validation, authorisation, rate limiting, broadcast, reply.", code:`defmodule ShopWeb.RoomChannel do
  use ShopWeb, :channel
  alias Shop.Chat

  @max_per_10s 10

  @impl true
  def join("room:" <> room_id, _params, socket) do
    {:ok, socket |> assign(:room_id, room_id) |> assign(:sent, [])}
  end

  @impl true
  def handle_in("new_msg", %{"body" => body}, socket) when is_binary(body) do
    with :ok <- check_rate(socket),
         :ok <- validate(body),
         {:ok, msg} <- Chat.create_message(socket.assigns.current_user_id,
                                           socket.assigns.room_id, body) do
      broadcast!(socket, "new_msg", %{
        id: msg.id, body: msg.body, user_id: msg.user_id, at: msg.inserted_at
      })

      {:reply, {:ok, %{id: msg.id}}, record_send(socket)}
    else
      {:error, reason} -> {:reply, {:error, %{reason: to_string(reason)}}, socket}
    end
  end

  # typing indicators: no persistence, no ack, skip the sender
  def handle_in("typing", _payload, socket) do
    broadcast_from!(socket, "typing", %{user_id: socket.assigns.current_user_id})
    {:noreply, socket}
  end

  def handle_in(event, _payload, socket) do
    {:reply, {:error, %{reason: "unknown event: #{event}"}}, socket}
  end

  defp validate(body) do
    cond do
      String.trim(body) == "" -> {:error, :empty}
      String.length(body) > 2_000 -> {:error, :too_long}
      true -> :ok
    end
  end

  defp check_rate(socket) do
    cutoff = System.monotonic_time(:millisecond) - 10_000
    recent = Enum.count(socket.assigns.sent, &(&1 > cutoff))
    if recent < @max_per_10s, do: :ok, else: {:error, :rate_limited}
  end

  defp record_send(socket) do
    now = System.monotonic_time(:millisecond)
    cutoff = now - 10_000
    assign(socket, :sent, [now | Enum.filter(socket.assigns.sent, &(&1 > cutoff))])
  end
end`},

{
  id:65, mod:"10 · Realtime & Production", title:"Presence — who is online",
  front:"Show which users are in a chat room, across three servers, with correct cleanup when a laptop lid closes. Why is a database table the wrong answer?",
  back:"Because presence is ephemeral, high-churn, and must survive netsplits without a coordinator. `Phoenix.Presence` uses a **CRDT** replicated over PubSub: each node tracks its own processes, gossips its state, and merges without conflicts. Entries vanish automatically when the tracked process dies — no cleanup job, no stale rows, no single point of failure.",
  phil:{
    lead:"Presence is the clearest example of using process lifecycles as the source of truth instead of a database.",
    body:[
      "The insight is that a websocket connection already IS the fact you are trying to store. Rather than writing 'online' on connect and hoping to write 'offline' on disconnect — which fails whenever a process crashes, a node dies, or a laptop sleeps — Presence tracks the process itself. When the process ends, for any reason, the entry disappears. Correctness comes from the runtime, not from your cleanup code.",
      "The CRDT (a conflict-free replicated data type, specifically an ORSWOT) is what makes it work across nodes with no leader. Each node can accept writes independently and merges are deterministic, so a network partition heals cleanly instead of requiring a consensus protocol. That is a serious distributed-systems property you get from a two-line module.",
      "The API shape to remember: `track/3` registers this process under a key with metadata, `list/1` returns everyone on the topic grouped by key with a list of metas (one per device — the same user on phone and laptop appears once with two metas), and channels receive `presence_diff` events containing joins and leaves so clients update incrementally instead of re-fetching."
    ],
    diagram:`   NODE 1                    NODE 2                    NODE 3
   ┌──────────┐              ┌──────────┐              ┌──────────┐
   │ user 1 ● │◀──gossip───▶ │ user 3 ● │◀──gossip───▶ │ user 5 ● │
   │ user 2 ● │              │ user 4 ● │              │ user 1 ● │
   └──────────┘              └──────────┘              └──────────┘
        └────────── CRDT merge: no leader, no conflicts ─────────┘

   track(socket, "user:1", %{online_at: …, device: "laptop"})
        │
        └── tied to the CHANNEL PROCESS. Process dies ⇒ entry gone ✓
            (crash, deploy, closed laptop, network drop — all the same)

   Presence.list("room:lobby") ⇒
   %{"user:1" => %{metas: [%{phone: …}, %{laptop: …}]},   ← 2 devices
     "user:2" => %{metas: [%{...}]}}                       ← 1 device

   CLIENT gets incremental diffs, not full lists:

  id:66, mod:"10 · Realtime & Production", title:"Authentication and authorisation",
  front:"HTTP requests carry a Bearer token; websockets cannot set headers from a browser. How do you authenticate both, and where does authorisation live?",
  back:"For HTTP: a plug (card 50) that verifies the token and assigns `current_user`. For websockets: the token goes in the connect PARAMS and is verified once in `UserSocket.connect/3`; browsers cannot set arbitrary headers on a websocket handshake. Authorisation is separate and belongs in the CONTEXT — every context function takes the actor and scopes its query, so no route or channel can accidentally leak another user's data.",
  phil:{
    lead:"Authentication is a plug-level concern; authorisation is a domain-level one. Mixing them is how data leaks happen.",
    body:[
      "The mistake to avoid is authorising in controllers. If `Orders.fetch_order/2` takes a user and scopes the query with `where: o.user_id == ^user.id`, then it is structurally impossible for any caller — a controller, a channel, a background job, a mix task — to read someone else's order. If instead the controller checks `if order.user_id == current_user.id`, then every new caller must remember to repeat that check, and eventually one will not.",
      "For tokens, `Phoenix.Token` is the built-in option: signed (not encrypted), carrying a small payload and a max age. It is ideal for socket tokens. For full session auth, `mix phx.gen.auth` generates a complete, well-reviewed implementation with hashed passwords, session tokens in the database, and remember-me handling — start there rather than writing your own.",
      "Password hashing must use a slow, salted algorithm: `bcrypt_elixir`, `argon2_elixir`, or `pbkdf2_elixir`. Also verify a dummy hash when the user is not found, so response timing does not reveal which emails exist — the generated auth code does this for you, which is a good reason to read it."
    ],
    diagram:`   HTTP                                  WEBSOCKET
   Authorization: Bearer <token>         new Socket("/socket",
        │                                  {params: {token: t}})
        ▼                                       │
   pipeline :authed do                          ▼
     plug ShopWeb.Plugs.Auth              UserSocket.connect(params, socket)
   end                                      verify ONCE per connection
        │                                       │
        ▼                                       ▼
   conn.assigns.current_user            socket.assigns.current_user_id
        │                                       │
        └───────────────┬───────────────────────┘
                        ▼
   ┌──────────── AUTHORISATION LIVES HERE ───────────────────────┐
   │ Orders.fetch_order(%User{id: uid}, id)                      │
   │   where: o.user_id == ^uid    ← scoped IN THE QUERY         │
   │ ⇒ no caller can leak another user's data, ever              │
   └─────────────────────────────────────────────────────────────┘

   ✗ controller: if order.user_id == current_user.id  ← every caller must
                                                        remember. one won't.

   TOKENS            Phoenix.Token.sign/verify  (signed, max_age, small)
   SESSIONS          mix phx.gen.auth           (DB tokens, remember me)
   PASSWORDS         bcrypt / argon2 / pbkdf2 — never SHA, never plain
                     + verify a dummy hash on unknown users (timing)`,
    takeaway:"Authenticate at the edge, authorise in the context by scoping every query to the actor."
  },
  code:[
    {title:"Token auth for HTTP and sockets", note:"One verifier, two entry points.", code:`defmodule Shop.Accounts.Auth do
  alias ShopWeb.Endpoint
  @salt "user auth"
  @max_age 86_400

  def sign(user_id), do: Phoenix.Token.sign(Endpoint, @salt, user_id)

  def verify(token) do
    case Phoenix.Token.verify(Endpoint, @salt, token, max_age: @max_age) do
      {:ok, user_id} ->
        case Shop.Accounts.get_user(user_id) do
          nil -> {:error, :not_found}
          user -> {:ok, user}
        end
      {:error, :expired} -> {:error, :expired}
      {:error, _} -> {:error, :invalid}
    end
  end
end

# HTTP
defmodule ShopWeb.Plugs.Auth do
  import Plug.Conn
  import Phoenix.Controller, only: [json: 2]

  def init(o), do: o

  def call(conn, _opts) do
    with ["Bearer " <> token] <- get_req_header(conn, "authorization"),
         {:ok, user} <- Shop.Accounts.Auth.verify(token) do
      assign(conn, :current_user, user)
    else
      _ -> conn |> put_status(:unauthorized) |> json(%{error: "unauthorized"}) |> halt()
    end
  end
end

# WEBSOCKET
defmodule ShopWeb.UserSocket do
  use Phoenix.Socket
  channel "room:*", ShopWeb.RoomChannel

  @impl true
  def connect(%{"token" => token}, socket, _info) do
    case Shop.Accounts.Auth.verify(token) do
      {:ok, user} -> {:ok, assign(socket, :current_user, user)}
      {:error, _} -> :error
    end
  end
  def connect(_, _, _), do: :error

  @impl true
  def id(socket), do: "user_socket:#{socket.assigns.current_user.id}"
end`},
    {title:"Password login, done safely", note:"Constant-time compare and a dummy hash for unknown users.", code:`# deps: {:bcrypt_elixir, "~> 3.1"}

defmodule Shop.Accounts do
  import Ecto.Query
  alias Shop.{Repo, Accounts.User}

  def register(attrs) do
    %User{} |> User.registration_changeset(attrs) |> Repo.insert()
  end

  def authenticate(email, password) do
    user = Repo.one(from u in User, where: u.email == ^String.downcase(email))

    cond do
      user && Bcrypt.verify_pass(password, user.password_hash) ->
        {:ok, user}

      user ->
        {:error, :bad_password}

      true ->
        Bcrypt.no_user_verify()          # constant time for unknown emails
        {:error, :bad_password}          # same error — do not reveal existence
    end
  end
end

  def refund(%User{}, %Order{}), do: {:error, :forbidden}

{
  id:67, mod:"10 · Realtime & Production", title:"Background jobs",
  front:"Sending a welcome email must not block the signup response. You could `Task.start/1`. Why is that wrong for anything that matters?",
  back:"Because a bare Task lives only in memory: a deploy, a crash or a node restart loses the job silently, and there is no retry, no visibility and no rate control. Use a supervised `Task.Supervisor` for genuinely disposable work, and a **persistent queue** — `Oban`, backed by your existing Postgres — for anything a user would notice going missing. Durable jobs are a database problem, not a process problem.",
  phil:{
    lead:"Elixir makes it so easy to do work in the background that the real question becomes: what happens to this work if the machine disappears right now?",
    body:[
      "Answer honestly per job. A cache warm can be lost. A metrics ping can be lost. A payment capture, a webhook delivery, a welcome email cannot. For the first group, `Task.Supervisor.start_child/2` is perfect: supervised, traceable, cleaned up on shutdown. For the second, the job must be written to durable storage before you reply to the user.",
      "Oban is the standard answer in Elixir and its design is worth understanding: jobs are rows in a Postgres table, inserted inside the SAME transaction as your business data. That single fact eliminates the classic distributed-systems bug where you commit an order and then fail to enqueue its confirmation email — with Oban both happen or neither does. Retries with backoff, uniqueness, cron scheduling and a queryable job table follow naturally from being rows.",
      "For periodic work you now have three options and should pick deliberately: a self-rescheduling GenServer (card 41) for in-memory, per-node tasks; Oban Cron for durable, once-per-cluster jobs; and a plain `Task` under a supervisor for one-off fire-and-forget. Running a naive GenServer timer on three nodes means the job runs three times — a real and common bug."
    ],
    diagram:`   IS LOSING THIS JOB ACCEPTABLE?
        │
   ┌────┴─────┐
   │ yes      │ no
   ▼          ▼
   Task.Supervisor          Oban (rows in YOUR Postgres)
   .start_child/2           ┌────────────────────────────────────┐
   supervised, in-memory    │ Multi.new()                        │
   lost on restart          │ |> Multi.insert(:order, changeset) │
                            │ |> Oban.insert(:email, EmailWorker.new(%{…}))
                            │ |> Repo.transaction()              │
                            │   ⇒ order AND job commit together ✓│
                            └────────────────────────────────────┘

   ┌──────────── oban_jobs table ────────────────────────────────┐
   │ id  queue    worker        args  state      attempt  max   │
   │ 1   mailers  WelcomeEmail  {…}   available   0        20   │
   │ 2   default  SyncStock     {…}   executing   1        3    │
   │ 3   mailers  Receipt       {…}   retryable   2        20   │
   │ 4   default  Report        {…}   completed   1        3    │
   └─────────────────────────────────────────────────────────────┘
     queryable · retried with backoff · unique · cron · observable

   PERIODIC WORK — pick deliberately
   GenServer + send_after   per node, in memory   ⚠ runs N times on N nodes
   Oban.Plugins.Cron        once per cluster, durable          ✓
   Task under a supervisor  one-off, fire and forget`,
    takeaway:"Disposable work goes to a supervised Task. Work that must not be lost goes into Postgres in the same transaction."
  },
  code:[

defmodule Shop.Workers.WelcomeEmail do
  use Oban.Worker,
    queue: :mailers,
    max_attempts: 5,
    unique: [period: 3600, fields: [:worker, :args]]

  @impl Oban.Worker
  def perform(%Oban.Job{args: %{"user_id" => user_id}, attempt: attempt}) do
    case Shop.Accounts.get_user(user_id) do

        end
    end
  end

  def backoff(%Oban.Job{attempt: attempt}), do: attempt * attempt

{
  id:68, mod:"10 · Realtime & Production", title:"Caching and rate limiting",
  front:"Two problems, one tool. Why is ETS the right answer for both a hot read cache and a per-IP rate limiter?",
  back:"Because both need microsecond, lock-free, concurrent access to small mutable state that does not have to survive a restart. ETS (card 47) gives exactly that: `:ets.lookup/2` for cache reads with no message passing, and `:ets.update_counter/3` for atomic rate-limit increments. Both patterns are ~30 lines and need no external service — no Redis, no memcached, no extra thing to operate.",
  phil:{
    lead:"A large fraction of what teams deploy Redis for is already in the BEAM, faster, with no network hop and no extra failure mode.",
    body:[
      "The cache pattern to internalise is read-through with single-flight. A naive cache lets a thousand concurrent misses all recompute the same value — a cache stampede that can take down the thing you were protecting. Routing misses through a GenServer that tracks in-flight computations means one process computes and the other 999 wait for its result. That is a genuine production-grade cache in a page of code.",
      "For rate limiting, the fixed window with `update_counter` is simple and adequate; a sliding window is more accurate and only slightly harder. Either way, the key design question is what you key on — IP, user, API key, or a tuple of endpoint and user — and what you return: `429` with a `Retry-After` header, so clients can behave.",
      "The honest limitation: ETS is per-node. Three nodes means three independent caches and three independent rate limiters, so your effective limit is 3x. If you need a cluster-wide limit, either use a distributed counter (`:global`, or a single owning process reached over distribution) or accept the multiple and divide your limit by the node count. Reach for Redis when you need cross-node atomicity or persistence — not by default."
    ],
    diagram:`   CACHE — read-through with single-flight (no stampede)
   1000 concurrent requests for the same missing key
        │
        ▼  :ets.lookup  ⇒ miss
   ┌──────────────────────────────────────────────────────┐
   │ GenServer owner: is this key already being computed? │
   │   yes → park this caller in a waiters list           │
   │   no  → Task computes it once                        │
   │ result → :ets.insert + reply to ALL waiters          │
   └──────────────────────────────────────────────────────┘
   ⇒ 1 computation, 1000 satisfied callers ✓
     (a naive cache would run it 1000 times and melt the source)

   RATE LIMIT — atomic counter, no process at all
   :ets.update_counter(:rate, {ip, window}, {2, 1}, {{ip, window}, 0})
        │                     └── atomic increment, returns new value
        ▼
   count > limit ? ⇒ 429 + Retry-After     : allow

   window = div(System.system_time(:second), 60)   ← fixed window, trivial
   sliding window = keep timestamps, drop old ones ← more accurate

   ⚠ ETS IS PER NODE
     3 nodes × limit 100 = an effective 300/min
     fix: divide the limit by node count, or use one owning process,
          or Redis when you truly need cluster-wide atomicity.`,
    takeaway:"ETS covers caching and rate limiting in-process. Guard against stampedes; remember limits are per node."
  },
  code:[
    {title:"Read-through cache with single-flight", note:"Paste it all; the last block proves it works.", code:`defmodule Shop.Cache do
  use GenServer
  @table :shop_cache

  def start_link(_), do: GenServer.start_link(__MODULE__, nil, name: __MODULE__)

  @doc "Read-through fetch. Concurrent misses compute the value ONCE."
  def fetch(key, ttl_ms, fun) do
    case lookup(key) do
      {:ok, value} -> value
      :miss -> GenServer.call(__MODULE__, {:compute, key, ttl_ms, fun}, 30_000)
    end
  end

  def lookup(key) do
    now = System.monotonic_time(:millisecond)
    case :ets.lookup(@table, key) do
      [{^key, value, expires}] when expires > now -> {:ok, value}
      _ -> :miss
    end
  end

  def invalidate(key), do: :ets.delete(@table, key)
  def size, do: :ets.info(@table, :size)

  @impl true
  def init(_) do
    :ets.new(@table, [:named_table, :set, :public, read_concurrency: true])
    {:ok, %{inflight: %{}}}
  end

  @impl true
  def handle_call({:compute, key, ttl, fun}, from, state) do
    case lookup(key) do
      {:ok, value} ->
        {:reply, value, state}                       # someone filled it meanwhile

      :miss ->
        case Map.fetch(state.inflight, key) do
          {:ok, waiters} ->
            # already being computed — just wait for it
            {:noreply, put_in(state.inflight[key], [from | waiters])}

          :error ->
            owner = self()
            Task.start(fn -> send(owner, {:computed, key, ttl, fun.()}) end)
            {:noreply, put_in(state.inflight[key], [from])}
        end
    end
  end

  @impl true
  def handle_info({:computed, key, ttl, value}, state) do
    :ets.insert(@table, {key, value, System.monotonic_time(:millisecond) + ttl})
    {waiters, inflight} = Map.pop(state.inflight, key, [])
    Enum.each(waiters, &GenServer.reply(&1, value))
    {:noreply, %{state | inflight: inflight}}
  end
  def handle_info(_, state), do: {:noreply, state}
end

{:ok, _} = Shop.Cache.start_link(nil)

# 500 concurrent misses on the same key:
counter = :counters.new(1, [])
1..500
|> Task.async_stream(fn _ ->
     Shop.Cache.fetch("expensive", 60_000, fn ->
       :counters.add(counter, 1, 1)
       Process.sleep(300)
       :computed_value
     end)
   end, max_concurrency: 500)
|> Stream.run()

:counters.get(counter, 1)     # 1 ✓  — not 500`},
    {title:"Rate limiter — fixed window", note:"No GenServer needed; update_counter is atomic.", code:`defmodule Shop.RateLimiter do
  @table :rate_limiter

  def init, do: :ets.new(@table, [:named_table, :set, :public, write_concurrency: true])

  @doc "Returns {:ok, remaining} | {:error, :rate_limited, retry_after_seconds}"
  def check(key, limit, window_seconds \\\\ 60) do
    now = System.system_time(:second)
    window = div(now, window_seconds)
    bucket = {key, window}

    count = :ets.update_counter(@table, bucket, {2, 1}, {bucket, 0})

    if count <= limit do
      {:ok, limit - count}
    else
      retry_after = (window + 1) * window_seconds - now
      {:error, :rate_limited, retry_after}
    end
  end

  def sweep(window_seconds \\\\ 60) do
    current = div(System.system_time(:second), window_seconds)
    :ets.select_delete(@table, [{{{:_, :"$1"}, :_}, [{:<, :"$1", current}], [true]}])
  end
end

Shop.RateLimiter.init()
for i <- 1..7, do: {i, Shop.RateLimiter.check("ip:1.2.3.4", 5)}`},

  import Plug.Conn
  import Phoenix.Controller, only: [json: 2]

  def init(opts), do: %{limit: Keyword.get(opts, :limit, 100),
                        window: Keyword.get(opts, :window, 60)}

  def call(conn, %{limit: limit, window: window}) do
    key = identifier(conn)

    case Shop.RateLimiter.check(key, limit, window) do
      {:ok, remaining} ->
        conn
        |> put_resp_header("x-ratelimit-limit", to_string(limit))
        |> put_resp_header("x-ratelimit-remaining", to_string(remaining))

      {:error, :rate_limited, retry_after} ->
        conn
        |> put_resp_header("retry-after", to_string(retry_after))
        |> put_status(:too_many_requests)
        |> json(%{error: "rate limited", retry_after: retry_after})
        |> halt()
    end
  end

  defp identifier(%{assigns: %{current_user: %{id: id}}}), do: "user:#{id}"
  defp identifier(conn) do
    ip = conn.remote_ip |> :inet.ntoa() |> to_string()
    # behind a proxy, prefer the forwarded header (and validate the proxy!)
    case get_req_header(conn, "x-forwarded-for") do
      [value | _] -> "ip:" <> (value |> String.split(",") |> hd() |> String.trim())
      [] -> "ip:" <> ip
    end
  end
end

  @ttl :timer.minutes(5)

    result = product |> Product.changeset(attrs) |> Repo.update()

      error -> error

  end

    {title:"A Telemetry module with real metrics", note:"lib/shop/telemetry.ex — add to your children list.", code:`defmodule Shop.Telemetry do
  use Supervisor
  import Telemetry.Metrics

  def start_link(arg), do: Supervisor.start_link(__MODULE__, arg, name: __MODULE__)

  @impl true
  def init(_arg) do
    children = [
      {:telemetry_poller, measurements: periodic_measurements(), period: 10_000}
      # {TelemetryMetricsPrometheus, [metrics: metrics()]}
    ]
    Supervisor.init(children, strategy: :one_for_one)
  end

  def metrics do
    [
      # HTTP
      summary("phoenix.endpoint.stop.duration",
        unit: {:native, :millisecond}, tags: [:status]),
      summary("phoenix.router_dispatch.stop.duration",
        unit: {:native, :millisecond}, tags: [:route]),
      counter("phoenix.error_rendered.count", tags: [:status]),

      # Database — queue_time is the pool-exhaustion early warning
      summary("shop.repo.query.total_time", unit: {:native, :millisecond}),
      summary("shop.repo.query.queue_time", unit: {:native, :millisecond}),
      summary("shop.repo.query.decode_time", unit: {:native, :millisecond}),

      # Background jobs
      counter("oban.job.stop.count", tags: [:queue, :worker]),
      counter("oban.job.exception.count", tags: [:queue, :worker]),
      summary("oban.job.stop.duration", unit: {:native, :millisecond}, tags: [:queue]),

      # VM health
      last_value("vm.memory.total", unit: {:byte, :megabyte}),
      last_value("vm.total_run_queue_lengths.total"),
      last_value("vm.system_counts.process_count"),

      # your own domain events
      counter("shop.checkout.stop.count", tags: [:result]),
      summary("shop.checkout.stop.duration", unit: {:native, :millisecond})
    ]
  end

  defp periodic_measurements do
    [
      {__MODULE__, :dispatch_process_counts, []}
    ]
  end

  def dispatch_process_counts do
    :telemetry.execute([:shop, :processes], %{count: :erlang.system_info(:process_count)}, %{})
  end
end`},

  id:70, mod:"10 · Realtime & Production", title:"Releases and deployment",
  front:"How do you ship an Elixir app to a server with no Erlang, no Elixir and no Mix installed?",
  back:"`MIX_ENV=prod mix release` builds a self-contained tarball: your compiled code, its dependencies, and a trimmed Erlang runtime, with `bin/shop start|stop|remote|eval`. No language runtime on the target, no Mix at runtime. Migrations run via a release task (`bin/shop eval \"Shop.Release.migrate\"`), and `config/runtime.exs` (card 28) supplies the environment on boot.",
  phil:{
    lead:"A release is the whole system — application code, dependencies, VM — packaged as one artefact, which is why Elixir deploys are unusually boring.",
    body:[
      "Two facts make production operation different from most stacks. First, the release includes `bin/shop remote`, which attaches an IEx shell to the RUNNING production node. You can inspect a GenServer's state, check a queue depth, or run a one-off query against live state. Used carefully this is extraordinary; treat it as a privileged operation and log its use.",
      "Second, graceful shutdown actually works. `SIGTERM` triggers an orderly supervision-tree shutdown in reverse order (card 46), so the Endpoint stops accepting connections first and in-flight work drains. Set `shutdown` values on children that need to finish, and give your orchestrator a `terminationGracePeriodSeconds` longer than your longest request.",
      "For Docker, use a multi-stage build: compile in an Elixir image, copy the release into a slim runtime image. Set `PHX_HOST`, `SECRET_KEY_BASE`, `DATABASE_URL` and `PORT` as environment variables; runtime.exs reads them at boot. And add a health endpoint that actually checks the database, so your load balancer knows the difference between 'the process is up' and 'the service works'."
    ],
    diagram:`   BUILD                                 RUN
   MIX_ENV=prod mix deps.get --only prod  _build/prod/rel/shop/
   MIX_ENV=prod mix compile               ├── bin/shop      start|stop|
   MIX_ENV=prod mix release               │                 remote|eval|rpc
        │                                 ├── lib/          your beams + deps
        │  self-contained tarball         ├── erts-…/       the VM itself
        ▼                                 └── releases/…/   runtime.exs
   no Elixir or Erlang needed on target ✓

   bin/shop start          run it
   bin/shop remote         ★ attach IEx to the LIVE node
   bin/shop eval "Shop.Release.migrate"      run migrations (no Mix!)
   bin/shop rpc "IO.inspect(:erlang.memory())"

   SIGTERM ⇒ graceful shutdown, supervision tree in REVERSE order
     Endpoint stops accepting ─▶ in-flight requests drain ─▶ Repo closes
     (set child shutdown: values; grace period > longest request)

   DOCKER, multi-stage
   FROM elixir:1.16-alpine AS build   … mix release
   FROM alpine:3.19                   … COPY --from=build the release only
   ⇒ small image, no build tools, no source

   HEALTH CHECK that means something:
   GET /health → SELECT 1 against the pool → 200 or 503`,
    takeaway:"mix release ships code + VM as one artefact, with a live remote shell and real graceful shutdown."
  },
  code:[
    {title:"Release config and the migration task", note:"mix.exs + lib/shop/release.ex", code:`# mix.exs
def project do
  [
    app: :shop,
    version: "0.1.0",
    releases: [
      shop: [
        include_executables_for: [:unix],
        applications: [runtime_tools: :permanent],
        steps: [:assemble, :tar]
      ]
    ]
  ]
end

# lib/shop/release.ex — migrations without Mix
defmodule Shop.Release do
  @app :shop

  def migrate do
    load_app()
    for repo <- repos() do
      {:ok, _, _} = Ecto.Migrator.with_repo(repo, &Ecto.Migrator.run(&1, :up, all: true))
    end
  end

  def rollback(repo, version) do
    load_app()
    {:ok, _, _} = Ecto.Migrator.with_repo(repo, &Ecto.Migrator.run(&1, :down, to: version))
  end

  def seed do
    load_app()
    {:ok, _, _} = Ecto.Migrator.with_repo(Shop.Repo, fn _repo ->
      Code.eval_file(Application.app_dir(@app, "priv/repo/seeds.exs"))
    end)
  end

  defp repos, do: Application.fetch_env!(@app, :ecto_repos)
  defp load_app, do: Application.ensure_loaded(@app)
end

# terminal:
# MIX_ENV=prod mix release
# _build/prod/rel/shop/bin/shop eval "Shop.Release.migrate"
# _build/prod/rel/shop/bin/shop start`},

RUN apk add --no-cache build-base git
WORKDIR /app
ENV MIX_ENV=prod

RUN mix local.hex --force && mix local.rebar --force

COPY mix.exs mix.lock ./
RUN mix deps.get --only prod && mix deps.compile

COPY config config
COPY priv priv
COPY lib lib

WORKDIR /app
RUN adduser -D app && chown app:app /app
USER app

COPY --from=build --chown=app:app /app/_build/prod/rel/shop ./

ENV HOME=/app PHX_SERVER=true
EXPOSE 4000

CMD ["bin/shop", "start"]`},
    {title:"A health endpoint that tells the truth", note:"Distinguish 'process alive' from 'service works'.", code:`defmodule ShopWeb.HealthController do
  use ShopWeb, :controller

  # liveness: am I running at all? (never touches dependencies)
  def live(conn, _), do: send_resp(conn, 200, "ok")

  # readiness: can I actually serve traffic?
  def ready(conn, _) do
    checks = %{
      database: check_db(),
      migrations: check_migrations()
    }

    status = if Enum.all?(Map.values(checks), &(&1 == :ok)), do: 200, else: 503

    conn
    |> put_status(status)
    |> json(%{status: if(status == 200, do: "ok", else: "degraded"), checks: checks})
  end

  defp check_db do
    case Ecto.Adapters.SQL.query(Shop.Repo, "SELECT 1", [], timeout: 2_000) do
      {:ok, _} -> :ok
      {:error, _} -> :error
    end
  rescue
    _ -> :error
  end

  defp check_migrations do
    case Ecto.Migrator.migrations(Shop.Repo) do
      list -> if Enum.any?(list, fn {status, _, _} -> status == :down end), do: :pending, else: :ok
    end
  rescue
    _ -> :error
  end
end

{
  id:71, mod:"10 · Realtime & Production", title:"Distribution and clustering",
  front:"Two BEAM nodes connect. What suddenly becomes possible that would need Kafka or gRPC elsewhere?",
  back:"Transparent message passing. `send({:name, :\"b@host\"}, msg)` and `GenServer.call({Worker, node}, :req)` work exactly like local calls — the VM handles serialisation and transport. That is why `Phoenix.PubSub`, `Presence` and `:global` work cluster-wide with no extra infrastructure. In production, `libcluster` forms the cluster automatically from DNS, Kubernetes or gossip.",
  phil:{
    lead:"Distribution is built into the runtime rather than bolted on, which makes small clusters almost free — and makes it important to know the limits.",
    body:[
      "What you get cheaply: PubSub across nodes, Presence as a CRDT, `Node.spawn/2` to run a function elsewhere, `:erpc` for remote calls, and a cluster-wide process registry via `:global` or Horde. For a realtime app spread across three to twenty nodes, this removes an entire category of infrastructure.",
      "What you must not assume: the network is not reliable, and BEAM distribution is not magic. A netsplit gives you two halves that each think the other died; when they heal, you need a merge strategy. `:global` is a single-registry design that does not partition well. Distributed Erlang is also fully-meshed, so it does not scale to hundreds of nodes without `hidden` nodes or a different topology. And by default the cluster trusts itself completely — a shared cookie is the only authentication, so distribution must run on a private network, with TLS distribution if it crosses anything else.",
      "The pragmatic position most teams land on: use clustering for realtime fan-out (PubSub, Presence) and keep durable state in Postgres. Do not build a distributed database out of GenServers unless that is genuinely your product."
    ],
    diagram:`   iex --sname a --cookie secret        iex --sname b --cookie secret
        │                                        │
        └──────── Node.connect(:"b@host") ───────┘  fully meshed

   NOW THESE JUST WORK
   Node.list()                          send({:worker, :"b@host"}, msg)
   :rpc.call(node, Mod, :fun, [args])   GenServer.call({Mod, node}, :req)
   Node.spawn(node, fn -> … end)        :erpc.call(node, fun)
   Phoenix.PubSub broadcast             cluster-wide, automatically ✓
   Phoenix.Presence                     CRDT merge across nodes ✓

   AUTOMATIC FORMATION — libcluster
   config :libcluster, topologies: [
     k8s: [strategy: Cluster.Strategy.Kubernetes.DNS,
           config: [service: "shop-headless", application_name: "shop"]]
   ]

   ┌── THE LIMITS (know these before you rely on it) ─────────────┐
   │ netsplit  → both halves think the other died; plan the merge │
   │ :global   → single registry, partitions badly                │
   │ mesh      → N² connections; not for hundreds of nodes        │
   │ security  → a shared COOKIE is the whole auth model.         │
   │             private network only; TLS distribution otherwise │
   │ state     → durable data belongs in Postgres, not in a       │
   │             cluster of GenServers                            │
   └──────────────────────────────────────────────────────────────┘`,
    takeaway:"Nodes pass messages transparently — great for realtime fan-out, not a substitute for a database."
  },
  code:[
    {title:"Cluster two shells on your Mac", note:"Open two terminals and run one command in each.", code:`# terminal 1:
iex --sname a --cookie devcookie

# terminal 2:
iex --sname b --cookie devcookie

# then, in terminal 1 (replace 'yourmac' with the name shown in your prompt):
Node.self()
Node.connect(:"b@yourmac")
Node.list()

# run code on the OTHER node:
Node.spawn(:"b@yourmac", fn -> IO.puts("hello from #{inspect(Node.self())}") end)
:erpc.call(:"b@yourmac", fn -> :erlang.system_info(:process_count) end)
:rpc.call(:"b@yourmac", System, :cmd, ["hostname", []])`},

defmodule Remote do
  use GenServer
  def start_link(_), do: GenServer.start_link(__MODULE__, 0, name: __MODULE__)
  @impl true
  def init(s), do: {:ok, s}
  @impl true
  def handle_call(:where, _from, s), do: {:reply, {Node.self(), s}, s + 1}
end

{:ok, _} = Remote.start_link(nil)

# --- in node a (paste the module there too so it compiles) ---
GenServer.call({Remote, :"b@yourmac"}, :where)

# config/runtime.exs
config :libcluster,
  topologies: [
    k8s: [
      strategy: Elixir.Cluster.Strategy.Kubernetes.DNS,
      config: [
        service: "shop-headless",
        application_name: "shop",
        polling_interval: 5_000
      ]
    ]
  ]

# lib/shop/application.ex — FIRST child, before PubSub
def start(_type, _args) do
  topologies = Application.get_env(:libcluster, :topologies) || []

  children = [
    {Cluster.Supervisor, [topologies, [name: Shop.ClusterSupervisor]]},
    Shop.Repo,
    {Phoenix.PubSub, name: Shop.PubSub},
    ShopWeb.Presence,
    ShopWeb.Endpoint
  ]

  Supervisor.start_link(children, strategy: :one_for_one, name: Shop.Supervisor)
end

{
  id:72, mod:"10 · Realtime & Production", title:"Testing the whole stack",
  front:"Your test suite hits Postgres and runs with `async: true`. How do 8 tests share one database without corrupting each other?",
  back:"The **Ecto SQL Sandbox**. Each test process checks out its own database connection and runs inside a transaction that is rolled back at the end. Tests are therefore isolated, order-independent, and safe to run in parallel. `DataCase` sets this up for context tests, `ConnCase` for controllers, `ChannelCase` for websockets — and for external services you use `Mox` against a behaviour (card 26).",
  phil:{
    lead:"Elixir's test story is unusually good because the two hardest parts — isolating state and faking dependencies — both have first-class answers.",
    body:[
      "The sandbox is a genuinely clever use of process ownership. A connection is checked out and OWNED by the test process; anything that process spawns can be allowed access explicitly. That is why `async: true` works against a real database at all, and it means you almost never need fixtures files or a truncate-between-tests step.",
      "For external services, resist the urge to mock modules globally. Define a behaviour, implement a real adapter and a `Mox` mock, and select via config (card 26). Mox verifies expectations per test and works with `async: true` because expectations are process-scoped. The rule 'mock the boundary you own, not the library you imported' keeps tests from breaking every time a dependency changes shape.",
      "Aim your effort at the layer that gives the most confidence per line: context tests. They exercise real business logic against a real database with no HTTP, run fast, and rarely need changing when routes or serialisation change. Add controller tests for status codes and shape, and channel tests for realtime behaviour."
    ],
    diagram:`   ONE POSTGRES DATABASE, 8 PARALLEL TESTS
   ┌───────────────────────────────────────────────────────────┐
   │  test proc 1 ──▶ conn 1 ──▶ BEGIN … work … ROLLBACK ✓     │
   │  test proc 2 ──▶ conn 2 ──▶ BEGIN … work … ROLLBACK ✓     │
   │  test proc 3 ──▶ conn 3 ──▶ BEGIN … work … ROLLBACK ✓     │
   └───────────────────────────────────────────────────────────┘
   isolated · order-independent · no cleanup code · async: true ✓

   spawned a Task in the code under test? grant it access:
     Ecto.Adapters.SQL.Sandbox.allow(Repo, test_pid, task_pid)
   or use :shared mode for that test (then async: false)

   THE CASE TEMPLATES
   Shop.DataCase       contexts + schemas   (sandbox, errors_on/1)
   ShopWeb.ConnCase    controllers          (+ build_conn/0, json_response/2)
   ShopWeb.ChannelCase channels             (+ socket/2, assert_broadcast)
   ExUnit.Case         pure functions       (no database at all)

   EXTERNAL SERVICES — Mox against YOUR behaviour
   @callback charge(map) :: {:ok, map} | {:error, term}

{
  id:73, mod:"10 · Realtime & Production", title:"The failure modes that actually bite",
  front:"Your Elixir service has been up for three weeks and memory is climbing steadily. Name the four usual suspects.",
  back:"(1) A **growing mailbox** — a process receiving faster than it handles, usually because someone used `cast`. (2) **ETS with no expiry** — a cache that only ever inserts. (3) **Atom leak** — `String.to_atom/1` on user input. (4) **Binary leak** — large binaries referenced by a long-lived process that rarely garbage-collects. All four are visible in one minute with `:recon` or `Process.info/2`.",
  phil:{
    lead:"Elixir removes whole categories of bugs, so the ones that remain are worth memorising — they are few, specific, and diagnosable.",
    body:[
      "Notice what is NOT on the list: race conditions on shared state, null pointer errors, most deadlocks, and one bad request taking down the server. The BEAM's design eliminated those. What is left is mostly about unbounded growth and blocked processes, which is why the diagnostic toolkit is small: look at mailbox lengths, look at memory per process, look at ETS sizes, look at the pool.",
      "The one that surprises people most is the blocked GenServer. A single process doing a slow synchronous call inside `handle_call` makes every client wait, and because Elixir is otherwise so concurrent, the symptom (one endpoint gets slow, the rest are fine) does not look like a concurrency problem. `:recon.proc_count(:message_queue_len, 5)` finds it in seconds.",
      "The best defence is design: prefer `call` over `cast` (card 40), bound every cache, never atomise external input, and keep the read path out of single processes (card 42). The second-best defence is knowing these five commands well enough to type them under pressure."
    ],
    diagram:`   SYMPTOM                    LIKELY CAUSE               FIND IT WITH
   ─────────────────────────────────────────────────────────────────────
   memory climbs forever      mailbox growth (cast)      :recon.proc_count(
                                                          :message_queue_len,5)
   memory climbs forever      ETS never expires          :ets.info(t, :size)
   memory climbs, then dies   atom leak (to_atom)        :erlang.system_info(
                                                          :atom_count)
   memory high, GC does not   binary leak                :recon.bin_leak(5)
     help
   one endpoint slow,         blocked GenServer          :recon.proc_count(
     others fine                (slow handle_call)        :message_queue_len,5)
   intermittent 500s under    pool exhaustion            telemetry queue_time
     load                                                 DBConnection errors
   works locally, fails       compile-time config in     Application.get_env
     in prod                    config/prod.exs           → runtime.exs
   node dies at 3am           unbounded queue anywhere   all of the above

   THE FIVE COMMANDS TO KNOW BY HEART
   :recon.proc_count(:message_queue_len, 5)   who is drowning
   :recon.proc_count(:memory, 5)              who is fat
   :erlang.memory()                           where memory lives overall
   :sys.get_state(pid_or_name)                what is a GenServer holding
   :observer.start()                          the whole picture (dev)

   PREVENTION
   ✓ call over cast   ✓ bound every cache   ✓ to_existing_atom only
   ✓ keep hot reads out of single processes ✓ timeouts on everything`,
    takeaway:"Almost every Elixir production problem is unbounded growth or a blocked process. Five commands find all of them."
  },
  code:[
    {title:"Reproduce and find a mailbox leak", note:"Run it, then find the culprit as you would in production.", code:`defmodule Drowning do
  use GenServer
  def start_link(_), do: GenServer.start_link(__MODULE__, 0, name: __MODULE__)
  @impl true
  def init(s), do: {:ok, s}
  @impl true
  def handle_cast(:work, s) do
    Process.sleep(10)         # slower than the producers
    {:noreply, s + 1}
  end
end

{:ok, pid} = Drowning.start_link(nil)
for _ <- 1..20_000, do: GenServer.cast(Drowning, :work)

# DIAGNOSE — exactly what you would type in production:
Process.info(pid, :message_queue_len)
Process.info(pid, :memory)

Process.list()
|> Enum.map(fn p -> {p, Process.info(p, :message_queue_len)} end)
|> Enum.reject(fn {_, i} -> is_nil(i) end)
|> Enum.sort_by(fn {_, {_, len}} -> -len end)
|> Enum.take(3)

# with recon: :recon.proc_count(:message_queue_len, 5)
# FIX: use call/3 so producers are throttled (card 40)`},
    {title:"Atom, ETS and binary leaks", note:"Three quick checks.", code:`# --- atoms ---
:erlang.system_info(:atom_count)
:erlang.system_info(:atom_limit)
# simulate the leak (do NOT do this in production):
for i <- 1..1_000, do: String.to_atom("leaked_#{i}")
:erlang.system_info(:atom_count)      # permanently higher
# FIX: String.to_existing_atom/1, or keep them as strings

# --- ETS growth ---
:ets.all()
|> Enum.map(fn t -> {(:ets.info(t, :name)), :ets.info(t, :size), :ets.info(t, :memory)} end)
|> Enum.sort_by(fn {_, _, mem} -> -(mem || 0) end)
|> Enum.take(5)
# FIX: a TTL + periodic sweep (card 47)

# --- binaries ---
:erlang.memory(:binary) |> div(1024*1024)
# FIX: :erlang.garbage_collect(pid), or hibernate idle processes,
#      or use :binary.copy/1 when keeping a small slice of a big binary
big = :crypto.strong_rand_bytes(10_000_000)
slice = binary_part(big, 0, 10)          # still REFERENCES all 10MB!
safe  = :binary.copy(binary_part(big, 0, 10))   # 10 bytes ✓`},
    {title:"Blocked GenServer and pool exhaustion", note:"The two most common latency mysteries.", code:`# --- a GenServer blocked on slow work ---
defmodule Blocker do
  use GenServer
  def start_link(_), do: GenServer.start_link(__MODULE__, nil, name: __MODULE__)
  def slow, do: GenServer.call(__MODULE__, :slow, 30_000)
  def fast, do: GenServer.call(__MODULE__, :fast, 1_000)
  @impl true
  def init(s), do: {:ok, s}
  @impl true
  def handle_call(:slow, _f, s) do
    Process.sleep(3_000)                # ← blocks EVERY other client
    {:reply, :done, s}
  end
  def handle_call(:fast, _f, s), do: {:reply, :quick, s}
end

{:ok, _} = Blocker.start_link(nil)
spawn(fn -> Blocker.slow() end)
Process.sleep(100)
{t, _} = :timer.tc(fn -> Blocker.fast() end)
div(t, 1000)     # ~2900ms for a "fast" call 😱
# FIX: reply later from a Task (card 40), or move the work out entirely

# --- pool exhaustion signature ---
# ** (DBConnection.ConnectionError) connection not available and
#    request was dropped from queue after 1000ms
# ⇒ raise pool_size, shorten queries, or stop holding connections in
#   long transactions. Watch telemetry queue_time (card 69).`},

Application.get_all_env(:shop) |> Keyword.keys()`}

  front:"Put all 73 cards together. Trace one HTTP request and one websocket message through every layer you have learned, naming the process at each step.",
  back:"HTTP: a Cowboy acceptor spawns a request process → Endpoint plugs → Router pipeline (auth plug assigns the user) → Controller action → Context function (authorised, scoped) → Ecto changeset → Repo checks out a pooled connection → Postgres → PubSub broadcast → JSON view → response. Websocket: Socket process (authenticated once) → Channel process per topic → `handle_in` → same context → broadcast → every subscribed channel on every node pushes to its client. Every box is a supervised process; every crash is local.",
  phil:{
    lead:"The whole deck is one idea repeated at increasing scale: isolate state in a process, supervise it, pass messages, let it crash.",
    body:[
      "Look back at what stayed constant. A function clause matching a shape (card 12) became a router matching a path (card 50). A tail-recursive loop holding state (card 33) became a GenServer (card 39), then a channel (card 63), then a chat room under a DynamicSupervisor (card 45). A tagged tuple (card 4) became `with` (card 22), then a context return value (card 52), then an `action_fallback` clause (card 51). You did not learn a web framework on top of a language — you learned one set of ideas applied at every layer.",
      "The architecture that falls out is unusually simple to reason about: a supervision tree you can read in one file, a domain layer with no framework in it, a thin translation layer for HTTP and websockets, Postgres for durability, ETS for speed, and processes for everything that is alive. There is no dependency injection framework, no message broker, no cache server and no thread pool tuning, because the runtime already provides those.",

    {title:"The complete application tree", note:"Everything from this deck, in one file.", code:`defmodule Shop.Application do
  use Application

  @impl true
  def start(_type, _args) do
    topologies = Application.get_env(:libcluster, :topologies) || []

    children = [
      # clustering first, so PubSub and Presence see their peers
      {Cluster.Supervisor, [topologies, [name: Shop.ClusterSupervisor]]},

      # observability
      Shop.Telemetry,

      # data
      Shop.Repo,

      # process infrastructure
      {Registry, keys: :unique, name: Shop.Registry},
      {Phoenix.PubSub, name: Shop.PubSub},
      ShopWeb.Presence,

      # caches (own their ETS tables)
      Shop.Cache,
      Shop.RateLimiter,

      # background work
      {Task.Supervisor, name: Shop.TaskSupervisor},
      {Oban, Application.fetch_env!(:shop, Oban)},

      # one process per live entity
      {DynamicSupervisor, name: Shop.SessionSupervisor, strategy: :one_for_one},

      # accept traffic LAST
      ShopWeb.Endpoint
    ]

    Supervisor.start_link(children, strategy: :one_for_one, name: Shop.Supervisor)
  end

  @impl true
  def config_change(changed, _new, removed) do
    ShopWeb.Endpoint.config_change(changed, removed)
    :ok
  end

# 2 ── CONTROLLER (card 51): params in, one context call, render out
defmodule ShopWeb.OrderController do
  use ShopWeb, :controller
  action_fallback ShopWeb.FallbackController

  def create(conn, %{"order" => params}) do
    with {:ok, order} <- Shop.Checkout.place(conn.assigns.current_user, params) do
      conn
      |> put_status(:created)
      |> put_resp_header("location", ~p"/api/orders/#{order.id}")
      |> render(:show, order: order)
    end
  end
end

# 3 ── CONTEXT (cards 52, 60, 66, 67): authorised, transactional, durable
defmodule Shop.Checkout do
  alias Ecto.Multi
  alias Shop.{Repo, Orders.Order, Workers.ReceiptEmail}

  def place(user, params) do
    Multi.new()
    |> Multi.insert(:order, Order.changeset(%Order{user_id: user.id}, params))
    |> Multi.run(:charge, fn _repo, %{order: o} -> Shop.Billing.charge(user, o.total_cents) end)
    |> Multi.update(:paid, fn %{order: o} -> Ecto.Changeset.change(o, status: :paid) end)
    |> Oban.insert(:receipt, fn %{paid: o} -> ReceiptEmail.new(%{order_id: o.id}) end)
    |> Repo.transaction()
    |> case do
         {:ok, %{paid: order}} ->
           Shop.Cache.invalidate({:orders, user.id})
           Phoenix.PubSub.broadcast(Shop.PubSub, "user:#{user.id}", {:order_paid, order})
           {:ok, order}

         {:error, :charge, reason, _} -> {:error, {:payment_failed, reason}}
         {:error, _step, %Ecto.Changeset{} = cs, _} -> {:error, cs}
       end
  end
end

# 4 ── CHANNEL (cards 63, 64): the same event, pushed live to every device
defmodule ShopWeb.UserChannel do
  use ShopWeb, :channel

  @impl true
  def join("user:" <> id, _params, socket) do
    if to_string(socket.assigns.current_user.id) == id do
      Phoenix.PubSub.subscribe(Shop.PubSub, "user:#{id}")
      {:ok, socket}
    else
      {:error, %{reason: "unauthorized"}}
    end
  end

  @impl true
  def handle_info({:order_paid, order}, socket) do
    push(socket, "order_paid", %{id: order.id, total_cents: order.total_cents})
    {:noreply, socket}
  end
  def handle_info(_, socket), do: {:noreply, socket}
end`},

/* ============================================================
   Tiny Elixir/JS syntax highlighter
   ============================================================ */
const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

const HL = new RegExp([
  '(#[^\\n]*)',                                                   // 1 comment
  '("""[\\s\\S]*?"""|"(?:\\\\.|[^"\\\\])*"|~[a-zA-Z]\\([^)]*\\)|~[a-zA-Z]"[^"]*")', // 2 string/sigil
  '(~r\\/[^\\/\\n]*\\/[a-z]*)',                                   // 3 regex sigil
  '(:"[^"]*"|:[a-zA-Z_][a-zA-Z0-9_]*[?!]?|\\b[a-zA-Z_][a-zA-Z0-9_]*:(?=\\s))', // 4 atom / key
  '(@[a-z_][a-zA-Z0-9_]*)',                                       // 5 attribute
  '\\b(def|defp|defmodule|defstruct|defprotocol|defimpl|defexception|defguard|defmacro|defdelegate|defoverridable|do|end|fn|case|cond|if|else|unless|when|and|or|not|in|with|for|receive|after|try|rescue|catch|throw|raise|import|alias|require|use|quote|unquote|true|false|nil|self|spawn|spawn_link|send|schema|embedded_schema|field|has_many|has_one|belongs_to|many_to_many|timestamps|plug|pipeline|scope|resources|forward|from|where|select|select_merge|order_by|limit|offset|join|preload|group_by|having|const|let|var|function|return|import|export|new|await|async)\\b', // 6 kw
  '\\b([A-Z][A-Za-z0-9_]*)',                                      // 7 module
  '\\b(\\d[\\d_]*(?:\\.\\d+)?)\\b',                               // 8 number
  '(\\|&gt;|-&gt;|&lt;-|=&gt;|\\\\\\\\|::|&lt;&lt;|&gt;&gt;)'      // 9 operator
].join('|'), 'g');

function highlight(code) {
  const cls = [null, 't-com', 't-str', 't-str', 't-atm', 't-kw', 't-kw', 't-mod', 't-num', 't-op'];
  return esc(code).replace(HL, (m, ...groups) => {
    for (let i = 0; i < 9; i++) {
      if (groups[i] !== undefined) return `<span class="${cls[i + 1]}">${groups[i]}</span>`;
    }
    return m;
  });
}

/* markdown-lite for prose: **bold**, `code`, *em* */
function prose(text) {
  return esc(text)
    .replace(/`([^`]+)`/g, '<code class="px-1 py-0.5 rounded bg-ink-600 text-plum-300 font-mono text-[0.85em]">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong class="text-plum-300 font-semibold">$1</strong>')
    .replace(/(^|[\s(])\*([^*\n]+)\*/g, '$1<em class="text-mint-400 not-italic">$2</em>');
}

/* ============================================================
   Storage
   ============================================================ */
const KEY = 'learnelixir.v2';
function loadState() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
}
function saveState(s) {
  try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {}
}

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
  }
  return Promise.resolve(fallbackCopy(text));
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
}

function CodeBlock({ sample }) {

  const onCopy = () => { copyText(sample.code); setCopied(true); setTimeout(() => setCopied(false), 1400); };

  return html`
    <div class="rounded-xl border border-ink-500/70 bg-ink-800/70 overflow-hidden mb-4">
      <div class="flex items-start justify-between gap-3 px-3.5 py-2.5 border-b border-ink-500/60 bg-ink-700/50">
        <div class="min-w-0">
          <div class="text-[12px] font-semibold text-plum-300 truncate">${sample.title}</div>
          ${sample.note ? html`<div class="text-[11px] text-slate-400 mt-0.5 leading-snug">${sample.note}</div>` : null}
        </div>
        <button
          onClick=${onCopy}
          class="shrink-0 text-[10.5px] uppercase tracking-wider px-2.5 py-1 rounded-md border transition
                 ${copied ? 'border-mint-500 text-mint-400 bg-mint-500/10' : 'border-ink-500 text-slate-400 hover:text-plum-300 hover:border-plum-500'}">
          ${copied ? 'copied' : 'copy'}
        </button>
      </div>
      <pre class="code px-3.5 py-3 text-slate-200" dangerouslySetInnerHTML=${{ __html: highlight(sample.code) }}></pre>
    </div>`;
}

        <h2 class="text-[11px] font-bold uppercase tracking-[0.18em] ${tint}">${title}</h2>
        ${badge ? html`<span class="text-[10px] text-slate-500">${badge}</span>` : null}
      </header>
      <div class="flex-1 min-h-0 overflow-y-auto">${children}</div>
    </section>`;
}

  const p = card.phil;
  const [zoom, setZoom] = useState(false);
