{
  id:23, mod:"4 · Shape & Contracts", title:"Errors as data vs exceptions",
  front:"`File.read/1` returns `{:error, :enoent}` but `File.read!/1` raises. When should YOUR code do each?",
  back:"Return a tagged tuple for **expected** failures the caller can reasonably handle (record not found, invalid input, timeout). `raise` for **impossible** situations that mean a bug or a broken environment (missing config, corrupted state). The `!` suffix is the convention for the raising variant. On the BEAM, letting an unexpected error crash the process is a legitimate strategy, not laziness — that is card 35.",
  phil:{
    lead:"Elixir splits failures into two kinds and gives each its own mechanism. Choosing correctly is a design skill, not a style preference.",
    body:[
      "Exceptions in most languages are used for both kinds, so every call site becomes ambiguous and people wrap everything in try/catch. Elixir instead says: if a failure is part of the normal domain, it is DATA — return it, match on it, let `with` compose it. If it is not part of the domain, do not pollute every caller with handling it; raise, and let the supervisor restart a clean process.",
      "This is why `try/rescue` is rare in idiomatic Elixir. You will see it around foreign boundaries — a JSON library that raises, a NIF, a third-party HTTP client — and almost nowhere else. Rescuing broadly is usually a sign that you are fighting the runtime instead of using it.",
      "Note the three separate escape mechanisms: `raise/rescue` for exceptions, `throw/catch` for non-local exits out of deep recursion (rare), and `exit` for process termination signals (which supervisors use). Knowing they are distinct saves confusion when you read Erlang stack traces."
    ],
    diagram:`   EXPECTED FAILURE (domain)          UNEXPECTED FAILURE (bug/env)
   ─────────────────────────          ────────────────────────────
   {:ok, v} | {:error, reason}        raise / the ! variant
   caller matches and decides         process crashes, supervisor restarts
   e.g. user not found                e.g. missing DB config at boot
        invalid email                      state that cannot exist
        request timed out                  a math error in your own code

   CONVENTION
   File.read("x")   → {:error, :enoent}      safe form
   File.read!("x")  → ** (File.Error)        bang form, for when you
   Repo.get(User,1) → nil | %User{}          are sure — or want a crash
   Repo.get!(User,1)→ raises Ecto.NoResultsError

   THREE ESCAPE MECHANISMS (do not confuse them)
   raise  → rescue   exceptions, %RuntimeError{} etc.
   throw  → catch    non-local return out of deep recursion (rare)
   exit   → trapped  process death signal; supervisors live here`,
    takeaway:"Domain failures are data. Bugs raise and the supervisor cleans up. Bang functions are the raising variant."
  },
  code:[
    {title:"Both variants of your own function", note:"", code:`defmodule Config do
  @settings %{"port" => 4000}

  def fetch(key) do
    case Map.fetch(@settings, key) do
      {:ok, v} -> {:ok, v}
      :error   -> {:error, :missing}
    end
  end

  def fetch!(key) do
    case fetch(key) do
      {:ok, v} -> v
      {:error, :missing} -> raise ArgumentError, "missing config key: #{key}"
    end
  end
end

Config.fetch("port")
Config.fetch("nope")
Config.fetch!("port")
# Config.fetch!("nope")    # ** (ArgumentError) missing config key: nope`},

{
  id:24, mod:"4 · Shape & Contracts", title:"Structs",
  front:"A plain map lets any key in. How do you define a User with a fixed set of fields that fails loudly on typos?",
  back:"`defstruct` inside a module. `%User{name: \"Ada\"}` creates a map with a hidden `__struct__: User` key and ONLY the declared fields — a typo is a compile-time error. Structs are still maps, so all Map functions work, but they have no `Access` behaviour by default (`user[:name]` fails; use `user.name`) and they carry a type you can pattern-match on.",
  phil:{
    lead:"A struct is a map plus a name plus a closed set of fields — enough structure to catch mistakes, still plain data.",
    body:[
      "The `__struct__` key is what makes `%User{}` matchable in a function head. That single trick gives Elixir type-based dispatch without objects: `def notify(%User{} = u)` and `def notify(%Admin{} = a)` are two clauses distinguished by struct name. Ecto schemas, Plug.Conn, Ecto.Changeset, DateTime — everything you will touch in the web stack is a struct.",
      "Field defaults are declared once and `@enforce_keys` makes chosen fields mandatory at construction time. Combined, they let a struct express a real invariant: a User without an email cannot be built by accident.",
      "Because a struct is still a map, updating uses the same `%{user | field: v}` syntax you already know — and that form checks that the field exists, so a typo in an update also fails immediately."
    ],
    diagram:`   defmodule User do
     @enforce_keys [:email]
     defstruct [:email, :name, role: :member, active: true]
   end

   %User{email: "a@b.c"}
   ⇒ %User{__struct__: User, email: "a@b.c", name: nil,
            role: :member, active: true}
        └────┬────┘
        hidden key = the TYPE tag; this is what you match on

   %User{typo: 1}       ⇒ COMPILE ERROR: unknown key ✓
   %User{}              ⇒ ERROR: the following keys must be given: [:email]
   %{user | role: :x}   ⇒ ok, field exists
   %{user | rle: :x}    ⇒ KeyError ✓

   struct IS a map:      Map.from_struct(u), Map.put(u, :name, "x")
   struct is NOT Access: u.name ✓        u[:name] ✗ (unless you derive it)

   DISPATCH BY STRUCT NAME:
   def notify(%User{}),  do: :email
   def notify(%Admin{}), do: :pager`,
    takeaway:"defstruct = named map with fixed fields. The struct name is a type you can match."
  },
  code:[

  defstruct [:email, :name, role: :member, active: true]
end

{
  id:25, mod:"4 · Shape & Contracts", title:"Protocols",
  front:"You want `size/1` to work on your struct, on lists, on maps, and on anything a future library defines — without editing those types. How?",
  back:"A **protocol**: `defprotocol Size do def size(t) end`, then a separate `defimpl Size, for: MyStruct` for each type. Dispatch happens at runtime on the data's type. Crucially, anyone can add an implementation for a type they do not own — that is why `Enumerable`, `Inspect`, `String.Chars` and `Jason.Encoder` are protocols.",
  phil:{
    lead:"Protocols give polymorphism on DATA: the value decides which implementation runs, and implementations live wherever they are needed.",
    body:[
      "This solves the expression problem in the direction backends care about. You cannot go and add a method to Elixir's List module, but you can write `defimpl Jason.Encoder, for: MyApp.Money` in your own project and suddenly your struct serialises to JSON everywhere in your app. Every serious library exposes its extension points this way.",
      "You have been using protocols since card 17 without noticing: `Enum` works on lists, maps, ranges, streams and Ecto results because each implements `Enumerable`. `to_string/1` uses `String.Chars`. `inspect/1` uses `Inspect` — and implementing `Inspect` for a struct holding a password is how you keep secrets out of your logs.",
      "`@derive` is the shortcut: it generates a standard implementation for your struct at definition time, which is how you say 'encode this struct to JSON using these fields' in one line."
    ],
    diagram:`   defprotocol Size do              ONE function name
     def size(data)                 MANY implementations
   end                              chosen by the DATA at runtime

   defimpl Size, for: BitString  do def size(s), do: byte_size(s) end
   defimpl Size, for: Map        do def size(m), do: map_size(m)  end
   defimpl Size, for: MyApp.Bag  do def size(b), do: b.count      end
                       │
                       └── you can implement a protocol for a type
                           you did NOT write, from your own project ✓

       Size.size(%MyApp.Bag{}) ──▶ looks at __struct__ ──▶ Bag impl

   PROTOCOLS YOU ALREADY USE
   Enumerable   → Enum.*/Stream.*      String.Chars → to_string/1, "#{}"
   Inspect      → inspect/1, IO.inspect  (hide secrets here!)
   Collectable  → Enum.into/2, for into:
   Jason.Encoder→ JSON serialisation of your structs

   @derive {Jason.Encoder, only: [:id, :name]}   ← the one-line shortcut`,
    takeaway:"Protocol = one interface, many data types, open for extension by anyone."
  },

  @doc "Returns a size for any supported term."

end

defimpl Size, for: List,      do: (def size(l), do: length(l))

{
  id:26, mod:"4 · Shape & Contracts", title:"Behaviours",
  front:"Protocols dispatch on data. What dispatches on MODULES — as in 'any module that provides init/1 and handle_call/3 can be a GenServer'?",
  back:"A **behaviour**. `@callback` declarations in one module define a contract; another module writes `@behaviour ThatModule` and implements the callbacks, with the compiler warning about anything missing. This is exactly how GenServer, Supervisor, Plug, Phoenix.Channel and Ecto.Repo define what you must provide.",
  phil:{
    lead:"A behaviour is an interface for modules — the seam where OTP hands you a slot to fill and takes care of everything else.",
    body:[
      "This is the single most important abstraction to understand before OTP, because every OTP building block is a behaviour. GenServer implements the whole message loop, the timeouts, the system messages and the debug hooks; your module supplies only the callbacks that describe YOUR logic. You are writing the interesting 5% and inheriting 30 years of battle-tested plumbing.",
      "The mechanics are simple: `@callback name(arg :: type) :: return_type` declares the contract, `@behaviour Mod` opts in, `@impl true` marks each implementation (and makes the compiler catch typos in callback names — always use it).",
      "Behaviours also give you swappable adapters, which is how you make code testable. Declare a behaviour for your payment gateway, implement a real one and a fake one, and select between them in config. No mocking library required."
    ],
    diagram:`   PROTOCOL                          BEHAVIOUR
   dispatches on DATA                dispatches on MODULE
   defimpl X, for: SomeStruct        @behaviour X  +  @impl true
   Enumerable, Inspect, Jason        GenServer, Supervisor, Plug, Ecto.Repo

   defmodule Gateway do                    ┌── the contract ──┐
     @callback charge(map) ::              │  charge/1        │
       {:ok, map} | {:error, term}         │  refund/1        │
     @callback refund(String.t) :: :ok     └──────────────────┘
   end

   defmodule Stripe  do @behaviour Gateway … end   ← real
   defmodule FakePay do @behaviour Gateway … end   ← test double
                     │
   config :app, :gateway, Stripe      ← swap by configuration
   Application.get_env(:app, :gateway).charge(%{})

   ┌──────── WHY OTP IS A BEHAVIOUR ─────────────────────────────┐
   │  GenServer gives you: the receive loop, timeouts, hibernate,│
   │  system messages, tracing, error reports, code upgrade      │
   │  YOU give: init/1, handle_call/3, handle_cast/2 …           │
   └─────────────────────────────────────────────────────────────┘`,
    takeaway:"Behaviour = a module-level contract. All of OTP is behaviours you fill in."
  },

{
  id:27, mod:"5 · Project & Tooling", title:"Mix — projects and dependencies",
  front:"You are done with iex snippets. What command creates a real application, and what does the `--sup` flag add that matters enormously?",
  back:"`mix new my_app --sup`. Mix is build tool, task runner, dependency manager and test runner in one. The `--sup` flag generates an **Application** module with a supervision tree — the root of everything long-running in your service. Without it you have a library; with it you have a service that can hold processes, connection pools and a web server.",
  phil:{
    lead:"Everything from here on lives in a Mix project, because a real backend needs dependencies, config, tests and a supervision tree.",
    body:[
      "`mix.exs` is a normal Elixir module, not a config file format. `deps/0` returns a list, `application/0` declares which module starts your tree, and you can compute any of it in code. Dependencies are fetched into `deps/`, compiled into `_build/`, and locked in `mix.lock` — commit that file.",
      "The task system is extensible: `mix ecto.migrate`, `mix phx.server`, `mix test` are all just modules named `Mix.Tasks.Something`. You can write your own in `lib/mix/tasks/` and it appears in `mix help` immediately. Aliases in `mix.exs` chain tasks together, which is how projects define a single `mix setup`.",
      "Three commands you will type daily: `mix deps.get`, `iex -S mix` (start the shell WITH your app running — this is where you will test everything from now on), and `mix test`."
    ],
    diagram:`   mix new my_app --sup

   my_app/
   ├── mix.exs              project definition: deps, app, aliases
   ├── mix.lock             exact dependency versions — COMMIT THIS
   ├── config/
   │   ├── config.exs       compile-time, all envs
   │   ├── dev.exs prod.exs test.exs
   │   └── runtime.exs      RUNTIME — reads env vars (card 28)
   ├── lib/
   │   ├── my_app.ex
   │   └── my_app/
   │       └── application.ex   ← the supervision tree root (--sup)
   ├── test/
   └── _build/  deps/           generated, gitignored

   DAILY COMMANDS
   mix deps.get        fetch dependencies
   iex -S mix          shell WITH your app + deps loaded  ★
   mix test            run tests
   mix format          format everything
   mix compile --warnings-as-errors
   mix help            every task available to you`,
    takeaway:"mix new --sup gives you a supervised application. iex -S mix is your new home."
  },
  code:[
    {title:"Create the project you will use for the rest of the deck", note:"Run these in your terminal, not in iex.", code:`mix new shop --sup
cd shop
mix deps.get
mix test
iex -S mix

# inside that iex session:

{
  id:28, mod:"5 · Project & Tooling", title:"Config: compile-time vs runtime",
  front:"Your DATABASE_URL is set on the production server. Why does reading it in `config/prod.exs` silently break, and where does it belong?",
  back:"`config/*.exs` files are evaluated at **compile time** — on your build machine or in Docker build, where the production env var does not exist. `config/runtime.exs` is evaluated when the release **starts**, on the actual server. Every secret and environment-dependent value goes in `runtime.exs`; only structural, build-time settings go in the others.",
  phil:{
    lead:"Elixir compiles configuration into the release, so knowing WHEN a config file runs is the difference between a working deploy and a mystery.",
    body:[
      "This trips up nearly every newcomer, and it is worth internalising once. `config.exs` and its per-environment siblings run during `mix compile`. They are great for things that are true about your code — which Ecto adapter, which JSON library, log level defaults. `runtime.exs` runs in the released binary at boot, so `System.get_env/1` actually sees the server's environment.",
      "The values land in the **application environment**, a per-application key-value store you read with `Application.get_env/3` (or better, `Application.compile_env/3` when the value must be fixed at compile time — it makes the compiler warn you if the two disagree).",
      "The related habit: never read config at the top level of a module body, because that captures the compile-time value forever. Read it inside a function, or fetch it once in your Application start callback and pass it into the process that needs it."
    ],
    diagram:`   TIMELINE OF A RELEASE

   ┌── on the BUILD machine ──────────────┐   ┌── on the SERVER ──────────┐
   │  mix compile                         │   │  ./bin/shop start         │
   │    ├─ config/config.exs      ✔ runs  │   │    └─ config/runtime.exs  │
   │    ├─ config/prod.exs        ✔ runs  │   │           ✔ runs HERE     │
   │    └─ System.get_env("DB")   ✘ nil!  │   │  System.get_env("DB") ✔   │
   └──────────────────────────────────────┘   └───────────────────────────┘

   config/config.exs   → shared, compile time   (adapters, log level)
   config/dev|test|prod.exs → per env, compile time
   config/runtime.exs  → EVERY secret, URL, port, pool size  ★

   READ IT
   Application.get_env(:shop, :feature_flag, false)   at runtime  ✓
   Application.compile_env(:shop, :adapter)           frozen, warns on drift
   Application.fetch_env!(:shop, Shop.Repo)           raise if missing

   ✗ NEVER:  @port Application.get_env(:shop, :port)   ← frozen at compile`,
    takeaway:"Secrets and env vars live in runtime.exs. Everything else compiles in."
  },
  code:[
    {title:"config/runtime.exs — the real one", note:"This is production-shaped; copy it into a project.", code:`import Config

if config_env() == :prod do
  database_url =
    System.get_env("DATABASE_URL") ||
      raise "environment variable DATABASE_URL is missing"

  config :shop, Shop.Repo,
    url: database_url,
    pool_size: String.to_integer(System.get_env("POOL_SIZE") || "10"),
    ssl: true,
    socket_options: [:inet6]

  secret_key_base =
    System.get_env("SECRET_KEY_BASE") ||
      raise "environment variable SECRET_KEY_BASE is missing"

  config :shop, ShopWeb.Endpoint,
    url: [host: System.get_env("PHX_HOST") || "example.com", port: 443],
    http: [ip: {0, 0, 0, 0, 0, 0, 0, 0}, port: String.to_integer(System.get_env("PORT") || "4000")],
    secret_key_base: secret_key_base,
    server: true
end`},
    {title:"config/config.exs — compile time", note:"", code:`import Config

config :shop, ecto_repos: [Shop.Repo]
config :shop, Shop.Repo, adapter: Ecto.Adapters.Postgres
config :logger, :console, format: "$time $metadata[$level] $message\\n"
config :shop, :feature_flags, new_checkout: false

# per-environment files are imported LAST so they win:
import_config "#{config_env()}.exs"`},
    {title:"Reading config correctly", note:"Try these in iex -S mix.", code:`Application.get_env(:shop, :feature_flags)
Application.get_env(:shop, :feature_flags, [])[:new_checkout]
Application.fetch_env!(:logger, :console)
Application.put_env(:shop, :feature_flags, new_checkout: true)   # runtime toggle
Application.get_all_env(:shop)`},
    {title:"The freeze bug, demonstrated", note:"Why config belongs inside functions.", code:`defmodule Bad do
  @flag Application.compile_env(:shop, [:feature_flags, :new_checkout])
  def on?, do: @flag        # frozen at compile time, forever
end

defmodule Good do
  def on? do
    Application.get_env(:shop, :feature_flags, [])
    |> Keyword.get(:new_checkout, false)
  end
end

Application.put_env(:shop, :feature_flags, new_checkout: true)
Bad.on?     # still the old value
Good.on?    # true ✓`}
  ]
},
{
  id:29, mod:"5 · Project & Tooling", title:"ExUnit and doctests",
  front:"How do you test a module, and how do the examples in your `@doc` become tests automatically?",
  back:"`ExUnit` ships with Elixir: `defmodule XTest do use ExUnit.Case; test \"...\" do assert ... end end` in `test/`. Add `doctest MyModule` and every `iex>` example inside your `@doc` strings is executed and compared against its stated output — so your documentation cannot silently rot. Tests run concurrently with `async: true`, which is possible precisely because processes are isolated.",
  phil:{
    lead:"Testing in Elixir is unusually pleasant because pure functions dominate and the runtime isolates everything else.",
    body:[
      "Most of your code takes data and returns data, so most tests are `assert transform(input) == expected` with no setup, no mocks, no fixtures. The parts that are not pure are processes, and ExUnit gives you real tools for them: start a supervised process per test with `start_supervised!/1` and it is torn down automatically, keeping tests independent.",
      "`async: true` runs test MODULES in parallel across cores. It is safe by default because each test process has its own state; the only shared resource is usually the database, and Ecto solves that by running each test in a transaction that is rolled back (the SQL Sandbox, card 72).",
      "Doctests deserve a special mention: they make examples in documentation executable. Write your `@doc` with an `iex>` line and its result, add one `doctest` line to the test file, and your docs are now verified by CI."
    ],
    diagram:`   lib/shop/cart.ex                 test/shop/cart_test.exs
   ┌───────────────────────────┐    ┌───────────────────────────────┐
   │ @doc """                  │    │ defmodule Shop.CartTest do    │
   │     iex> Cart.total([2,3])│───▶│   use ExUnit.Case, async: true│
   │     5                     │    │   doctest Shop.Cart  ← runs   │
   │ """                       │    │        the doc examples       │
   │ def total(p), do: sum(p)  │    │   test "adds" do              │
   └───────────────────────────┘    │     assert Cart.total([1]) ==1│
                                    │   end                         │
                                    │ end                           │
                                    └───────────────────────────────┘

   ASSERTIONS         assert / refute / assert_raise / assert_receive
                      assert {:ok, %{id: id}} = create(...)   ← match+bind!
   SETUP              setup, setup_all, on_exit, @tag, @moduletag
   PROCESSES          start_supervised!({Counter, 0})  auto-torn-down
   RUN                mix test                mix test --failed
                      mix test path:42        mix test --only integration
                      mix test --cover        mix test --seed 0`,
    takeaway:"Pure functions make tests trivial; async is safe because processes are isolated; doctests keep docs honest."
  },
  code:[
    {title:"A module with doctests", note:"Save as lib/shop/cart.ex in your mix project.", code:`defmodule Shop.Cart do
  @moduledoc "Cart totals in integer cents."

  @doc """
  Sums line item prices.

      iex> Shop.Cart.total([100, 250])
      350

      iex> Shop.Cart.total([])
      0
  """
  def total(prices), do: Enum.sum(prices)

  @doc """
  Applies a percentage discount, rounding to the nearest cent.

      iex> Shop.Cart.discount(1000, 10)
      900
  """
  def discount(cents, pct) when pct >= 0 and pct <= 100 do
    round(cents * (100 - pct) / 100)
  end
end`},
    {title:"The test file", note:"test/shop/cart_test.exs — then run mix test", code:`defmodule Shop.CartTest do
  use ExUnit.Case, async: true
  doctest Shop.Cart

  describe "total/1" do
    test "sums line items" do
      assert Shop.Cart.total([100, 250, 5]) == 355
    end

    test "empty cart is free" do
      assert Shop.Cart.total([]) == 0
    end
  end

  describe "discount/2" do

    end

end`},
    {title:"setup, tags and fixtures", note:"", code:`defmodule OrderTest do

{
  id:30, mod:"5 · Project & Tooling", title:"Docs, typespecs and static tools",
  front:"Elixir is dynamically typed. What gives you type checking, dead-code detection and style enforcement anyway?",
  back:"`@spec` typespecs plus **Dialyzer** (success typing — it only reports what it can PROVE wrong), **Credo** for style and consistency, `mix format` for formatting (settled by the language, not by debate), and `@doc`/`@moduledoc` for documentation that ships inside the bytecode and powers `h`, ExDoc and doctests.",
  phil:{
    lead:"Types are optional annotations here, and the tooling is built to be useful without ever demanding full coverage.",
    body:[
      "Dialyzer works by success typing: it infers what CAN succeed and complains only when a contract is definitely impossible — an unreachable clause, a function that can never return what its spec claims, a call that will always fail. It never forces you to annotate everything, and it never reports a false positive by design. The trade-off is that it is slower to catch things than a real type checker. Elixir is actively gaining a proper set-theoretic type system, which will land gradually in future releases.",
      "Specs pay for themselves as documentation of intent at module boundaries, especially in a service where a context module is the public API of a domain. Put specs on public functions, skip them on obvious private ones.",
      "`mix format` deserves its own note: Elixir has an official formatter, so formatting is not a team discussion. Add `.formatter.exs`, run it in CI with `--check-formatted`, and never think about it again."
    ],
    diagram:`   @moduledoc  @doc         → stored IN the .beam file
        │                      → powers  h Mod.fun,  ExDoc HTML, doctests
        ▼
   @spec total([integer()]) :: integer()
   @type cents :: non_neg_integer()
   @opaque token :: binary()

   ┌──────────┬──────────────────────────────────────────────────┐
   │ dialyzer │ proves impossible code paths, wrong specs,       │
   │          │ unreachable clauses. Never false positives.      │
   │ credo    │ style, complexity, consistency, code smells      │
   │ format   │ official formatter — no style debates            │
   │ sobelow  │ security scanner for Phoenix apps                │
   │ ex_doc   │ generates the docs website from @doc             │
   └──────────┴──────────────────────────────────────────────────┘

   CI PIPELINE WORTH COPYING
   mix format --check-formatted
   mix compile --warnings-as-errors
   mix credo --strict
   mix dialyzer
   mix test --cover`,
    takeaway:"Specs + Dialyzer prove what is impossible; format and credo remove the arguments."
  },
  code:[
    {title:"A well-annotated module", note:"", code:`defmodule Shop.Pricing do
  @moduledoc """
  Pricing rules. All money is integer cents; never use floats for money.
  """

  @type cents :: non_neg_integer()
  @type line  :: %{sku: String.t(), qty: pos_integer(), price: cents()}

  @doc """
  Total for a list of lines.

      iex> Shop.Pricing.subtotal([%{sku: "a", qty: 2, price: 500}])
      1000
  """
  @spec subtotal([line()]) :: cents()
  def subtotal(lines) do
    Enum.reduce(lines, 0, fn %{qty: q, price: p}, acc -> acc + q * p end)
  end

  @spec apply_tax(cents(), float()) :: cents()
  def apply_tax(amount, rate) when rate >= 0.0, do: round(amount * (1 + rate))
end

Shop.Pricing.subtotal([%{sku: "a", qty: 2, price: 500}])`},

{
  id:31, mod:"6 · Concurrency", title:"Processes and spawn",
  front:"`spawn/1` returns a PID. What exactly did you create, and how is it different from a thread?",
  back:"A **BEAM process**: an isolated unit with its own heap, stack, mailbox and garbage collector, scheduled preemptively by the VM. Creating one costs microseconds and ~2KB. It shares nothing with its creator. `self()` gives you your own PID; `spawn/1` returns the child's. A crashed process affects nobody unless they explicitly linked to it.",
  phil:{
    lead:"You already know how to write a tail-recursive loop (card 20). A process is that loop, running independently, with an inbox.",
    body:[
      "The word 'process' is chosen deliberately: they are like OS processes in their isolation, but like green threads in their cost. That combination is unusual and it is Elixir's core superpower. Because they are cheap, you do not pool them or ration them — you spawn one per connection, per user, per job, per state machine. Modelling the domain as one process per concurrent thing is the idiomatic design.",
      "Because they are isolated, failure is contained by default and concurrency needs no locks. Because they are preemptively scheduled, no process can hog a core. And because each has its own tiny heap, garbage collection never stops the world.",
      "Raw `spawn` is what everything else is built on, but you will almost never use it in production code. Task, Agent, GenServer and Supervisor all wrap it with error handling and lifecycle. Learn spawn to understand the machine, then use the abstractions."
    ],
    diagram:`   PROCESS  = heap + stack + mailbox + GC + a PID
   ┌─────────────────────────────────────┐
   │  PID <0.142.0>                      │
   │  ┌────────┐  ┌──────────────────┐   │
   │  │ heap   │  │ mailbox (queue)  │◀──┼── send(pid, msg)
   │  │ ~2KB   │  │ msg msg msg …    │   │
   │  └────────┘  └──────────────────┘   │
   │  own garbage collector              │
   └─────────────────────────────────────┘
        shares NOTHING with any other process

   OS thread   ~1MB, kernel scheduled, thousands max
   Goroutine   ~4KB, no isolation, shared memory
   BEAM proc   ~2KB, isolated heap, MILLIONS, preemptive ✓

   spawn(fn -> … end)          → pid, fire and forget
   spawn_link(fn -> … end)     → pid, linked (card 34)
   self()                      → my own pid
   Process.alive?(pid)         → is it still running
   Process.list() |> length()  → every process on the node

   ONE PROCESS PER CONCURRENT THING: per request, per user,
   per socket, per job, per state machine.`,
    takeaway:"Processes are cheap, isolated, preemptive. Model one per concurrent thing."
  },
  code:[
    {title:"Your first processes", note:"", code:`self()
pid = spawn(fn -> IO.puts("hello from #{inspect(self())}") end)
Process.alive?(pid)      # likely false — it already finished

# a process that lives
worker = spawn(fn -> Process.sleep(60_000) end)
Process.alive?(worker)
Process.info(worker, [:memory, :message_queue_len, :status])`},
    {title:"Cheapness, measured", note:"Time 100k processes.", code:`{micros, _} = :timer.tc(fn ->
  for _ <- 1..100_000, do: spawn(fn -> Process.sleep(5_000) end)
end)

IO.puts("spawned 100k in #{micros / 1000} ms")
:erlang.system_info(:process_count)`},
    {title:"Isolation, demonstrated", note:"The child dies; your shell is untouched.", code:`spawn(fn -> raise "I am on fire" end)
# you see an error report printed by the logger…
self()                    # …and your shell process is perfectly fine ✓
1 + 1`},
    {title:"Concurrency is real", note:"All ten run at once; total time is the slowest, not the sum.", code:`parent = self()

start = System.monotonic_time(:millisecond)
for i <- 1..10 do
  spawn(fn ->
    Process.sleep(1_000)
    send(parent, {:done, i})
  end)
end

# collect them (receive is the next card)
results = for _ <- 1..10 do
  receive do {:done, i} -> i after 3_000 -> :timeout end
end

{results, System.monotonic_time(:millisecond) - start}   # ~1000ms, not 10000`}
  ]
},
{
  id:32, mod:"6 · Concurrency", title:"send, receive and the mailbox",
  front:"Processes share nothing. So how does one get data from another?",
  back:"Messages. `send(pid, term)` copies the term into the target's **mailbox** and returns immediately — it never blocks and never fails, even if the process is dead. `receive do pattern -> ... end` scans the mailbox for the FIRST message matching any pattern, removes it, and runs that branch; it blocks until one matches, unless you add an `after` timeout.",
  phil:{
    lead:"Message passing is asynchronous by nature. Everything synchronous in Elixir — including GenServer.call — is built by sending a message and then waiting for a reply.",
    body:[
      "Two details matter enormously in production. First, `receive` does **selective receive**: it walks the mailbox looking for a match, so a message nobody ever matches stays there forever. An unbounded mailbox full of unmatched messages is the classic Elixir memory leak, which is why GenServer's catch-all `handle_info/2` exists.",
      "Second, `send` is fire-and-forget. There is no delivery guarantee and no backpressure; a fast sender can flood a slow receiver. This is why you use `GenServer.call` (which waits for a reply and therefore self-limits) rather than `cast` for anything that must not pile up.",
      "The request/reply pattern — send your own PID inside the message so the other side knows where to answer — is worth writing by hand once. After that you will let GenServer do it, but you will know exactly what it is doing."
    ],
    diagram:`   PROCESS A                          PROCESS B
   ─────────                          ─────────
   send(b, {:hi, self()})  ──copy──▶  mailbox: [{:hi, #PID<A>}]
   (returns immediately)                  │
                                      receive do
                                        {:hi, from} -> send(from, :pong)
                                      end
   receive do                             │
     :pong -> ...        ◀───────copy─────┘
   end

   SELECTIVE RECEIVE — scans in order, takes the FIRST match
   mailbox: [ :junk , {:job, 1} , :junk2 ]
   receive do {:job, n} -> n end     ⇒ takes {:job,1}, leaves the junk
                                        ⚠ junk accumulates FOREVER = leak

   receive do
     msg -> handle(msg)
   after
     5_000 -> :timeout          ← ALWAYS have a timeout in real code
   end

   send never blocks, never fails, never confirms delivery.
   Synchronous = send + wait for a reply. That is all call/3 is.`,
    takeaway:"send copies and returns. receive selectively matches. Unmatched messages leak."
  },

  id:33, mod:"6 · Concurrency", title:"State without mutation",
  front:"Everything is immutable and there are no variables to update. So where does a running server keep its state?",
  back:"In the ARGUMENTS of an infinite tail-recursive loop inside a process. `loop(state)` receives a message, computes a NEW state, and calls `loop(new_state)`. The old state is simply garbage. The process identity (its PID) stays constant while the value it carries changes — that is mutable state built entirely out of immutable values.",
  phil:{
    lead:"This is the single most important idea in the deck. Read the code sample twice; every GenServer, every Phoenix channel and every connection pool is this loop.",
    body:[
      "Immutability seemed to forbid stateful servers. The resolution is to move state out of memory cells and into TIME: state is what the loop is currently holding. Nothing is overwritten; the loop just recurses with a different value. Because it is a tail call (card 20), this runs forever in constant memory.",
      "Notice what you get for free. The state is only reachable from inside that one process, so it can never be corrupted by concurrent access — the mailbox serialises every request into a queue. You have mutual exclusion without a single lock, purely as a consequence of the process model.",
      "Once you see the loop, GenServer stops being magic: it is this exact pattern with the boilerplate extracted, plus timeouts, error reporting, system introspection and supervisor integration. Write the raw version once so that you always know what is underneath."
    ],
    diagram:`   defp loop(state) do
     receive do
       {:put, k, v}      -> loop(Map.put(state, k, v))   ← NEW state
       {:get, k, from}   -> send(from, Map.get(state, k))
                            loop(state)                  ← same state
       :stop             -> :ok                          ← loop ends, dies
     end
   end

   TIME ──────────────────────────────────────────────────────▶
   loop(%{})  ─{:put,:a,1}─▶  loop(%{a: 1})  ─{:put,:b,2}─▶  loop(%{a:1,b:2})
      ▲                            ▲                              ▲
   old value                  old value                     current value
   is garbage                 is garbage                    (unreachable
                                                             from outside)

   ┌── WHY THIS IS SAFE WITHOUT LOCKS ───────────────────────────┐
   │ 1000 processes send at once → all land in ONE mailbox queue │
   │ the loop handles them ONE AT A TIME, in order               │
   │ ⇒ serialised access, zero locks, zero race conditions       │
   │ ⇒ but also: ONE process = ONE bottleneck (see card 42)      │
   └─────────────────────────────────────────────────────────────┘`,
    takeaway:"State lives in the loop's arguments. The mailbox serialises access, so no locks are ever needed."
  },
  code:[
    {title:"A key-value store from scratch", note:"No GenServer. This is the whole idea in 25 lines.", code:`defmodule KV do
  # ---------- client API (runs in the CALLER's process) ----------
  def start(initial \\\\ %{}), do: spawn(fn -> loop(initial) end)

  def put(pid, k, v), do: send(pid, {:put, k, v})

  def get(pid, k) do
    send(pid, {:get, k, self()})
    receive do
      {:value, v} -> v
    after
      1_000 -> {:error, :timeout}
    end
  end

  def stop(pid), do: send(pid, :stop)

  # ---------- server loop (runs in the SPAWNED process) ----------
  defp loop(state) do
    receive do
      {:put, k, v}    -> loop(Map.put(state, k, v))
      {:get, k, from} -> send(from, {:value, Map.get(state, k)}); loop(state)
      :stop           -> :ok
      other           -> IO.puts("ignoring #{inspect(other)}"); loop(state)
    end
  end
end

kv = KV.start()
KV.put(kv, :name, "Ada")
KV.put(kv, :lang, "Elixir")
KV.get(kv, :name)
KV.get(kv, :missing)`},
    {title:"A counter, and proof of serialisation", note:"1000 concurrent increments, no lock, no lost updates.", code:`defmodule Counter do
  def start, do: spawn(fn -> loop(0) end)
  def inc(pid), do: send(pid, :inc)
  def value(pid) do
    send(pid, {:value, self()})
    receive do {:value, n} -> n after 1_000 -> :timeout end
  end

  defp loop(n) do
    receive do
      :inc            -> loop(n + 1)
      {:value, from}  -> send(from, {:value, n}); loop(n)
    end
  end
end

c = Counter.start()
for _ <- 1..1000, do: spawn(fn -> Counter.inc(c) end)
Process.sleep(200)
Counter.value(c)      # exactly 1000 ✓ — no locks were used`},
    {title:"State machines are natural here", note:"The clause you are in IS the state.", code:`defmodule Door do
  def start, do: spawn(fn -> closed() end)

  defp closed do
    IO.puts("[closed]")
    receive do
      {:open, from}  -> send(from, :ok); open()
      {:lock, from}  -> send(from, :ok); locked()
      {_, from}      -> send(from, {:error, :invalid}); closed()
    end
  end

  defp open do
    IO.puts("[open]")
    receive do
      {:close, from} -> send(from, :ok); closed()
      {_, from}      -> send(from, {:error, :invalid}); open()
    end
  end

  defp locked do
    IO.puts("[locked]")
    receive do
      {:unlock, from} -> send(from, :ok); closed()
      {_, from}       -> send(from, {:error, :locked}); locked()
    end
  end
end

d = Door.start()
send(d, {:open, self()}); flush()
send(d, {:lock, self()}); flush()   # invalid from open`},

{
  id:34, mod:"6 · Concurrency", title:"Links, monitors and exit signals",
  front:"Process A spawned B. B crashes. What happens to A — and how do you choose the answer?",
  back:"With `spawn/1`: nothing, A never hears about it. With `spawn_link/1`: an **exit signal** propagates and A dies too (unless it traps exits). With `Process.monitor/1`: A stays alive and receives a `{:DOWN, ref, :process, pid, reason}` message. Links are bidirectional and fatal by default; monitors are one-directional and informational. Supervisors are built on links plus `trap_exit`.",
  phil:{
    lead:"Elixir gives you two different relationships between processes, and picking the right one is how you design fault tolerance.",
    body:[
      "A **link** says: our fates are shared. If either dies abnormally, so does the other. That sounds harsh until you see the purpose: it lets a group of processes that only make sense together die together, leaving no orphans and no half-finished state. A worker and its connection, a request and its helpers.",
      "A **monitor** says: tell me when you die, but I will survive it. That is what you want when you are waiting on something you do not own — a Task you spawned, a client you are serving, a process you looked up in a registry.",
      "`Process.flag(:trap_exit, true)` changes the rules for a process: incoming exit signals become ordinary `{:EXIT, pid, reason}` messages in the mailbox instead of killing it. That is the entire mechanism a Supervisor uses to notice a child died and restart it. Trapping exits in your own workers is usually a mistake — it makes them harder to kill and defeats the supervisor."
    ],
    diagram:`   NO LINK              spawn(fn -> crash end)
   A ──── spawns ────▶ B ✗          A is unaffected, learns nothing

   LINK (bidirectional, FATAL)      spawn_link
   A ◀═══ linked ═══▶ B ✗
   ✗                                A dies too, same exit reason

   LINK + trap_exit                 Process.flag(:trap_exit, true)
   A ◀═══ linked ═══▶ B ✗
   │  mailbox: {:EXIT, #PID<B>, reason}   ← becomes a MESSAGE ✓
   └─ A survives and decides what to do   ← THIS IS A SUPERVISOR

   MONITOR (one-way, informational) ref = Process.monitor(b)
   A ─── watches ───▶ B ✗
   │  mailbox: {:DOWN, ref, :process, #PID<B>, reason}
   └─ A survives                    Process.demonitor(ref, [:flush])

   :normal exit does NOT kill a linked process.
   Process.exit(pid, :kill) is untrappable — the nuclear option.`,
    takeaway:"Links share fate; monitors just notify. trap_exit turns death into a message — that is a supervisor."
  },
  code:[
    {title:"Link is fatal", note:"Do this in a THROWAWAY iex — it kills your shell process.", code:`# unlinked: shell survives, learns nothing
spawn(fn -> raise "boom" end)
self()

# linked: the shell process itself dies and restarts (you keep the session,
# but note the new PID and that all your bindings are gone)
self()
spawn_link(fn -> raise "boom" end)
self()          # different PID — your shell was killed and restarted`},
    {title:"Monitor is safe", note:"You get a message, not a death.", code:`{pid, ref} = spawn_monitor(fn -> Process.sleep(200); raise "nope" end)

receive do
  {:DOWN, ^ref, :process, ^pid, reason} -> {:it_died, reason}
after
  2_000 -> :still_running
end`},
    {title:"trap_exit — build a mini supervisor", note:"This is the core of OTP supervision, in 20 lines.", code:`defmodule MiniSup do
  def start(worker_fun) do
    spawn(fn ->
      Process.flag(:trap_exit, true)
      loop(worker_fun, spawn_link(worker_fun), 0)
    end)
  end

  defp loop(fun, pid, restarts) do
    receive do
      {:EXIT, ^pid, :normal} ->
        IO.puts("worker finished normally, stopping supervisor")
        :ok

      {:EXIT, ^pid, reason} ->
        IO.puts("worker died (#{inspect(reason)}) — restart ##{restarts + 1}")
        Process.sleep(200)
        loop(fun, spawn_link(fun), restarts + 1)
    end
  end
end

MiniSup.start(fn ->
  Process.sleep(500)
  raise "flaky worker"
end)
# watch it restart over and over`},
    {title:"Cleaning up and killing", note:"", code:`p = spawn(fn -> Process.sleep(:infinity) end)
ref = Process.monitor(p)
Process.exit(p, :shutdown)        # trappable
receive do msg -> msg after 500 -> :none end

q = spawn(fn -> Process.flag(:trap_exit, true); Process.sleep(:infinity) end)
Process.exit(q, :shutdown)        # trapped: becomes a message, q survives
Process.alive?(q)
Process.exit(q, :kill)            # :kill is NEVER trappable
Process.alive?(q)

Process.info(self(), :links)
Process.info(self(), :monitors)`}
  ]
},
{
  id:35, mod:"6 · Concurrency", title:"Let it crash",
  front:"Your JSON parser hits malformed input from one client. Should you wrap it in try/rescue?",
  back:"Usually no. Let that request's process crash. It affects only that one client, the supervisor restarts a clean process, the error is logged with a full stack trace, and your code stays free of defensive noise. You write the happy path; the runtime handles the rest. You DO handle errors you can meaningfully act on — retryable timeouts, validation failures shown to the user.",
  phil:{
    lead:"This is a philosophy, not a shortcut, and it only works because of everything in the last four cards: isolation, links, trapping, and cheap restarts.",
    body:[
      "Joe Armstrong's argument was that defensive programming multiplies the states your code can be in. Every `if result != nil` creates a branch that must itself be correct, and after enough of them nobody can reason about the system. Meanwhile the true cause of most production bugs is unexpected state — precisely the thing your defensive code is trying to limp through.",
      "The alternative is to make the failure region tiny and the recovery automatic. A crash resets the process to a known-good initial state. This is the software equivalent of turning it off and on again, applied at a granularity of one user, one request, one connection — hundreds of times a second if necessary, with nobody noticing.",
      "The discipline that makes it work: keep dangerous work in a process that owns nothing important, keep durable state elsewhere (the database, ETS, a supervised process that does not do risky work), and make `init` cheap so restarts are fast. Crash for bugs; return tagged tuples for expected domain outcomes (card 23)."
    ],
    diagram:`   DEFENSIVE STYLE                    LET IT CRASH
   ────────────────────────           ──────────────────────────────
   def handle(input) do               def handle(input) do
     if valid?(input) do                %{"id" => id} = input   ← match
       case parse(input) do             process(id)             ← or crash
         {:ok, v} ->                  end
           if v.id != nil do
             …3 more levels…          supervisor restarts a CLEAN process
           else …
   every branch = a new state         1 user affected, 0 lines of handling
   nobody can reason about it         full stack trace in the logs

              ┌───────────────┐
              │  Supervisor   │  restart strategy + limits
              └───────┬───────┘
       ┌──────────────┼──────────────┐
       ▼              ▼              ▼
   ┌───────┐     ┌───────┐      ┌───────┐
   │ conn1 │     │ conn2 │ ✗ ── │ conn3 │      conn2 crashes
   └───────┘     └───────┘      └───────┘      ↻ restarted fresh
    unaffected    fresh state    unaffected     users 1 and 3 never knew

   CRASH FOR: bugs, impossible state, broken invariants, bad config
   HANDLE:    timeouts you retry, validation you show the user,
              404s, business rules — these are DATA, not crashes`,
    takeaway:"Shrink the blast radius and automate recovery instead of defending every line."
  },
  code:[
    {title:"Defensive vs. matching", note:"Both are correct; the second is idiomatic and shorter.", code:`defensive = fn payload ->
  if is_map(payload) do
    case Map.fetch(payload, "user") do

          _ -> {:error, :bad_id}
        end
      _ -> {:error, :bad_user}
    end
  else
    {:error, :not_a_map}
  end
end

crashy = fn %{"user" => %{"id" => id}} when is_integer(id) -> id end

defensive.(%{"user" => %{"id" => 1}})
crashy.(%{"user" => %{"id" => 1}})
# crashy.(%{"user" => %{}})   # FunctionClauseError — loud, precise, local`},

{
  id:36, mod:"6 · Concurrency", title:"Task — concurrency for one job",
  front:"A request needs data from three slow APIs. How do you fetch them in parallel and collect all three results?",
  back:"`Task.async/1` for each, then `Task.await/2` on the list — or `Task.async_stream/3` when you have many items and want bounded concurrency. A Task is a process that computes one value and sends it back. It is linked and monitored for you, so failures propagate correctly instead of hanging forever.",
  phil:{
    lead:"Task is the smallest useful abstraction over spawn: one process, one result, correct failure semantics.",
    body:[
      "The critical detail is `async_stream`. Naively spawning one Task per item in a list of 100,000 will melt your database connection pool or the API you are calling. `Task.async_stream/3` takes `max_concurrency` and processes lazily, giving you a controlled parallel map with backpressure. That is the function you will actually reach for in production, combined with `Stream` from card 18.",
      "Use `Task.Supervisor` for fire-and-forget work. A bare `Task.start/1` is unsupervised and invisible; `Task.Supervisor.start_child/2` puts it under a supervisor so it is counted, traceable and shut down cleanly on deploy. `async_nolink` additionally means a crashing task does not take your caller down — essential inside a web request or a GenServer.",
      "Rule of thumb: Task for a computation with an end. GenServer for something that lives. Do not use a Task to hold state."
    ],
    diagram:`   Task.async ──▶ spawn_link + monitor ──▶ compute ──▶ send result back
                                                             │
   Task.await(task, 5_000) ◀─────────────────────────────────┘
        └── raises on timeout or crash (that is what you want)

   SEQUENTIAL                      CONCURRENT
   a = api_a()   300ms             ta = Task.async(&api_a/0)  ┐
   b = api_b()   400ms             tb = Task.async(&api_b/0)  ├ all at once
   c = api_c()   200ms             tc = Task.async(&api_c/0)  ┘
   total = 900ms                   [a,b,c] = Task.await_many([ta,tb,tc])
                                   total = 400ms ✓

   MANY ITEMS — bound the concurrency or you WILL melt something
   items
   |> Task.async_stream(&work/1, max_concurrency: 20, timeout: 5_000,
                        on_timeout: :kill_task, ordered: false)
   |> Enum.reduce(...)        ⇒ [{:ok, r} | {:exit, reason}]

   FIRE AND FORGET, supervised:
   Task.Supervisor.start_child(MyApp.TaskSup, fn -> send_email() end)
   Task.Supervisor.async_nolink(...)   ← caller survives a task crash`,
    takeaway:"Task = one process, one result. async_stream with max_concurrency is the production workhorse."
  },
  code:[
    {title:"Three slow calls, in parallel", note:"", code:`slow = fn name, ms -> fn -> Process.sleep(ms); {name, ms} end end

  [

try do

rescue

Task.Supervisor.start_child(Shop.TaskSupervisor, fn ->

{
  id:37, mod:"6 · Concurrency", title:"Agent — state without ceremony",
  front:"You want the counter from card 33 but do not want to write a receive loop. What is the one-liner?",
  back:"`Agent`. `Agent.start_link(fn -> 0 end)` creates a process holding a value; `Agent.get(pid, & &1)` reads it, `Agent.update(pid, &(&1 + 1))` transforms it. The functions you pass are executed INSIDE the agent's process. It is a GenServer with only state and no behaviour — perfect for simple shared state, wrong the moment you need logic.",
  phil:{
    lead:"Agent is the training-wheels version of the loop you wrote by hand, and knowing its limits tells you when you actually need a GenServer.",
    body:[
      "The key mental model: the anonymous function you pass runs in the agent's process, not yours. That is why it is safe, and also why passing a slow function blocks every other client of that agent. `Agent.get_and_update/2` exists so you can read-and-write atomically in one trip — using separate get then update is a genuine race condition, since another process can interleave between them.",
      "Agent is right for a cache of config values, a counter, a small registry — things where the process is a box and all the logic lives in the caller. It becomes wrong as soon as you want the process itself to do something: react to timers, handle crashes, talk to other processes, enforce invariants. That is a GenServer.",
      "A useful production caveat: any single process is a serialisation point. If a hot code path funnels through one agent, you have built a bottleneck. Card 42 covers what to do about it."
    ],
    diagram:`   Agent.start_link(fn -> %{} end, name: Cache)

   YOUR PROCESS                   AGENT PROCESS
   ────────────                   ─────────────
   Agent.get(Cache, & &1[:k])  ──▶ runs YOUR fun on the state ──▶ value
   Agent.update(Cache, fun)    ──▶ state = fun.(state)
   Agent.get_and_update(C, fun)──▶ {reply, new_state} = fun.(state)  ATOMIC
   Agent.cast(Cache, fun)      ──▶ fire and forget, no reply

   ⚠ RACE — two round trips, another client can interleave:
       n = Agent.get(c, & &1)
       Agent.update(c, fn _ -> n + 1 end)        ✗ lost updates
   ✓ ATOMIC — one trip:
       Agent.get_and_update(c, fn n -> {n, n + 1} end)

   AGENT when the process is just a BOX      (state only)

  id:38, mod:"6 · Concurrency", title:"Naming processes & Registry",
  front:"PIDs change on every restart. How does the rest of your code find a process after its supervisor restarts it?",
  back:"By NAME. `name: __MODULE__` registers a process under an atom, globally on the node — perfect for singletons. For thousands of dynamic processes (one per user, one per game room) you use a **Registry**: `{:via, Registry, {MyReg, key}}` maps arbitrary terms to PIDs, is stored in ETS, is concurrent-read, and cleans itself up automatically when a process dies.",
  phil:{
    lead:"Restarts mean PIDs are ephemeral. Names are the stable address, and the Registry is how you address a million of them.",
    body:[
      "Atom names are the right tool for the handful of singleton processes in an app: your Repo, your PubSub, your rate limiter, a supervisor. Do not use them for dynamic entities — remember card 4, atoms are never garbage collected, so registering one atom per user is a slow memory leak and a security hazard.",
      "Registry solves that properly. Keys can be any term (a user id, a tuple, a string), lookups are lock-free reads from ETS across all cores, and when the process dies its entry vanishes without any cleanup code. `:unique` mode gives you a name lookup; `:duplicate` mode gives you a local pub/sub where many processes register under the same key and you dispatch to all of them.",
      "The `{:via, ...}` tuple is a general OTP convention: anywhere a name is expected, you can pass that tuple and OTP will use the given module to register and resolve. GenServer, Supervisor and DynamicSupervisor all accept it — which is exactly how you get one supervised process per user in card 45."
    ],
    diagram:`   SINGLETONS — an atom name, one per node
   GenServer.start_link(Mod, arg, name: __MODULE__)
   GenServer.call(Mod, :req)          ← no PID needed anywhere ✓
   Process.whereis(Mod)               ← resolve to a PID if you must

   MANY DYNAMIC PROCESSES — a Registry
   {Registry, keys: :unique, name: Shop.Registry}   ← in your supervisor

   def via(user_id), do: {:via, Registry, {Shop.Registry, {:session, user_id}}}
   GenServer.start_link(Session, id, name: via(user_id))
   GenServer.call(via(user_id), :get)

   ┌─ Registry (ETS backed, concurrent, self-cleaning) ─┐
   │  {:session, 1} ─▶ #PID<0.201.0>                    │
   │  {:session, 2} ─▶ #PID<0.202.0>  ✗ dies            │
   │  {:session, 3} ─▶ #PID<0.203.0>     └─ entry auto- │
   └────────────────────────────────────────removed ────┘

   :unique     one pid per key      → addressing
   :duplicate  many pids per key    → local pub/sub, dispatch to all

   ✗ NEVER String.to_atom("user_#{id}") as a process name — leak + DoS`,
    takeaway:"Atoms name singletons. Registry names multitudes, keyed by any term, self-cleaning."
  },
  code:[
    {title:"Named singleton", note:"", code:`{:ok, _} = Agent.start_link(fn -> %{} end, name: Settings)

Agent.update(Settings, &Map.put(&1, :theme, "dark"))
Agent.get(Settings, & &1)
Process.whereis(Settings)
Process.registered() |> Enum.take(10)`},

defmodule Session do
  use Agent

  def visit(user_id), do: Agent.update(via(user_id), &%{&1 | views: &1.views + 1})
  def state(user_id),  do: Agent.get(via(user_id), & &1)
end

Session.start(1)
Session.start(2)
Session.visit(1); Session.visit(1)
Session.state(1)
Registry.lookup(Shop.Registry, {:session, 1})
Registry.count(Shop.Registry)`},

for i <- 1..3 do

{
  id:39, mod:"7 · OTP", title:"GenServer — the loop, industrialised",
  front:"You wrote the receive loop by hand in card 33. What does GenServer add that makes it production-grade?",
  back:"Everything around the loop: a standard client/server split, synchronous calls with timeouts and correct failure propagation, supervisor integration, `:sys` introspection (`:sys.get_state/1`, tracing, statistics), code upgrade hooks, and proper error reports. You implement `init/1` plus `handle_call/3` / `handle_cast/2` / `handle_info/2`; OTP implements the other 90%.",
  phil:{
    lead:"A GenServer is your card-33 loop with thirty years of operational experience wrapped around it.",
    body:[
      "The most valuable habit GenServer teaches is the **client/server split**. The public functions at the top of the module (`Counter.increment/0`) run in the CALLER's process; the `handle_*` callbacks run in the SERVER's process. Keeping them clearly separated in the file, with a comment between, is standard Elixir style and it prevents an entire class of confusion about where code executes.",
      "`init/1` runs inside the new process before `start_link` returns, so a slow init blocks your whole supervision tree at boot. The fix is `{:ok, state, {:continue, :setup}}`: return fast, then do the expensive work in `handle_continue/2` before any other message is processed. That is the correct way to warm a cache or connect to something at startup.",
      "And because it is a behaviour (card 26), your module is just a set of callbacks. The state is threaded through every one of them exactly like the accumulator in a reduce — which is what a GenServer fundamentally is: a reduce over an infinite stream of messages."
    ],
    diagram:`   CLIENT SIDE                     │        SERVER SIDE
   (runs in the CALLER's process)  │  (runs in the GENSERVER process)
   ────────────────────────────────┼───────────────────────────────────
   Counter.increment()             │  init(arg)
     └─ GenServer.cast(pid, :inc) ─┼──▶ handle_cast(:inc, state)
                                   │      └─ {:noreply, new_state}
   Counter.value()                 │
     └─ GenServer.call(pid, :get) ─┼──▶ handle_call(:get, from, state)
        ◀──── reply ───────────────┼──────┘ {:reply, value, state}
                                   │
   send(pid, :tick) ───────────────┼──▶ handle_info(:tick, state)
                                   │  terminate(reason, state)

   RETURN VALUES YOU CAN GIVE BACK
   {:reply, reply, state}          {:noreply, state}
   {:reply, reply, state, timeout} {:noreply, state, {:continue, term}}
   {:stop, reason, reply, state}   {:stop, reason, state}

   SLOW BOOT FIX
   def init(arg), do: {:ok, %{}, {:continue, :load}}    ← returns instantly
   def handle_continue(:load, state), do: {:noreply, expensive(state)}`,
    takeaway:"Client functions run in the caller; callbacks run in the server. init must be fast — use handle_continue."
  },
  code:[
    {title:"The canonical GenServer", note:"Paste the whole thing into iex -S mix.", code:`defmodule Counter do
  use GenServer

  # ============ CLIENT (runs in the caller) ============
  def start_link(initial \\\\ 0) do
    GenServer.start_link(__MODULE__, initial, name: __MODULE__)
  end

  def increment(by \\\\ 1), do: GenServer.cast(__MODULE__, {:inc, by})
  def value,              do: GenServer.call(__MODULE__, :value)
  def reset,              do: GenServer.call(__MODULE__, :reset)
  def stop,               do: GenServer.stop(__MODULE__)

  # ============ SERVER (runs in the GenServer) ==========
  @impl true
  def init(initial), do: {:ok, %{count: initial, history: []}}

  @impl true
  def handle_cast({:inc, by}, state) do
    {:noreply, %{state | count: state.count + by, history: [by | state.history]}}
  end

  @impl true
  def handle_call(:value, _from, state), do: {:reply, state.count, state}
  def handle_call(:reset, _from, state), do: {:reply, :ok, %{state | count: 0}}

  @impl true
  def terminate(reason, state) do
    IO.puts("stopping (#{inspect(reason)}) with count=#{state.count}")
    :ok
  end
end

{:ok, _pid} = Counter.start_link(10)
Counter.increment()
Counter.increment(5)
Counter.value()          # 16
:sys.get_state(Counter)  # peek at the whole state — GenServer gives you this
Counter.reset()
Counter.stop()`},
    {title:"handle_continue for slow startup", note:"Boot fast, warm up after.", code:`defmodule Warm do
  use GenServer

  def start_link(_), do: GenServer.start_link(__MODULE__, :ok, name: __MODULE__)
  def data, do: GenServer.call(__MODULE__, :data)

  @impl true
  def init(:ok) do
    IO.puts("init returns immediately")
    {:ok, %{ready?: false, data: nil}, {:continue, :load}}
  end

  @impl true
  def handle_continue(:load, state) do
    IO.puts("loading expensive data…")
    Process.sleep(1_000)
    {:noreply, %{state | ready?: true, data: %{loaded: true}}}
  end

  @impl true
  def handle_call(:data, _from, state), do: {:reply, state.data, state}
end

{:ok, _} = Warm.start_link(nil)   # returns instantly
Warm.data()                        # blocks until handle_continue is done`},
    {title:"Introspection you get for free", note:"None of this existed in your hand-rolled loop.", code:`{:ok, _} = Counter.start_link(0)
Counter.increment(7)

:sys.get_state(Counter)
:sys.get_status(Counter)
:sys.statistics(Counter, true)
Counter.increment(1)
:sys.statistics(Counter, :get)

# live message tracing:
:sys.trace(Counter, true)
Counter.increment(1)
Counter.value()
:sys.trace(Counter, false)`}
  ]
},
{
  id:40, mod:"7 · OTP", title:"call vs cast — and backpressure",
  front:"`cast` is faster because it does not wait. Why is defaulting to `cast` one of the most common production mistakes in Elixir?",
  back:"Because `cast` has no backpressure. The caller returns instantly regardless of whether the server can keep up, so a fast producer silently grows the server's mailbox until the node runs out of memory. `call` blocks the caller until the server replies, which automatically throttles producers to the speed of the consumer. Default to `call`; use `cast` only when losing the message is genuinely acceptable.",
  phil:{
    lead:"The choice between call and cast is really a choice about who absorbs the pressure when the system is overloaded.",
    body:[
      "With `call`, a slow server makes its callers wait, and those callers make THEIR callers wait, all the way back to the connection that started it. The load naturally applies the brakes. With `cast`, the pressure has nowhere to go except the mailbox, and a mailbox is unbounded. The failure mode is not a slow response, it is a dead node — and it usually happens at 3am under peak load.",
      "The `call` timeout (5000ms by default) is a real timeout with real semantics: when it fires, the CALLER exits, but the server keeps processing the request. That is why long-running work does not belong in `handle_call` — you block the whole server for everyone else while it runs. Instead, reply immediately with `{:noreply, ...}` and use `GenServer.reply/2` from a Task later, or push the work outside the GenServer entirely.",
      "One more thing to know: `handle_call` gives you `from`, a `{pid, ref}` tuple. Holding onto it and replying later is the officially supported way to build asynchronous request handling on top of a synchronous interface."
    ],
    diagram:`   CALL — synchronous, backpressured
   caller ──req+ref──▶ server mailbox ──▶ handle_call ──reply──▶ caller
   caller BLOCKS (default 5000ms)                                  ▲
        └── if the server is slow, the caller waits ──────────────┘
            ⇒ producers throttle themselves    ✓ backpressure

   CAST — asynchronous, NO backpressure
   caller ──msg──▶ mailbox [ ][ ][ ][ ][ ][ ][ ][ ][ ]…∞
   caller returns :ok instantly
        └── producer 10x faster than consumer ⇒ mailbox grows forever
            ⇒ memory climbs ⇒ node dies      ✗ 3am outage

   ┌──────────────────────────────────────────────────────────────┐
   │ USE call   : almost always. reads, writes, anything ordered  │
   │ USE cast   : metrics, fire-and-forget logs, best-effort only │
   │ USE send   : raw messages, timers, monitors                  │
   └──────────────────────────────────────────────────────────────┘

   LONG WORK IN handle_call BLOCKS EVERY OTHER CLIENT:
   def handle_call(:slow, from, state) do
     Task.start(fn -> GenServer.reply(from, expensive()) end)   ← reply later
     {:noreply, state}                                          ← unblock now
   end`,
    takeaway:"call gives you backpressure for free. cast is an unbounded queue waiting to kill your node."
  },
  code:[
    {title:"Watch a cast mailbox explode", note:"Run it and watch message_queue_len climb.", code:`defmodule Slow do
  use GenServer
  def start_link(_), do: GenServer.start_link(__MODULE__, 0, name: __MODULE__)
  def push_cast(n), do: GenServer.cast(__MODULE__, {:work, n})
  def push_call(n), do: GenServer.call(__MODULE__, {:work, n}, 30_000)

  @impl true
  def init(s), do: {:ok, s}
  @impl true
  def handle_cast({:work, _n}, s) do
    Process.sleep(5)
    {:noreply, s + 1}
  end
  @impl true
  def handle_call({:work, _n}, _from, s) do
    Process.sleep(5)
    {:reply, :ok, s + 1}
  end
end

{:ok, pid} = Slow.start_link(nil)

# CAST: returns instantly, queue explodes
{t, _} = :timer.tc(fn -> for i <- 1..2_000, do: Slow.push_cast(i) end)
IO.puts("cast returned in #{div(t,1000)}ms")
Process.info(pid, :message_queue_len)     # thousands queued 😱
Process.sleep(1000)
Process.info(pid, :message_queue_len)     # slowly draining`},
    {title:"call self-throttles", note:"Same work, but the producer is forced to keep pace.", code:`{t2, _} = :timer.tc(fn -> for i <- 1..200, do: Slow.push_call(i) end)
IO.puts("call took #{div(t2,1000)}ms — the producer was throttled ✓")
Process.info(Process.whereis(Slow), :message_queue_len)   # ~0 ✓`},
    {title:"Timeouts and how they fail", note:"Note who dies: the caller, not the server.", code:`defmodule Sleeper do
  use GenServer
  def start_link(_), do: GenServer.start_link(__MODULE__, nil, name: __MODULE__)
  @impl true
  def init(s), do: {:ok, s}
  @impl true
  def handle_call(:slow, _from, s) do
    Process.sleep(2_000)
    {:reply, :done, s}
  end
end

{:ok, _} = Sleeper.start_link(nil)

try do
  GenServer.call(Sleeper, :slow, 300)
catch
  :exit, {:timeout, _} -> :caller_timed_out
end
# the server is STILL working on that request; it is not cancelled`},
    {title:"Reply later — keep the server free", note:"The professional pattern for slow work.", code:`defmodule Async do
  use GenServer
  def start_link(_), do: GenServer.start_link(__MODULE__, %{}, name: __MODULE__)
  def fetch(id), do: GenServer.call(__MODULE__, {:fetch, id}, 10_000)
  def ping, do: GenServer.call(__MODULE__, :ping)

  @impl true
  def init(s), do: {:ok, s}

  @impl true
  def handle_call({:fetch, id}, from, state) do
    Task.start(fn ->
      Process.sleep(1_500)                       # slow I/O
      GenServer.reply(from, {:ok, %{id: id}})    # reply from ANOTHER process
    end)
    {:noreply, state}                            # server is free immediately
  end

  def handle_call(:ping, _from, state), do: {:reply, :pong, state}
end

{:ok, _} = Async.start_link(nil)
spawn(fn -> IO.inspect(Async.fetch(1), label: "slow result") end)
Process.sleep(100)
Async.ping()      # answers instantly even though a fetch is in flight ✓`}
  ]
},
{
  id:41, mod:"7 · OTP", title:"handle_info, timers and periodic work",
  front:"A GenServer needs to refresh a cache every 60 seconds. Which callback receives the tick, and why must you always have a catch-all?",
  back:"`handle_info/2` receives every message that was NOT sent via `call` or `cast` — timers, monitor `:DOWN` notices, socket data, stray messages. Schedule with `Process.send_after(self(), :tick, 60_000)` and reschedule at the end of each tick. You need a catch-all `handle_info(_msg, state)` clause because an unmatched message crashes the GenServer.",
  phil:{
    lead:"handle_info is where a GenServer meets the rest of the world — everything that is not a request from a client.",
    body:[
      "The self-rescheduling timer is the canonical pattern, and it is better than a fixed-interval cron for one important reason: it schedules the NEXT tick after the current work finishes, so a slow refresh cannot cause ticks to pile up in the mailbox. `:timer.send_interval/2` does not have that property. Add a small random jitter when many processes tick, or they will all hit your database in the same millisecond.",
      "The catch-all clause is not optional in production. Late replies from timed-out calls, `:DOWN` messages from monitors you forgot to demonitor, TCP packets, and library messages all arrive here. Without a catch-all your server crashes on the first surprise. Log it at debug level and carry on.",
      "This callback is also where you handle the death of processes you monitor — which is how a supervisor-adjacent GenServer keeps track of workers it did not start itself."
    ],
    diagram:`   WHO SENDS TO handle_info?
   Process.send_after(self(), :tick, 60_000)   your own timers
   {:DOWN, ref, :process, pid, reason}         monitors
   {:EXIT, pid, reason}                        links, if trapping
   {:tcp, socket, data}                        sockets, ports
   late replies from timed-out calls           ← the sneaky one
   anything anyone sends with send/2

   SELF-RESCHEDULING TIMER — the pattern to memorise
   def init(_) do
     schedule()                       ┌──────────────────────────┐
     {:ok, %{}}                       │  work finishes  ──▶ then │
   end                                │  schedule the NEXT tick  │
                                      │  ⇒ ticks can never pile  │
   def handle_info(:tick, state) do   │    up in the mailbox ✓   │
     state = do_work(state)           └──────────────────────────┘
     schedule()
     {:noreply, state}
   end

   defp schedule do
     jitter = :rand.uniform(5_000)     ← spread the herd
     Process.send_after(self(), :tick, 60_000 + jitter)
   end

   ⚠ ALWAYS:  def handle_info(msg, state) do
                Logger.debug("unexpected: #{inspect(msg)}")
                {:noreply, state}
              end`,
    takeaway:"handle_info catches everything else. Reschedule after the work, and always add a catch-all."
  },
  code:[
    {title:"A self-refreshing cache", note:"The timer pattern in full.", code:`defmodule RateCache do
  use GenServer
  require Logger

  @refresh_ms 3_000

  def start_link(_), do: GenServer.start_link(__MODULE__, %{}, name: __MODULE__)
  def rates, do: GenServer.call(__MODULE__, :rates)

  @impl true
  def init(_) do
    send(self(), :refresh)               # refresh immediately at boot
    {:ok, %{rates: %{}, refreshed_at: nil, ticks: 0}}
  end

  @impl true
  def handle_info(:refresh, state) do
    rates = %{"USD" => :rand.uniform(120) / 100, "EUR" => 1.0}
    Logger.info("rates refreshed")
    schedule()
    {:noreply, %{state | rates: rates, refreshed_at: DateTime.utc_now(), ticks: state.ticks + 1}}
  end

  # THE CATCH-ALL — never omit this
  def handle_info(msg, state) do
    Logger.debug("RateCache ignoring #{inspect(msg)}")
    {:noreply, state}
  end

  @impl true
  def handle_call(:rates, _from, state), do: {:reply, state.rates, state}

  defp schedule do
    Process.send_after(self(), :refresh, @refresh_ms + :rand.uniform(500))
  end
end

{:ok, _} = RateCache.start_link(nil)
RateCache.rates()
send(RateCache, :some_random_junk)      # survives ✓
Process.sleep(3_500)
RateCache.rates()
:sys.get_state(RateCache).ticks`},
    {title:"Prove the catch-all matters", note:"Same server without it.", code:`defmodule Fragile do
  use GenServer
  def start_link(_), do: GenServer.start_link(__MODULE__, 0, name: __MODULE__)
  @impl true
  def init(s), do: {:ok, s}
  @impl true
  def handle_info(:tick, s), do: {:noreply, s + 1}
  # no catch-all!
end

{:ok, pid} = Fragile.start_link(nil)
send(pid, :tick)
Process.alive?(pid)      # true
send(pid, :anything_else)
Process.sleep(50)
Process.alive?(pid)      # false 💥 FunctionClauseError`},
    {title:"Monitoring other processes", note:"handle_info is where DOWN messages land.", code:`defmodule Watcher do
  use GenServer
  def start_link(_), do: GenServer.start_link(__MODULE__, %{}, name: __MODULE__)
  def watch(pid), do: GenServer.call(__MODULE__, {:watch, pid})
  def deaths, do: GenServer.call(__MODULE__, :deaths)

  @impl true
  def init(_), do: {:ok, %{refs: %{}, deaths: []}}

  @impl true
  def handle_call({:watch, pid}, _from, state) do
    ref = Process.monitor(pid)
    {:reply, :ok, put_in(state.refs[ref], pid)}
  end
  def handle_call(:deaths, _from, state), do: {:reply, state.deaths, state}

  @impl true
  def handle_info({:DOWN, ref, :process, pid, reason}, state) do
    {_pid, refs} = Map.pop(state.refs, ref)
    {:noreply, %{state | refs: refs, deaths: [{pid, reason} | state.deaths]}}
  end
  def handle_info(_other, state), do: {:noreply, state}
end

{:ok, _} = Watcher.start_link(nil)
victim = spawn(fn -> Process.sleep(300) end)
Watcher.watch(victim)
Process.sleep(500)
Watcher.deaths()`},
    {title:"Idle timeouts and hibernation", note:"Two ways to keep idle servers cheap.", code:`defmodule Idle do
  use GenServer
  def start_link(_), do: GenServer.start_link(__MODULE__, nil)
  @impl true
  def init(s), do: {:ok, s, 2_000}          # :timeout after 2s of silence
  @impl true
  def handle_info(:timeout, s) do
    IO.puts("idle for 2s — shutting down to free memory")
    {:stop, :normal, s}
  end
  def handle_info(_, s), do: {:noreply, s, 2_000}
end

{:ok, p} = Idle.start_link(nil)
Process.sleep(2_500)
Process.alive?(p)     # false — it stopped itself

# :hibernate compacts the heap of a long-idle process:
# {:noreply, state, :hibernate}`}
  ]

{
  id:42, mod:"7 · OTP", title:"Designing state (and avoiding bottlenecks)",
  front:"Your GenServer holds a cache used on every request, and at 5k req/s the whole app slows down. What went wrong, and what are the three fixes?",
  back:"You built a single-process bottleneck: every request serialises through one mailbox. Fixes, in order of preference: (1) move read-heavy state into **ETS** so reads bypass the process entirely; (2) **shard** into N processes keyed by a hash; (3) give each entity its own process (one per user/room) via a Registry. A GenServer should own a decision, not a hot data path.",
  phil:{
    lead:"The same serialisation that gives you lock-free correctness makes a single process a throughput ceiling. Good OTP design is about where you put that ceiling.",
    body:[
      "Think in terms of what the process is FOR. A GenServer is excellent at owning a decision that must be made one at a time: allocating a seat, enforcing a rate limit, sequencing writes to an external system. It is bad at being a shared read cache, because reads have no reason to be serialised at all.",
      "That is why ETS exists (card 47): a table any process can read concurrently, at full core count, with no message passing. The classic pattern is a GenServer that OWNS an ETS table and performs all writes, while readers hit the table directly. You keep single-writer correctness and get parallel reads.",
      "Sharding is the next tool: `:erlang.phash2(key, 8)` picks one of eight identical GenServers, cutting contention by eight. And for entity-shaped state, one process per entity is the most Elixir-native answer — a million user sessions are a million tiny independent servers, each with a mailbox that is almost always empty.",
      "Finally, keep the state small and shaped as a map or struct, never a list you scan. A GenServer holding a 100k-element list that it filters on every call is slow for reasons that have nothing to do with concurrency."
    ],
    diagram:`   THE BOTTLENECK                    THE FIXES
   ──────────────                    ─────────
   5000 req/s                        1. ETS for reads  ★ best for caches
       │  all funnel here               readers ──▶ :ets.lookup (parallel)
       ▼                                writer  ──▶ GenServer (serialised)
   ┌───────────┐
   │ GenServer │ mailbox ████████     2. SHARD by key
   │  1 core   │ growing                 hash(key) → one of 8 servers
   └───────────┘                         8x the throughput, same code

   throughput ceiling = 1 process    3. PROCESS PER ENTITY
                                        user 1 ─▶ #PID<..201>
                                        user 2 ─▶ #PID<..202>   via Registry
                                        each mailbox nearly empty ✓

   WHEN A SINGLE GENSERVER IS RIGHT
   ✓ it owns a DECISION that must be serialised (allocate, sequence, limit)
   ✓ it owns a connection or resource that is single-use
   ✗ it is on the read path of every request
   ✗ it holds a big collection it scans on each call

   STATE SHAPE:  %State{} struct or map with indexed access
                 ✗ lists you Enum.find on every call`,
    takeaway:"A process serialises. Put ETS or sharding or per-entity processes where you need parallelism."
  },
  code:[
    {title:"Measure the bottleneck", note:"One server, many clients.", code:`defmodule HotCache do
  use GenServer
  def start_link(_), do: GenServer.start_link(__MODULE__, %{}, name: __MODULE__)
  def get(k), do: GenServer.call(__MODULE__, {:get, k})
  def put(k, v), do: GenServer.call(__MODULE__, {:put, k, v})
  @impl true
  def init(s), do: {:ok, s}
  @impl true
  def handle_call({:get, k}, _f, s), do: {:reply, Map.get(s, k), s}
  def handle_call({:put, k, v}, _f, s), do: {:reply, :ok, Map.put(s, k, v)}
end

{:ok, _} = HotCache.start_link(nil)
HotCache.put(:k, :v)

{t, _} = :timer.tc(fn ->
  1..50_000
  |> Task.async_stream(fn _ -> HotCache.get(:k) end, max_concurrency: 50)
  |> Stream.run()
end)
IO.puts("50k serialised reads: #{div(t, 1000)} ms")`},
    {title:"Fix 1 — GenServer owns ETS, readers bypass it", note:"Usually a 10-50x improvement on reads.", code:`defmodule FastCache do
  use GenServer
  @table :fast_cache

  def start_link(_), do: GenServer.start_link(__MODULE__, nil, name: __MODULE__)

  # READ: no message passing at all, runs in the CALLER, fully parallel
  def get(k) do
    case :ets.lookup(@table, k) do
      [{^k, v}] -> v
      [] -> nil
    end
  end

  # WRITE: goes through the owner process, so writes stay serialised
  def put(k, v), do: GenServer.call(__MODULE__, {:put, k, v})

  @impl true
  def init(_) do
    :ets.new(@table, [:named_table, :set, :protected, read_concurrency: true])
    {:ok, %{}}
  end

  @impl true
  def handle_call({:put, k, v}, _from, s) do
    :ets.insert(@table, {k, v})
    {:reply, :ok, s}
  end
end

{:ok, _} = FastCache.start_link(nil)
FastCache.put(:k, :v)

{t2, _} = :timer.tc(fn ->
  1..50_000
  |> Task.async_stream(fn _ -> FastCache.get(:k) end, max_concurrency: 50)
  |> Stream.run()
end)
IO.puts("50k parallel reads: #{div(t2, 1000)} ms  ✓")`},
    {title:"Fix 2 — shard by key", note:"Same API, N processes behind it.", code:`defmodule Sharded do
  @shards 8

  def child_specs do
    for i <- 0..(@shards - 1) do
      Supervisor.child_spec({Agent, fn -> %{} end}, id: {__MODULE__, i})
    end
  end

  def start_all do
    for i <- 0..(@shards - 1) do
      {:ok, pid} = Agent.start_link(fn -> %{} end, name: name(i))
      pid
    end
  end

  defp name(i), do: :"sharded_#{i}"
  defp shard_for(key), do: name(:erlang.phash2(key, @shards))

  def put(k, v), do: Agent.update(shard_for(k), &Map.put(&1, k, v))
  def get(k),    do: Agent.get(shard_for(k), &Map.get(&1, k))
end

Sharded.start_all()
for i <- 1..100, do: Sharded.put("key#{i}", i)
Sharded.get("key42")
:erlang.phash2("key42", 8)     # which shard it landed in`},

fast_state = Map.new(slow_state, &{&1.id, &1})

{t1, _} = :timer.tc(fn -> Enum.find(slow_state, &(&1.id == 99_999)) end)
{t2, _} = :timer.tc(fn -> Map.get(fast_state, 99_999) end)
{t1, t2}    # list scan vs map lookup`}
  ]
