{
  id:43, mod:"7 · OTP", title:"Supervisor & restart strategies",
  front:"A worker crashes. Which of its siblings should be restarted with it — and how do you tell the supervisor?",
  back:"The **strategy**. `:one_for_one` restarts only the dead child (the default, and right when children are independent). `:one_for_all` restarts all of them (when they share state and must be consistent). `:rest_for_one` restarts the dead child and everything started AFTER it (when later children depend on earlier ones). Plus `max_restarts`/`max_seconds`: exceed them and the supervisor gives up and escalates to ITS supervisor.",
  phil:{
    lead:"A supervisor is a process whose only job is to start children, watch them via links, and restart them according to a declared policy.",
    body:[
      "The escalation rule is the part people miss and it is the heart of the design. A supervisor that cannot fix the problem by restarting — because the child keeps dying, exceeding `max_restarts` within `max_seconds` — kills its remaining children and dies itself. Its own supervisor then sees a dead child and applies its policy, restarting a larger subsystem. Failure escalates up the tree until some level of restart is big enough to actually clear the problem, and in the worst case the whole application restarts. That is a designed, bounded response to unknown failure.",
      "Choosing a strategy is domain modelling. Ask: if this child dies, is any sibling now holding stale references or inconsistent state? If yes, they must restart too. A connection pool and the process caching its handles are `:one_for_all`. Independent request handlers are `:one_for_one`.",
      "Restart *type* is the other dial: `:permanent` (always restart — the default), `:transient` (restart only on abnormal exit — right for jobs that can legitimately finish), `:temporary` (never restart — right for one-off tasks)."
    ],
    diagram:`             ┌──────────────┐  max_restarts: 3, max_seconds: 5
             │  Supervisor  │  exceeded ⇒ supervisor dies too ⇒ escalates
             └──────┬───────┘
        ┌───────────┼───────────┐
        ▼           ▼           ▼
     ┌─────┐     ┌─────┐     ┌─────┐
     │  A  │     │  B  │ ✗   │  C  │
     └─────┘     └─────┘     └─────┘

   :one_for_one     A ok        B ↻       C ok      independent children
   :one_for_all     A ↻         B ↻       C ↻       shared state
   :rest_for_one    A ok        B ↻       C ↻       C depends on B

   ESCALATION — how the BEAM handles the unknown
   Application Supervisor           still broken? restart the whole app
        └─ Subsystem Supervisor     still broken? restart the subsystem
             └─ Worker Supervisor   still broken? restart the group
                  └─ Worker ✗       first line: restart just this one

   RESTART TYPES
   :permanent  always restart          (default; long-lived servers)
   :transient  restart only if abnormal (jobs that may finish normally)
   :temporary  never restart            (fire-and-forget tasks)

   SHUTDOWN
   shutdown: 5_000   ask nicely (terminate/2 runs), then brutal kill
   shutdown: :brutal_kill | :infinity (for supervisors)`,
    takeaway:"Strategy = which siblings share fate. Exceeding restart limits escalates failure up the tree."
  },
  code:[
    {title:"A supervisor with three children", note:"Paste, then kill children and watch.", code:`defmodule Worker do
  use GenServer
  def start_link(name), do: GenServer.start_link(__MODULE__, name, name: name)
  @impl true
  def init(name) do
    IO.puts("  [start] #{name} as #{inspect(self())}")
    {:ok, %{name: name, started_at: System.monotonic_time(:millisecond)}}
  end
  @impl true
  def handle_call(:boom, _f, s), do: raise("#{s.name} exploded")
  def handle_call(:info, _f, s), do: {:reply, s, s}
end

defmodule Tree do
  use Supervisor
  def start_link(strategy), do: Supervisor.start_link(__MODULE__, strategy, name: __MODULE__)

  @impl true
  def init(strategy) do
    children = [
      Supervisor.child_spec({Worker, :alpha}, id: :alpha),
      Supervisor.child_spec({Worker, :beta},  id: :beta),
      Supervisor.child_spec({Worker, :gamma}, id: :gamma)
    ]
    Supervisor.init(children, strategy: strategy, max_restarts: 3, max_seconds: 5)
  end
end

{:ok, _} = Tree.start_link(:one_for_one)
Supervisor.which_children(Tree)`},
    {title:"Kill one and compare strategies", note:"Restart Tree with a different strategy and repeat.", code:`# with :one_for_one — only beta restarts
try do GenServer.call(:beta, :boom) catch :exit, _ -> :crashed end
Process.sleep(100)
Supervisor.which_children(Tree)     # only beta has a new PID

Supervisor.stop(Tree)
{:ok, _} = Tree.start_link(:one_for_all)
try do GenServer.call(:beta, :boom) catch :exit, _ -> :crashed end
Process.sleep(100)
Supervisor.which_children(Tree)     # ALL three have new PIDs

Supervisor.stop(Tree)
{:ok, _} = Tree.start_link(:rest_for_one)
try do GenServer.call(:beta, :boom) catch :exit, _ -> :crashed end
Process.sleep(100)
Supervisor.which_children(Tree)     # beta and gamma restarted, alpha kept`},
    {title:"Watch escalation happen", note:"Crash faster than max_restarts allows.", code:`{:ok, sup} = Tree.start_link(:one_for_one)

for _ <- 1..5 do
  try do GenServer.call(:beta, :boom) catch :exit, _ -> :crashed end
  Process.sleep(50)
end
Process.sleep(200)
Process.alive?(sup)
# false — max_restarts exceeded, the supervisor gave up and died.
# In a real app its OWN supervisor would now restart this whole subtree.`},
    {title:"Restart types in practice", note:"", code:`defmodule Finisher do
  use GenServer, restart: :transient        # ← declared here
  def start_link(_), do: GenServer.start_link(__MODULE__, nil)
  @impl true
  def init(_), do: {:ok, nil, 500}
  @impl true
  def handle_info(:timeout, s), do: {:stop, :normal, s}   # a normal finish
end

{:ok, sup} = Supervisor.start_link([Finisher], strategy: :one_for_one)
Process.sleep(800)
Supervisor.which_children(sup)   # :undefined — normal exit, not restarted ✓
Supervisor.stop(sup)`}
  ]
},
{
  id:44, mod:"7 · OTP", title:"child_spec and designing the tree",
  front:"You put `{MyWorker, arg}` in a children list. How does the supervisor know how to start it, and how do you run two copies?",
  back:"`use GenServer` injects a `child_spec/1` function returning `%{id: MyWorker, start: {MyWorker, :start_link, [arg]}, restart: :permanent, shutdown: 5000, type: :worker}`. The tuple is shorthand for calling it. Two copies need two distinct `:id`s — use `Supervisor.child_spec({MyWorker, arg}, id: :one)` to override. Children start in list ORDER and shut down in reverse.",
  phil:{
    lead:"The children list is a declaration of your application's dependency order and its failure domains. Read someone's application.ex and you know their architecture.",
    body:[
      "Order is a real contract: a supervisor starts children left to right and waits for each `start_link` to return before starting the next. So the Repo goes before anything that queries it, the Registry before the processes that register in it, the Endpoint last because it should only accept traffic once everything it needs is up. Shutdown runs in reverse for the same reason.",
      "Shaping the tree is the actual design work. Group processes that share a failure domain under their own supervisor, so a crash there restarts a coherent subsystem instead of the whole app. Give risky work (parsing untrusted input, calling flaky third parties) its own supervised process so it can crash freely. Keep durable or expensive-to-rebuild state near the top of the tree where it is restarted rarely, and volatile state at the leaves.",
      "The `shutdown` value matters at deploy time: it is how long the supervisor waits for `terminate/2` to finish before killing the child. Set it generously for processes that must flush buffers or finish in-flight requests, and remember that `terminate/2` is not guaranteed to run on brutal kills — never rely on it for correctness, only for tidiness."
    ],
    diagram:`   children = [
     Shop.Repo,                    ← 1st: database pool
     {Registry, keys: :unique, name: Shop.Registry},
     {Phoenix.PubSub, name: Shop.PubSub},
     Shop.RateLimiter,             ← depends on nothing above? still ordered
     {Task.Supervisor, name: Shop.TaskSup},
     Shop.SessionSupervisor,       ← subsystem with its own strategy
     ShopWeb.Endpoint              ← LAST: only take traffic when ready
   ]                                  shutdown happens in REVERSE ▲

   {MyWorker, arg}   is sugar for   MyWorker.child_spec(arg)  ⇒
   %{id: MyWorker, start: {MyWorker, :start_link, [arg]},
     restart: :permanent, shutdown: 5_000, type: :worker}

   TWO COPIES need distinct ids:
   Supervisor.child_spec({Worker, :a}, id: :worker_a)
   Supervisor.child_spec({Worker, :b}, id: :worker_b)

   ┌── SHAPING FAILURE DOMAINS ───────────────────────────────────┐
   │  App Supervisor  :one_for_one                                │
   │    ├── Repo               ← expensive, restart rarely (top)  │
   │    ├── CacheSupervisor    :one_for_all  (table + writer)     │
   │    ├── JobSupervisor      :one_for_one  (independent jobs)   │
   │    └── SessionSup (Dynamic) ← volatile, crashes often (leaf) │
   └──────────────────────────────────────────────────────────────┘`,
    takeaway:"child_spec describes how to start, id, restart and shutdown. Order encodes dependencies; subtrees encode failure domains."
  },
  code:[
    {title:"Look at a real child_spec", note:"", code:`defmodule Worker do
  use GenServer
  def start_link(arg), do: GenServer.start_link(__MODULE__, arg)
  @impl true
  def init(a), do: {:ok, a}
end

Worker.child_spec(:hello)
Agent.child_spec(fn -> 0 end)
Task.child_spec(fn -> :ok end)`},
    {title:"Two copies of the same worker", note:"The id collision error is worth seeing once.", code:`# this FAILS — duplicate child id:
# Supervisor.start_link([{Worker, :a}, {Worker, :b}], strategy: :one_for_one)

{:ok, sup} =
  Supervisor.start_link(
    [
      Supervisor.child_spec({Worker, :a}, id: :worker_a),
      Supervisor.child_spec({Worker, :b}, id: :worker_b, restart: :transient)
    ],
    strategy: :one_for_one
  )

Supervisor.which_children(sup)
Supervisor.count_children(sup)`},
    {title:"Override child_spec yourself", note:"When the injected default is not what you want.", code:`defmodule Flusher do
  use GenServer

  def child_spec(opts) do
    %{
      id: Keyword.get(opts, :id, __MODULE__),
      start: {__MODULE__, :start_link, [opts]},
      restart: :permanent,
      shutdown: 30_000,          # give terminate/2 30s to flush
      type: :worker
    }
  end

  def start_link(opts), do: GenServer.start_link(__MODULE__, opts)

  @impl true
  def init(opts) do
    Process.flag(:trap_exit, true)     # needed for terminate/2 to run
    {:ok, %{buffer: [], opts: opts}}
  end

  @impl true
  def terminate(reason, state) do
    IO.puts("flushing #{length(state.buffer)} items before exit (#{inspect(reason)})")
    :ok
  end
end

{:ok, sup} = Supervisor.start_link([{Flusher, []}], strategy: :one_for_one)
Supervisor.stop(sup)      # watch terminate/2 run`},
    {title:"Nested supervisors = failure domains", note:"A subsystem that restarts as a unit.", code:`defmodule CacheSup do
  use Supervisor
  def start_link(_), do: Supervisor.start_link(__MODULE__, nil, name: __MODULE__)

  @impl true

    children = [
      Supervisor.child_spec({Agent, fn -> %{} end}, id: :cache_table),
      Supervisor.child_spec({Agent, fn -> 0 end},   id: :cache_stats)
    ]
    # these two must stay consistent, so they live and die together
    Supervisor.init(children, strategy: :one_for_all)
  end
end

  @impl true

    children = [
      {Registry, keys: :unique, name: Demo.Registry},
      CacheSup,
      {Task.Supervisor, name: Demo.TaskSup}
    ]
    Supervisor.init(children, strategy: :one_for_one)
  end
end

{:ok, _} = AppSup.start_link(nil)
Supervisor.which_children(AppSup)
Supervisor.which_children(CacheSup)`}
  ]
},
{
  id:45, mod:"7 · OTP", title:"DynamicSupervisor — a process per entity",
  front:"Chat rooms are created at runtime by users. A Supervisor needs its children listed up front. What supervises processes you cannot know in advance?",
  back:"`DynamicSupervisor`. You start it empty with `strategy: :one_for_one` and add children at runtime via `DynamicSupervisor.start_child/2`. Combined with a Registry for naming (card 38), this is THE pattern for one supervised process per user, per room, per game, per connection — the shape most real Elixir services are built on.",
  phil:{
    lead:"This is where the BEAM's cheap processes turn into an architecture: model each live entity in your domain as its own supervised process.",
    body:[
      "Think about what that buys you. Each chat room has its own state with no locking. Each room crashes independently, taking down exactly one room. Each room can hold in-memory state that would be absurd to round-trip to Postgres on every message. And a million rooms cost you a few gigabytes and no design complexity at all — the same code that runs one runs a million.",
      "The standard trio is DynamicSupervisor + Registry + a `start_or_find` helper. The helper tries to start the child and gracefully handles `{:error, {:already_started, pid}}`, so any caller can lazily materialise the entity without coordination. Add `Process.send_after` idle timeouts so rooms that go quiet shut themselves down, and you have automatic memory management for your entire domain.",
      "One caution: these processes are volatile by design. Anything that must survive a crash belongs in Postgres or ETS; the process holds the hot working set and rebuilds it from the database in `init` (or better, in `handle_continue`)."
    ],
    diagram:`   ┌────────────────────────┐  started empty, children added at runtime
   │  DynamicSupervisor     │  strategy: :one_for_one (the only option)
   └───────────┬────────────┘  max_children: :infinity | n
     ┌─────────┼─────────┬───────────── … a million of these
     ▼         ▼         ▼
  ┌──────┐ ┌──────┐ ┌──────┐
  │room 1│ │room 2│ │room 3│  each: own state, own mailbox, own crash
  └──────┘ └──────┘ └──────┘

   THE STANDARD TRIO
   Registry           ─▶ name lookup by any term  {:via, Registry, {R, id}}
   DynamicSupervisor  ─▶ lifecycle + restarts
   start_or_find/1    ─▶ lazily materialise on first use

   def start_or_find(id) do
     case DynamicSupervisor.start_child(Sup, {Room, id}) do
       {:ok, pid} -> pid
       {:error, {:already_started, pid}} -> pid       ← the key line
     end
   end

   IDLE SHUTDOWN keeps memory honest:
   init → {:ok, state, @idle_ms}  |  handle_info(:timeout, s) → {:stop,…}

   ⚠ process state is VOLATILE. Durable data lives in Postgres/ETS;
     the process rebuilds its working set in init/handle_continue.`,
    takeaway:"DynamicSupervisor + Registry = one supervised, addressable process per live entity."
  },
  code:[
    {title:"Chat rooms, the full pattern", note:"This is production-shaped code. Paste it all.", code:`defmodule Room do
  use GenServer, restart: :transient

  @idle_ms 30_000

  def via(id), do: {:via, Registry, {Chat.Registry, {:room, id}}}

  def start_link(id), do: GenServer.start_link(__MODULE__, id, name: via(id))

  def post(id, user, text), do: GenServer.call(via(id), {:post, user, text})
  def history(id),          do: GenServer.call(via(id), :history)

  @impl true
  def init(id) do
    IO.puts("room #{id} starting in #{inspect(self())}")
    {:ok, %{id: id, messages: []}, @idle_ms}
  end

  @impl true
  def handle_call({:post, user, text}, _from, state) do
    msg = %{user: user, text: text, at: System.system_time(:second)}
    {:reply, :ok, %{state | messages: [msg | state.messages]}, @idle_ms}
  end

  def handle_call(:history, _from, state),
    do: {:reply, Enum.reverse(state.messages), state, @idle_ms}

  @impl true
  def handle_info(:timeout, state) do
    IO.puts("room #{state.id} idle — shutting down")
    {:stop, :normal, state}
  end
  def handle_info(_msg, state), do: {:noreply, state, @idle_ms}
end

defmodule Chat do
  def child_specs do
    [
      {Registry, keys: :unique, name: Chat.Registry},
      {DynamicSupervisor, name: Chat.RoomSupervisor, strategy: :one_for_one}
    ]
  end

  def open(id) do
    case DynamicSupervisor.start_child(Chat.RoomSupervisor, {Room, id}) do
      {:ok, pid} -> {:ok, pid}
      {:error, {:already_started, pid}} -> {:ok, pid}
      other -> other
    end
  end

  def rooms do
    DynamicSupervisor.which_children(Chat.RoomSupervisor) |> length()
  end
end

{:ok, _} = Supervisor.start_link(Chat.child_specs(), strategy: :one_for_one)`},
    {title:"Use it", note:"", code:`Chat.open("elixir")
Chat.open("elixir")            # idempotent — same pid
Room.post("elixir", "ada", "hello everyone")
Room.post("elixir", "grace", "hi ada")
Room.history("elixir")

Chat.open("erlang")
Chat.rooms()
Registry.count(Chat.Registry)`},
    {title:"Independent failure", note:"Crash one room; every other room is untouched.", code:`Chat.open("a"); Chat.open("b"); Chat.open("c")
Room.post("a", "u", "keep me")
Room.post("b", "u", "I will die")

[{b_pid, _}] = Registry.lookup(Chat.Registry, {:room, "b"})
Process.exit(b_pid, :kill)
Process.sleep(100)

Room.history("a")               # still there ✓
Registry.lookup(Chat.Registry, {:room, "b"})   # [] — gone, not restarted
Chat.open("b")                  # trivially recreated
Room.history("b")               # [] — state was volatile, as designed`},
    {title:"Scale check", note:"Ten thousand supervised entities.", code:`{t, _} = :timer.tc(fn ->
  for i <- 1..10_000, do: Chat.open("room_#{i}")
end)

IO.puts("10k supervised rooms in #{div(t, 1000)} ms")
Chat.rooms()
:erlang.memory(:processes) |> div(1024 * 1024)   # MB used by all processes`}
  ]
},
{
  id:46, mod:"7 · OTP", title:"Application — the root of the tree",
  front:"Where does the very first process come from, and what does `mix.exs`'s `mod:` key actually do?",
  back:"`mod: {Shop.Application, []}` tells the BEAM to call `Shop.Application.start/2` when the application boots. That callback returns `Supervisor.start_link(children, strategy: :one_for_one)` — the ROOT supervisor. Everything else in your service hangs off it. Applications also declare dependencies, so starting yours starts Ecto, Logger, Phoenix and the rest in the right order.",
  phil:{
    lead:"An OTP application is a unit of start-up, shutdown and dependency — and your whole service is one node running a set of them.",
    body:[
      "This is the top of everything you have learned. Processes hold state, supervisors restart them, and the Application is the single supervisor that owns them all. When the BEAM boots a release it starts each application in dependency order, and `Application.start/2` builds your tree. When you deploy, `stop/1` and the reverse shutdown order let things drain cleanly.",
      "Reading `application.ex` should be the first thing you do in an unfamiliar Elixir codebase: it lists every long-running thing in the system, in dependency order. Writing a good one is likewise the first thing you do in a new service.",
      "Two practical hooks live here. `Application.get_env/3` reads the config from card 28. And `config_change/3` lets a hot-upgraded release react to new config, which is niche but explains why the callback exists."
    ],
    diagram:`   mix.exs        def application, do: [mod: {Shop.Application, []}, …]
                                             │
                                             ▼
   lib/shop/application.ex   def start(_type, _args) do
                               children = [ … ]
                               Supervisor.start_link(children,
                                 strategy: :one_for_one, name: Shop.Supervisor)
                             end
                                             │
   ┌─────────────────────────────────────────▼──────────────────────────┐
   │                       Shop.Supervisor  (ROOT)                      │
   │   ┌──────────┬────────────┬──────────────┬────────────┬─────────┐  │
   │   ▼          ▼            ▼              ▼            ▼         ▼  │
   │ Telemetry  Shop.Repo   PubSub      Registry   DynamicSup   Endpoint│
   │            (pg pool)                              │                │
   │                                            ┌──────┴──────┐         │
   │                                          room1        room2 …      │
   └────────────────────────────────────────────────────────────────────┘

   BOOT ORDER: dependency apps first (logger, ecto, phoenix), then yours,
   then your children left→right.  SHUTDOWN: exactly the reverse.

   Application.started_applications()      what is running
   Application.ensure_all_started(:shop)   start it and its deps

  code:[
    {title:"A realistic application.ex", note:"lib/shop/application.ex — this is your service, declared.", code:`defmodule Shop.Application do
  @moduledoc false
  use Application

  @impl true
  def start(_type, _args) do
    children = [
      # 1. observability first, so everything after is measured
      Shop.Telemetry,

      # 2. the database pool — nothing that queries can start before it
      Shop.Repo,

      # 3. process-addressing infrastructure
      {Registry, keys: :unique, name: Shop.Registry},
      {Phoenix.PubSub, name: Shop.PubSub},

      # 4. background machinery
      {Task.Supervisor, name: Shop.TaskSupervisor},
      {DynamicSupervisor, name: Shop.SessionSupervisor, strategy: :one_for_one},
      Shop.RateLimiter,

      # 5. accept traffic LAST
      ShopWeb.Endpoint
    ]

    opts = [strategy: :one_for_one, name: Shop.Supervisor]
    Supervisor.start_link(children, opts)
  end

  # called on hot config change in a release
  @impl true
  def config_change(changed, _new, removed) do
    ShopWeb.Endpoint.config_change(changed, removed)
    :ok
  end
end`},

{
  id:47, mod:"7 · OTP", title:"ETS — shared memory, done safely",
  front:"Card 42 said to move read-heavy state out of a GenServer. Where to, given that processes share nothing?",
  back:"**ETS** (Erlang Term Storage): in-memory tables owned by a process but readable by any process directly, with no message passing. Reads are concurrent across all cores. Tables are typed (`:set`, `:ordered_set`, `:bag`) and access-controlled (`:private`, `:protected`, `:public`). The table dies with its owner — which is why the owner is normally a supervised GenServer.",
  phil:{
    lead:"ETS is the one place the BEAM offers genuinely shared memory, and it is safe because every operation on it is atomic and isolated.",
    body:[
      "There is no locking API because you never need one for a single operation: `:ets.insert/2`, `:ets.lookup/2`, `:ets.update_counter/3` are each atomic. Multi-step read-modify-write is NOT atomic, and that is exactly where you route the write through the owning GenServer, or use `update_counter` which does it atomically for you.",
      "The performance model is what makes it worth learning. `read_concurrency: true` lets many cores read at full speed. `write_concurrency: true` splits internal locks for parallel writes to different keys. A lookup is roughly 1 microsecond, which is why every serious Elixir cache, rate limiter, session store and Registry is ETS underneath.",
      "The ownership rule bites people once: if the process that created the table dies, the table is destroyed. Create tables in a supervised GenServer's `init` so a restart recreates them, or use `heir` to hand ownership to another process on death. And remember ETS data is not garbage collected per-key — you must expire entries yourself, usually with a periodic `handle_info` sweep (card 41)."
    ],
    diagram:`   ┌──────────────────────────────────────────────────────────┐
   │              ETS table :cache  (in the VM, not a process) │
   │   {"user:1", %{…}}   {"user:2", %{…}}   {"rate:ip", 42}   │
   └──▲───────────▲───────────▲──────────────────▲─────────────┘
      │           │           │                  │
   reader1     reader2     reader3          owner GenServer
   (parallel, lock-free, ~1µs)              writes + creates the table
                                            ⚠ table dies with the owner

   TYPES                         ACCESS
   :set          unique keys     :private    owner only
   :ordered_set  sorted keys     :protected  owner writes, all read ★
   :bag          many per key    :public     anyone writes
   :duplicate_bag  dup entries

   OPTIONS THAT MATTER
   read_concurrency: true    many parallel readers  (caches)
   write_concurrency: true   parallel writes to different keys (counters)
   :named_table              address it by atom instead of a tid

   ATOMIC:      insert/2  lookup/2  delete/2  update_counter/3
   NOT ATOMIC:  lookup then insert   ← route through the owner GenServer

   ✗ ETS does not expire anything for you — sweep it yourself.
   ✗ ETS is per-node — it is NOT a distributed cache.`,
    takeaway:"ETS = shared, atomic, concurrent in-memory tables. Owner writes, everyone reads, you handle expiry."
  },
  code:[
    {title:"First contact", note:"", code:`table = :ets.new(:demo, [:set, :public])
:ets.insert(table, {"a", 1})
:ets.insert(table, {"b", %{name: "Ada"}})
:ets.lookup(table, "a")          # [{"a", 1}]
:ets.lookup(table, "zzz")        # []
:ets.tab2list(table)
:ets.info(table, :size)
:ets.delete(table, "a")
:ets.delete(table)               # destroy the whole table`},
    {title:"A supervised cache with TTL", note:"Owner GenServer + periodic sweep. Real, usable code.", code:`defmodule TTLCache do
  use GenServer
  @table :ttl_cache
  @sweep_ms 5_000

  # --- client: reads bypass the process entirely ---
  def start_link(_), do: GenServer.start_link(__MODULE__, nil, name: __MODULE__)

  def put(key, value, ttl_ms \\\\ 60_000) do
    expires = System.monotonic_time(:millisecond) + ttl_ms
    :ets.insert(@table, {key, value, expires})
    :ok
  end

  def get(key) do
    now = System.monotonic_time(:millisecond)
    case :ets.lookup(@table, key) do
      [{^key, value, expires}] when expires > now -> {:ok, value}
      [{^key, _v, _expired}] -> :ets.delete(@table, key); :miss
      [] -> :miss
    end
  end

  def fetch(key, ttl_ms, fun) do
    case get(key) do
      {:ok, v} -> v
      :miss -> v = fun.(); put(key, v, ttl_ms); v
    end
  end

  def size, do: :ets.info(@table, :size)

  # --- server: owns the table and sweeps it ---
  @impl true
  def init(_) do
    :ets.new(@table, [:named_table, :set, :public,
                      read_concurrency: true, write_concurrency: true])
    Process.send_after(self(), :sweep, @sweep_ms)
    {:ok, %{sweeps: 0}}
  end

  @impl true
  def handle_info(:sweep, state) do
    now = System.monotonic_time(:millisecond)
    # match spec: delete every row whose expiry is in the past
    deleted = :ets.select_delete(@table, [{{:_, :_, :"$1"}, [{:<, :"$1", now}], [true]}])
    if deleted > 0, do: IO.puts("swept #{deleted} expired keys")
    Process.send_after(self(), :sweep, @sweep_ms)
    {:noreply, %{state | sweeps: state.sweeps + 1}}
  end
  def handle_info(_, state), do: {:noreply, state}
end

{:ok, _} = TTLCache.start_link(nil)
TTLCache.put("user:1", %{name: "Ada"}, 2_000)
TTLCache.get("user:1")
TTLCache.fetch("slow", 10_000, fn -> Process.sleep(300); :computed end)
TTLCache.fetch("slow", 10_000, fn -> :never_runs end)
Process.sleep(2_500)
TTLCache.get("user:1")      # :miss ✓`},
    {title:"Atomic counters — a rate limiter core", note:"update_counter is atomic; no GenServer needed at all.", code:`:ets.new(:rate, [:named_table, :public, write_concurrency: true])

defmodule Limiter do
  @max 5
  def allow?(key) do
    count = :ets.update_counter(:rate, key, {2, 1}, {key, 0})
    count <= @max
  end
  def reset(key), do: :ets.delete(:rate, key)
end

for i <- 1..8, do: {i, Limiter.allow?("ip:1.2.3.4")}
# 1..5 true, 6..8 false ✓ — and it is correct under full concurrency`},
    {title:"Speed and table types", note:"", code:`:ets.new(:speed, [:named_table, :public, read_concurrency: true])
for i <- 1..100_000, do: :ets.insert(:speed, {i, "value #{i}"})

{t, _} = :timer.tc(fn -> for _ <- 1..100_000, do: :ets.lookup(:speed, 50_000) end)
IO.puts("100k lookups in #{div(t, 1000)} ms")

# ordered_set supports range queries
o = :ets.new(:ord, [:ordered_set])
for i <- 1..10, do: :ets.insert(o, {i, i * i})
:ets.first(o); :ets.last(o); :ets.next(o, 5)

# bag allows many values per key
b = :ets.new(:bag, [:bag])
:ets.insert(b, {"tags", "elixir"})
:ets.insert(b, {"tags", "otp"})
:ets.lookup(b, "tags")`}
  ]
},
{
  id:48, mod:"8 · Web Layer", title:"Plug — conn is the universe",
  front:"A request arrives. In Elixir, what single value represents it, and what does every piece of web code do to that value?",
  back:"`%Plug.Conn{}` — one struct holding the request AND the response: method, path, params, req_headers, assigns, status, resp_body, halted?. Every plug is a function `conn -> conn`. A web application is therefore a pipeline of transformations over one immutable struct. `Plug.Conn.halt/1` marks it done so later plugs are skipped.",
  phil:{
    lead:"Phoenix is not a framework that hides HTTP. It is a pipeline over one struct, and once you see that, the whole web layer becomes card 16 applied to a request.",
    body:[
      "Two contracts define everything. A **function plug** is `fun(conn, opts) :: conn`. A **module plug** implements `init/1` (called at compile time, so options are precomputed) and `call/2`. That is the entire specification. Authentication, logging, parsing, CORS, rate limiting, your controller — all of them are just functions from conn to conn, and you can write one in four lines.",
      "The `assigns` map is how plugs communicate: an auth plug puts `conn.assigns.current_user` there and everything downstream reads it. It is the request-scoped state of your application, and because conn is immutable, each plug returns a new conn rather than mutating shared state.",
      "`halt/1` is worth understanding precisely: it does not stop execution, it sets `halted: true`, and `Plug.Builder` (which Phoenix uses) checks that flag between plugs. So you must `|> send_resp(...) |> halt()` and then RETURN — code after halt in the same plug still runs."
    ],
    diagram:`   %Plug.Conn{
     ── request ──                    ── response ──
     method: "POST"                   status: nil → 201
     request_path: "/api/orders"      resp_headers: [...]
     params: %{"item" => "book"}      resp_body: "..."
     req_headers: [...]               state: :unset → :sent
     ── your data ──
     assigns: %{current_user: %User{}}   halted: false
   }

   A PLUG IS JUST:  conn ──▶ conn

   conn
   |> Plug.Logger.call([])         log it
   |> Plug.Parsers.call(...)       fill params
   |> Auth.call([])                assign current_user  (or halt 401)
   |> RateLimit.call([])           halt 429 if over limit
   |> Router.call([])              dispatch to a controller
   |> put_status(201)
   |> json(%{id: 1})               send_resp

   ┌─────────────────────────────────────────────────────────────┐
   │ FUNCTION PLUG   def my_plug(conn, _opts), do: conn          │
   │ MODULE PLUG     def init(opts), do: opts     ← compile time │
   │                 def call(conn, opts), do: conn ← per request│
   │ HALT            conn |> send_resp(401,"") |> halt()         │
   │                 (sets a flag; the PIPELINE checks it)       │
   └─────────────────────────────────────────────────────────────┘`,
    takeaway:"One immutable struct in, one out. Every web concern is a function over conn."
  },
  code:[
    {title:"A whole web server in 15 lines", note:"mix new tiny --sup, add {:plug_cowboy, \"~> 2.6\"}, then this.", code:`defmodule Tiny.Router do
  use Plug.Router

  plug Plug.Logger
  plug :match
  plug Plug.Parsers, parsers: [:json], json_decoder: Jason
  plug :dispatch

  get "/health" do
    send_resp(conn, 200, "ok")
  end

  get "/hello/:name" do
    send_resp(conn, 200, "hello #{name}")
  end

  post "/echo" do
    body = Jason.encode!(%{you_sent: conn.body_params})
    conn
    |> put_resp_content_type("application/json")
    |> send_resp(200, body)
  end

  match _ do
    send_resp(conn, 404, "not found")
  end
end

# start it (in application.ex, or right here in iex):
{:ok, _} = Plug.Cowboy.http(Tiny.Router, [], port: 4001)
# curl localhost:4001/health
# curl localhost:4001/hello/ada
# curl -X POST localhost:4001/echo -H 'content-type: application/json' -d '{"a":1}'`},
    {title:"Write your own plugs", note:"Both forms. This is all authentication really is.", code:`defmodule Tiny.Auth do
  @behaviour Plug
  import Plug.Conn

  @impl true
  def init(opts), do: Keyword.get(opts, :token, "secret")   # compile time

  @impl true
  def call(conn, expected) do                                # per request
    case get_req_header(conn, "authorization") do
      ["Bearer " <> ^expected] ->
        assign(conn, :current_user, %{id: 1, name: "Ada"})

      _ ->
        conn
        |> put_resp_content_type("application/json")
        |> send_resp(401, ~s({"error":"unauthorized"}))
        |> halt()
    end
  end
end

# a FUNCTION plug is even simpler:
defmodule Tiny.ReqId do
  import Plug.Conn
  def request_id(conn, _opts) do
    id = Base.encode16(:crypto.strong_rand_bytes(8), case: :lower)
    conn |> put_resp_header("x-request-id", id) |> assign(:request_id, id)
  end
end`},

{
  id:49, mod:"8 · Web Layer", title:"Phoenix anatomy",
  front:"You run `mix phx.new shop --no-html --no-assets`. What are the layers a request passes through, top to bottom?",
  back:"**Endpoint** (a plug pipeline: logging, parsers, sessions) → **Router** (pipelines + route matching) → **Controller** (an action function) → **Context** (your business logic and Ecto calls) → **View/JSON** (rendering). Underneath, every single request is handled by its own supervised process — Phoenix is a thin, well-organised layer over Plug and OTP.",
  phil:{
    lead:"Phoenix's real contribution is not the HTTP handling — it is the discipline of separating the web layer from your domain.",
    body:[
      "Notice the shape: Endpoint, Router and Controller are all Plug pipelines, so everything from card 48 applies unchanged. The Endpoint is itself a supervised process in your tree (card 46), which is why it goes last in the children list.",
      "The layer that matters most for your architecture is the **context**. Phoenix deliberately generates `lib/shop/accounts.ex` (business logic) separately from `lib/shop_web/controllers/` (HTTP). The controller's job is to translate HTTP into a function call and translate the result back into a response. If your controller contains Ecto queries or business rules, you have merged two layers that should be able to change independently — and your tests now need HTTP to exercise domain logic.",
      "One request equals one process is the other structural fact. A slow request cannot block others, a crashing request kills only itself, and Phoenix can hold hundreds of thousands of open connections on one box because each is a 2KB process."
    ],
    diagram:`   lib/shop/          ← YOUR DOMAIN (no HTTP words in here, ever)
     accounts.ex          context: create_user/1, authenticate/2
     accounts/user.ex     Ecto schema
     orders.ex            context
     repo.ex              database
     application.ex       supervision tree

   lib/shop_web/      ← THE WEB LAYER (translation only)
     endpoint.ex          plug pipeline: logger, parsers, session
     router.ex            pipelines + routes
     controllers/         actions: params in, context call, render out
     channels/            websockets
     plugs/               auth, rate limit, request id

   ONE REQUEST = ONE SUPERVISED PROCESS
      socket ──▶ ┌────────────────────────────────────────────┐
                 │ Endpoint  → Router  → Controller → Context │
                 │  plugs      pipelines   action     domain  │
                 └────────────────────────────────────────────┘
                        ▲ crashes here kill ONLY this request

   THE RULE THAT KEEPS IT MAINTAINABLE
   controller: params → context function → {:ok, x} | {:error, y} → render
   context:    everything else. It must not know that HTTP exists.`,
    takeaway:"Endpoint → Router → Controller → Context → render. Keep HTTP out of the domain."
  },

{
  id:50, mod:"8 · Web Layer", title:"Router and pipelines",
  front:"Public endpoints need no auth; `/api/admin` needs auth plus an admin check. How do you express that without repeating plugs on every route?",
  back:"**Pipelines**. `pipeline :api do plug :accepts, [\"json\"] end`, `pipeline :authed do plug ShopWeb.Auth end`, then `scope \"/api\" do pipe_through [:api, :authed] ... end`. A scope groups routes under a path prefix and a set of pipelines; `resources/2` generates the seven RESTful routes at once. Everything compiles down to pattern-matched function clauses — routing is O(1)-ish, not a list scan.",
  phil:{
    lead:"The router is where the plug pipeline meets pattern matching: it is a big multi-clause function generated at compile time.",
    body:[
      "Because routes compile into function heads (card 12), matching a path is as fast as any other pattern match, and a typo produces a compile-time-visible route list rather than a runtime surprise. `mix phx.routes` prints the whole table, which is the fastest way to understand an unfamiliar Phoenix app.",
      "Pipelines exist so that cross-cutting concerns are declared once, next to the routes they protect. This is a security property, not just tidiness: an auth plug attached to a pipeline covers every route in the scope, including ones added later by someone who forgets. Attaching auth per-controller is how endpoints end up accidentally public.",
      "Scopes also carry an alias, so `scope \"/api\", ShopWeb do` lets you write `get \"/orders\", OrderController, :index` without repeating the namespace. Nest scopes for versioning: `/api/v1` and `/api/v2` with different controller modules and shared pipelines."
    ],
    diagram:`   pipeline :api do
     plug :accepts, ["json"]
     plug ShopWeb.Plugs.RequestId
   end

   pipeline :authed do
     plug ShopWeb.Plugs.Auth        ← halts 401 for everyone in the scope
   end

   pipeline :admin do
     plug ShopWeb.Plugs.RequireRole, :admin
   end

   scope "/api", ShopWeb do
     pipe_through :api                     ← public
     post "/login", SessionController, :create
     get  "/health", HealthController, :show

     scope "/" do
       pipe_through :authed                ← +auth for everything below
       resources "/orders", OrderController, except: [:new, :edit]

    {title:"The auth plug the pipeline uses", note:"lib/shop_web/plugs/auth.ex", code:`defmodule ShopWeb.Plugs.Auth do
  @behaviour Plug
  import Plug.Conn
  import Phoenix.Controller, only: [json: 2]

  @impl true
  def init(opts), do: opts

  @impl true
  def call(conn, _opts) do
    with ["Bearer " <> token] <- get_req_header(conn, "authorization"),
         {:ok, user} <- Shop.Accounts.user_from_token(token) do
      assign(conn, :current_user, user)
    else
      _ ->
        conn
        |> put_status(:unauthorized)
        |> json(%{error: "unauthorized"})
        |> halt()
    end
  end
end

defmodule ShopWeb.Plugs.RequireRole do
  import Plug.Conn
  import Phoenix.Controller, only: [json: 2]

  def init(opts), do: Keyword.fetch!(opts, :role)

  def call(%{assigns: %{current_user: %{role: role}}} = conn, role), do: conn
  def call(conn, _role) do
    conn |> put_status(:forbidden) |> json(%{error: "forbidden"}) |> halt()
  end
end`},

{
  id:51, mod:"8 · Web Layer", title:"Controllers and JSON responses",
  front:"A controller action receives `(conn, params)`. What are the only three things it should do?",
  back:"(1) Extract and shape params — usually by pattern matching in the function head. (2) Call ONE context function. (3) Turn the result into a response with `json/2`, `put_status/2`, or delegate to a fallback controller. No queries, no business rules, no multi-step orchestration. If an action is longer than about ten lines, logic has leaked out of the context.",
  phil:{
    lead:"A controller is a translator between HTTP and your domain. Keeping it thin is what keeps your domain testable and reusable.",
    body:[
      "The `action_fallback` mechanism is the piece that makes thin controllers practical. Declare `action_fallback ShopWeb.FallbackController` and any action that returns `{:error, ...}` instead of a conn is routed there. Now the happy path in every action is a `with` expression (card 22) and all error-to-status mapping lives in exactly one module. That is a genuinely elegant design and it is worth adopting on day one.",
      "For JSON rendering, modern Phoenix uses plain modules with a `data/1` function (a JSON view) rather than templates. Keeping serialisation out of the controller means one place decides which fields are public — which is how you avoid leaking `password_hash` because someone piped a struct straight into `json/2`.",
      "Pattern-match params in the head. `def show(conn, %{\"id\" => id})` documents the contract, and a request missing `id` produces a clear FunctionClauseError rather than a nil flowing into your query."
    ],
    diagram:`   def create(conn, %{"order" => params}) do        ← 1. shape params
     with {:ok, order} <- Orders.create(conn.assigns.current_user, params) do
       conn                                          ← 2. ONE context call
       |> put_status(:created)                       ← 3. render
       |> put_resp_header("location", ~p"/api/orders/#{order}")
       |> render(:show, order: order)
     end
   end            │
                  └── returns {:error, _}? → action_fallback takes over

   ┌── FallbackController: ALL error mapping in one place ──────────┐
   │ call(conn, {:error, :not_found})        → 404                  │
   │ call(conn, {:error, :unauthorized})     → 401                  │
   │ call(conn, {:error, %Ecto.Changeset{}}) → 422 + field errors   │
   └────────────────────────────────────────────────────────────────┘

   RESPONSE HELPERS
   json(conn, map)                      put_status(conn, :created | 201)
   render(conn, :show, order: order)    send_resp(conn, 204, "")
   put_resp_header/3                    redirect(conn, to: ...)

   STATUS ATOMS: :ok :created :no_content :bad_request :unauthorized
                 :forbidden :not_found :unprocessable_entity :conflict

   ⚠ NEVER json(conn, user_struct) directly — it serialises every field.
     Use a JSON view module that lists the public fields explicitly.`,
    takeaway:"Params in, one context call, response out. Push all error mapping into action_fallback."
  },
  code:[
    {title:"A thin, complete controller", note:"lib/shop_web/controllers/order_controller.ex", code:`defmodule ShopWeb.OrderController do
  use ShopWeb, :controller

  alias Shop.Orders
  alias Shop.Orders.Order

  action_fallback ShopWeb.FallbackController

  def index(conn, params) do
    orders = Orders.list_orders(conn.assigns.current_user, params)
    render(conn, :index, orders: orders)
  end

  def show(conn, %{"id" => id}) do
    with {:ok, %Order{} = order} <- Orders.fetch_order(conn.assigns.current_user, id) do
      render(conn, :show, order: order)
    end
  end

  def create(conn, %{"order" => order_params}) do
    with {:ok, %Order{} = order} <- Orders.create_order(conn.assigns.current_user, order_params) do
      conn
      |> put_status(:created)
      |> put_resp_header("location", ~p"/api/orders/#{order.id}")
      |> render(:show, order: order)
    end
  end

  def update(conn, %{"id" => id, "order" => params}) do
    with {:ok, order} <- Orders.fetch_order(conn.assigns.current_user, id),
         {:ok, order} <- Orders.update_order(order, params) do
      render(conn, :show, order: order)
    end
  end

  def delete(conn, %{"id" => id}) do
    with {:ok, order} <- Orders.fetch_order(conn.assigns.current_user, id),
         {:ok, _} <- Orders.delete_order(order) do
      send_resp(conn, :no_content, "")
    end
  end
end`},

    {title:"The fallback controller", note:"Every error-to-status decision, in one file.", code:`defmodule ShopWeb.FallbackController do
  use ShopWeb, :controller

  def call(conn, {:error, %Ecto.Changeset{} = changeset}) do
    conn
    |> put_status(:unprocessable_entity)
    |> json(%{errors: translate_errors(changeset)})
  end

  def call(conn, {:error, :not_found}),
    do: conn |> put_status(:not_found) |> json(%{error: "not found"})

  def call(conn, {:error, :unauthorized}),
    do: conn |> put_status(:unauthorized) |> json(%{error: "unauthorized"})

  def call(conn, {:error, :forbidden}),
    do: conn |> put_status(:forbidden) |> json(%{error: "forbidden"})

  def call(conn, {:error, reason}) when is_atom(reason),
    do: conn |> put_status(:bad_request) |> json(%{error: to_string(reason)})

  defp translate_errors(changeset) do
    Ecto.Changeset.traverse_errors(changeset, fn {msg, opts} ->
      Enum.reduce(opts, msg, fn {k, v}, acc ->
        String.replace(acc, "%{#{k}}", to_string(v))
      end)
    end)
  end
end`},

{
  id:52, mod:"8 · Web Layer", title:"Contexts — the domain boundary",
  front:"Phoenix generates `lib/shop/accounts.ex`. What is it for, and what is the single rule that makes contexts worth having?",
  back:"A **context** is a module that is the public API of one part of your domain: `Accounts.register_user/1`, `Orders.place_order/2`. The rule: nothing outside the context may touch its schemas or Repo directly. Controllers, channels, background jobs and tests all go through the context. That single constraint is what lets you change the database without touching the web layer.",
  phil:{
    lead:"Contexts are Phoenix's answer to the question every growing codebase eventually asks: where does the business logic go?",
    body:[
      "Without them, Ecto queries spread into controllers, then into views, then into background jobs, and every schema change becomes a search-and-replace across the app. With them, the context is a seam: it owns its schemas, its queries and its invariants, and exposes verbs that make sense to a product person. `Orders.place_order/2` can validate stock, charge a card, insert rows in a transaction and broadcast an event — the controller never knows.",
      "Design them around language, not tables. `Accounts`, `Orders`, `Billing`, `Notifications` are contexts; `UserContext` and `OrderContext` are just tables with a suffix. Two contexts may both have a User-shaped concept with different fields, and that is healthy — `Accounts.User` cares about passwords, `Billing.Customer` cares about payment methods.",
      "The return-value convention ties back to card 22: contexts return `{:ok, thing}` / `{:error, reason}` so controllers can use `with` and `action_fallback`. And because a context is a plain module of plain functions, you can test your entire domain with no HTTP, no browser and no mocks."
    ],
    diagram:`   ┌───────────── shop_web (delivery) ────────────────────────┐
   │ controllers   channels   plugs   LiveViews   mix tasks    │
   └───────────────────────┬───────────────────────────────────┘
                           │  ONLY through context functions
   ┌───────────────────────▼───────────────────────────────────┐
   │ Shop.Accounts    Shop.Orders    Shop.Billing              │
   │ register_user/1  place_order/2  charge/2                  │
   │ authenticate/2   fetch_order/2  refund/1                  │
   └───────────────────────┬───────────────────────────────────┘
                           │  private to the context
   ┌───────────────────────▼───────────────────────────────────┐
   │ Accounts.User  Orders.Order  Orders.Item   Shop.Repo      │
   └───────────────────────────────────────────────────────────┘

   THE RULE:  no Repo call and no schema struct escapes its context.
              (Ecto.Changeset structs crossing to the web layer are fine —
               that is how form/JSON error rendering works.)

   NAME THEM AFTER THE DOMAIN, NOT THE TABLES
   ✓ Accounts, Orders, Billing, Notifications, Inventory
   ✗ UserContext, OrderContext, DataAccessLayer

   RETURN {:ok, _} | {:error, _} so with + action_fallback compose.

   mix phx.gen.json Orders Order orders total_cents:integer status:string
   └─ generates context + schema + migration + controller + JSON + tests`,
    takeaway:"One module is the front door to one part of the domain. Nothing bypasses it."
  },
  code:[
    {title:"A real context", note:"lib/shop/orders.ex — note there is no HTTP anywhere.", code:`defmodule Shop.Orders do
  @moduledoc "The Orders domain. The only public way to touch orders."

  import Ecto.Query, warn: false
  alias Shop.Repo
  alias Shop.Orders.{Order, Item}
  alias Shop.Accounts.User

  # ---------- reads ----------
  def list_orders(%User{id: user_id}, params \\\\ %{}) do
    Order
    |> where([o], o.user_id == ^user_id)
    |> filter_by_status(params["status"])
    |> order_by([o], desc: o.inserted_at)
    |> limit(^min(String.to_integer(params["limit"] || "50"), 100))
    |> preload(:items)
    |> Repo.all()
  end

  def fetch_order(%User{id: user_id}, id) do
    case Repo.get_by(Order, id: id, user_id: user_id) |> Repo.preload(:items) do
      nil -> {:error, :not_found}
      order -> {:ok, order}
    end
  end

  # ---------- writes ----------
  def create_order(%User{} = user, attrs) do
    %Order{user_id: user.id}
    |> Order.changeset(attrs)
    |> Repo.insert()
    |> broadcast(:order_created)
  end

  def update_order(%Order{} = order, attrs) do
    order |> Order.changeset(attrs) |> Repo.update()
  end

  def delete_order(%Order{} = order), do: Repo.delete(order)

  def change_order(%Order{} = order, attrs \\\\ %{}), do: Order.changeset(order, attrs)

  # ---------- private ----------
  defp filter_by_status(query, nil), do: query
  defp filter_by_status(query, status), do: where(query, [o], o.status == ^status)

  defp broadcast({:ok, order} = ok, event) do
    Phoenix.PubSub.broadcast(Shop.PubSub, "orders:#{order.user_id}", {event, order})
    ok
  end
  defp broadcast({:error, _} = err, _event), do: err
end`},
    {title:"Cross-context orchestration", note:"One context may call another — through its public API only.", code:`defmodule Shop.Checkout do
  alias Shop.{Orders, Billing, Notifications, Inventory}

  @doc "Places an order end to end. Returns {:ok, order} | {:error, reason}."
  def place(user, cart_params) do
    with {:ok, :available}  <- Inventory.reserve(cart_params["items"]),
         {:ok, order}       <- Orders.create_order(user, cart_params),
         {:ok, _charge}     <- Billing.charge(user, order.total_cents),
         {:ok, order}       <- Orders.update_order(order, %{"status" => "paid"}) do
      Notifications.order_confirmed(user, order)
      {:ok, order}
    else
      {:error, :out_of_stock} = err ->
        err
      {:error, %Ecto.Changeset{}} = err ->
        err
      {:error, reason} ->
        Inventory.release(cart_params["items"])
        {:error, reason}
    end
  end
end`},

{
  id:53, mod:"8 · Web Layer", title:"Phoenix.PubSub",
  front:"An order is paid in a controller. A websocket in another process, on another machine, must react. What connects them?",
  back:"`Phoenix.PubSub`: `broadcast(Shop.PubSub, \"orders:42\", {:order_paid, order})` and `subscribe(Shop.PubSub, \"orders:42\")`. Subscribers receive the message in `handle_info/2`. It is topic-based, process-oriented, and **cluster-aware** — with the PG2/pg adapter a broadcast reaches subscribers on every connected node with no extra code or infrastructure.",
  phil:{
    lead:"PubSub is how parts of your system stop knowing about each other, and it is the mechanism that makes Phoenix realtime features work across a cluster.",
    body:[
      "Structurally it is the duplicate-key Registry from card 38, generalised and made distributed. Subscribers register interest in a topic string; a broadcast walks the local subscribers and forwards to other nodes. Because the delivery mechanism is `send/2`, anything with a mailbox can subscribe — a GenServer, a Channel, a LiveView, a test process.",
      "The decoupling is the point. Your `Orders` context does not import your websocket code; it broadcasts a fact. Later you can add an analytics listener, an audit logger and a cache invalidator, and the context never changes. This is the difference between a system that gets harder to change and one that does not.",
      "Two practical notes. Design topic names as a hierarchy you can reason about — `orders:#{user_id}`, `room:#{room_id}`, `user:#{id}:notifications` — because authorisation happens at subscribe time and vague topics leak data. And remember delivery is best-effort in-memory: if a subscriber must never miss an event, persist it and let the subscriber catch up on reconnect."
    ],
    diagram:`   Orders context                         (knows nothing about consumers)
        │ broadcast(Shop.PubSub, "orders:42", {:order_paid, order})
        ▼
   ┌────────────────── Phoenix.PubSub ──────────────────────────┐
   │  topic "orders:42" ─▶ [pid_a, pid_c]                       │
   │  topic "room:1"    ─▶ [pid_b]                              │
   │      ▲ local delivery via send/2                           │
   │      └── adapter also forwards to every OTHER NODE ────────┼──▶ node2
   └────────────────────────────────────────────────────────────┘
        │              │                │
        ▼              ▼                ▼
   Channel        GenServer         LiveView / test process
   handle_info    handle_info       handle_info

   subscribe(Shop.PubSub, "orders:42")        ← in init or channel join
   broadcast(Shop.PubSub, topic, message)     ← from anywhere
   broadcast_from(pubsub, self(), topic, msg) ← skip the sender
   local_broadcast/3                          ← this node only

   TOPIC DESIGN = AUTHORISATION SURFACE
   ✓ "orders:#{user_id}"   "room:#{room_id}"   "user:#{id}:notifications"
   ✗ "orders"  (everyone sees everyone) — check permission at SUBSCRIBE

   ⚠ in-memory, best effort. Must-not-miss events ⇒ persist + catch up.`,
    takeaway:"Broadcast facts to topics; anything with a mailbox can subscribe, on any node."
  },
  code:[
    {title:"Try it in iex", note:"Works in plain iex if you add {:phoenix_pubsub, \"~> 2.1\"}.", code:`{:ok, _} = Phoenix.PubSub.Supervisor.start_link(name: Demo.PubSub)

Phoenix.PubSub.subscribe(Demo.PubSub, "orders:42")
Phoenix.PubSub.broadcast(Demo.PubSub, "orders:42", {:order_paid, %{id: 1}})
flush()

# a second subscriber in another process
parent = self()
spawn(fn ->
  Phoenix.PubSub.subscribe(Demo.PubSub, "orders:42")
  receive do msg -> send(parent, {:child_got, msg}) end
end)
Process.sleep(50)
Phoenix.PubSub.broadcast(Demo.PubSub, "orders:42", {:order_paid, %{id: 2}})
flush()`},
    {title:"A GenServer that reacts to domain events", note:"Add listeners without touching the publisher.", code:`defmodule Shop.AuditLog do
  use GenServer
  require Logger

  def start_link(_), do: GenServer.start_link(__MODULE__, [], name: __MODULE__)
  def entries, do: GenServer.call(__MODULE__, :entries)

  @impl true
  def init(_) do
    Phoenix.PubSub.subscribe(Demo.PubSub, "orders:42")
    {:ok, []}
  end

  @impl true
  def handle_info({:order_paid, order}, entries) do
    Logger.info("AUDIT order #{order.id} paid")
    {:noreply, [{:paid, order.id, System.system_time(:second)} | entries]}
  end
  def handle_info(_other, state), do: {:noreply, state}

  @impl true
  def handle_call(:entries, _from, entries), do: {:reply, entries, entries}
end

{:ok, _} = Shop.AuditLog.start_link(nil)
Phoenix.PubSub.broadcast(Demo.PubSub, "orders:42", {:order_paid, %{id: 99}})
Process.sleep(50)
Shop.AuditLog.entries()`},
    {title:"Broadcast from a context", note:"The idiomatic wrapper that keeps callers clean.", code:`defmodule Shop.Events do
  @pubsub Shop.PubSub

  def subscribe(topic), do: Phoenix.PubSub.subscribe(@pubsub, topic)
  def unsubscribe(topic), do: Phoenix.PubSub.unsubscribe(@pubsub, topic)

  def broadcast({:ok, %{} = record} = ok, topic_fun, event) when is_function(topic_fun, 1) do
    Phoenix.PubSub.broadcast(@pubsub, topic_fun.(record), {event, record})
    ok
  end
  def broadcast({:error, _} = err, _topic_fun, _event), do: err
end

# used in a context pipeline:

{
  id:54, mod:"9 · Postgres & Ecto", title:"Repo — the Postgres connection",
  front:"What is `Shop.Repo` actually, at runtime, and why is it in your supervision tree?",
  back:"It is a **supervised connection pool** (DBConnection + Postgrex) that owns N TCP connections to Postgres. `Repo.all/1`, `Repo.insert/1` etc. check out a connection, run the query, and check it back in. It sits in your children list before anything that queries, and its `pool_size` is one of the most important numbers in your deployment.",
  phil:{
    lead:"Ecto is not an ORM. It is a query builder plus a changeset library plus a connection pool, and each of those three parts is independently useful.",
    body:[
      "The absence of an object graph is deliberate. There is no lazy loading, no identity map, no hidden N+1 queries fired by a getter — if data is not loaded, you get an `Ecto.Association.NotLoaded` struct and a clear error. Every query is explicit and visible, which is exactly what you want when a database is your bottleneck.",
      "The pool is where Elixir's concurrency meets a decidedly non-concurrent resource. You may have 100,000 processes but only, say, 10 database connections. Requests queue for a connection with a `queue_target`/`queue_interval` policy, and when the pool is saturated you get `DBConnection.ConnectionError` rather than an unbounded queue. Sizing it is a real decision: too small and you serialise your app; too large and you exhaust Postgres's own `max_connections` (each Postgres connection is an OS process).",
      "A useful rule: `pool_size` per node times the number of nodes must stay comfortably under Postgres `max_connections`. Start around 10 and measure. If you truly need more concurrency, put PgBouncer in front rather than raising the pool."
    ],
    diagram:`   100,000 Elixir processes
        │  │  │  │  │  │  │  ...
        ▼  ▼  ▼  ▼  ▼  ▼  ▼
   ┌──────────────────────────────────────────┐
   │  Shop.Repo   pool_size: 10               │  queue if all busy
   │  ┌────┐┌────┐┌────┐┌────┐  … 10 conns    │  queue_target: 50ms
   │  └─┬──┘└─┬──┘└─┬──┘└─┬──┘                │  queue_interval: 1000ms
   └────┼─────┼─────┼─────┼───────────────────┘  then: ConnectionError
        ▼     ▼     ▼     ▼
   ╔══════════════════════════╗
   ║       PostgreSQL         ║  max_connections (default 100)
   ╚══════════════════════════╝  each connection = one OS process

   nodes × pool_size  <  postgres max_connections   ← the sizing rule
   need more? ⇒ PgBouncer, not a bigger pool.

   NOT AN ORM — no lazy loading, no identity map, no surprise queries
   order.items  ⇒  #Ecto.Association.NotLoaded<:items>  until you preload

   THE API SURFACE YOU WILL USE
   Repo.all/one/one!/get/get!/get_by     reads
   Repo.insert/update/delete (+ bangs)   writes
   Repo.insert_all/update_all/delete_all bulk, no changesets

  id:55, mod:"9 · Postgres & Ecto", title:"Migrations",
  front:"You need to add an index to a 50-million-row table without locking writes. What does the migration look like, and what makes it safe?",
  back:"`create index(:orders, [:user_id], concurrently: true)` plus `@disable_ddl_transaction true` and `@disable_migration_lock true` — because `CREATE INDEX CONCURRENTLY` cannot run inside a transaction. Migrations are versioned, ordered Elixir modules with `up`/`down` (or a reversible `change`), run by `mix ecto.migrate`, tracked in a `schema_migrations` table.",
  phil:{
    lead:"Migrations are code that runs against a live production database, so they deserve the same care as any deploy step — more, because they are hard to undo.",
    body:[
      "Ecto wraps each migration in a transaction and takes an advisory lock so two nodes deploying simultaneously cannot both run it. That default is right almost always, and the exceptions (concurrent indexes, some ALTERs) are exactly the ones that need the escape hatches above.",
      "The rule that prevents most incidents: never write a migration that breaks the currently running code. Deploys are not atomic — old and new code run at the same time. So adding a NOT NULL column with no default, or renaming a column, will break the version still serving traffic. Split it: add nullable, backfill, deploy code that writes both, then add the constraint, then drop the old column. Boring, and it never causes an outage.",
      "Backfills belong in their own migration or a separate task, batched, so you do not hold a transaction open over millions of rows. And always define `down` (or use reversible `change`) so a bad deploy can be rolled back."
    ],
    diagram:`   priv/repo/migrations/20260828120000_create_orders.exs
                       └── timestamp = version, runs in order
   schema_migrations table records which versions have run.

   mix ecto.gen.migration create_orders     mix ecto.migrate
   mix ecto.rollback                        mix ecto.migrations
   mix ecto.migrate --step 1                mix ecto.reset

   ┌── EACH MIGRATION RUNS IN A TRANSACTION + AN ADVISORY LOCK ──┐
   │  two nodes deploying at once ⇒ only one runs it ✓           │
   │  escape hatches when you need them:                         │
   │    @disable_ddl_transaction true                            │
   │    @disable_migration_lock true                             │
   └─────────────────────────────────────────────────────────────┘

   ⚠ DEPLOYS ARE NOT ATOMIC — old and new code run simultaneously.
   ✗ add NOT NULL column          ✗ rename column      ✗ drop column now
   ✓ THE SAFE SEQUENCE
     1. add nullable column                    (old code unaffected)
     2. deploy code that writes BOTH
     3. backfill in batches
     4. add the NOT NULL constraint
     5. deploy code that reads the new column only
     6. drop the old column (a later deploy)

   BIG TABLES
   create index(..., concurrently: true)   + disable_ddl_transaction
   backfill in batches of ~1000, not one giant UPDATE`,

defmodule Shop.Repo.Migrations.AddCurrencyToOrders do

    end
  end

# --- deploy 2: backfill in batches (after code writes both) ---
defmodule Shop.Repo.Migrations.BackfillOrdersCurrency do
  use Ecto.Migration
  import Ecto.Query
  @disable_ddl_transaction true
  @disable_migration_lock true

  def up do
    repo = Shop.Repo
    batch = fn ->
      from(o in "orders", where: is_nil(o.currency), select: o.id, limit: 1_000)
      |> repo.all()
      |> case do
        [] -> :done
        ids ->
          from(o in "orders", where: o.id in ^ids) |> repo.update_all(set: [currency: "USD"])
          :more
      end
    end

    Stream.repeatedly(batch)
    |> Enum.find(&(&1 == :done))
  end

  def down, do: :ok
end

# --- deploy 3: enforce ---
defmodule Shop.Repo.Migrations.RequireOrdersCurrency do
  use Ecto.Migration
  def change do
    alter table(:orders) do
      modify :currency, :string, null: false, from: {:string, null: true}
    end
  end
end`},

{
  id:56, mod:"9 · Postgres & Ecto", title:"Schemas",
  front:"An Ecto schema looks like a table definition. Why is it better to think of it as a data-shape declaration instead?",
  back:"Because a schema is just a struct plus a mapping between Elixir types and database columns — and you can have several schemas over one table, a schema over a query result, or an `embedded_schema` with no table at all. `Repo` uses the mapping; nothing forces one schema per table. That freedom is how you build read models and validate API params without polluting your write model.",
  phil:{
    lead:"A schema declares a shape and its types. The table is only one of the places that shape can come from.",
    body:[
      "The single-schema-per-table habit comes from ORMs and it causes bloated modules with twelve changeset functions. Ecto lets you write `Accounts.User` for the full record and `Accounts.UserProfile` for the three fields the public API exposes, both reading `users`. Queries can also select into any schema or into a plain map, so read models are cheap.",
      "`embedded_schema` deserves special attention for backends: it gives you a struct with types and changeset validation but no table. That is the clean way to validate incoming JSON — define the expected shape, cast the params, get typed data or a changeset full of errors — without inventing a database table for a search filter.",
      "The type list matters in practice: `:utc_datetime_usec` for timestamps (always store UTC), `:decimal` for money if you must use fractional currency (or, better, integer cents), `:map` and `{:array, :string}` map to jsonb and Postgres arrays, and `Ecto.Enum` gives you atoms in Elixir backed by a string or integer column."
    ],
    diagram:`   defmodule Shop.Orders.Order do
     use Ecto.Schema

     @primary_key {:id, :binary_id, autogenerate: true}
     schema "orders" do                    ← table name (or none: embedded)

       field :total_cents, :integer, default: 0
       field :metadata, :map
       field :tags, {:array, :string}
       field :placed_at, :utc_datetime_usec

       belongs_to :user, Shop.Accounts.User
       has_many :items, Shop.Orders.Item

     end
   end

   ⇒ %Order{} is a plain struct.  Repo maps its fields to columns.

   ONE TABLE, MANY SCHEMAS — perfectly legal and often right
   Accounts.User          full record, write model
   Accounts.UserSummary   3 fields, read model for a list endpoint
   Accounts.UserRegistration  embedded, validates signup params

   embedded_schema  → struct + types + changesets, NO table
                      ideal for validating JSON params & filters

   TYPES THAT MATTER

{
  id:57, mod:"9 · Postgres & Ecto", title:"Changesets",
  front:"Untrusted params arrive from the internet. What stands between them and your database, and what are its two distinct jobs?",
  back:"An `Ecto.Changeset`. Job one: **cast** — take a map with string keys, keep only whitelisted fields, convert them to the schema's types, and record type failures. Job two: **validate** — apply your rules and constraints. The result carries `changes`, `errors`, `valid?` and the original `data`, so a failed changeset is a complete description of what went wrong and can be rendered back to the client.",
  phil:{
    lead:"The changeset is the trust boundary from card 10, made concrete: string-keyed chaos in, typed and validated changes out.",
    body:[
      "The whitelist in `cast/3` is a security control, not a convenience. Any field you do not list is dropped, so a client cannot set `role: \"admin\"` or `balance: 999999` by adding it to the JSON body. Mass-assignment vulnerabilities are structurally impossible if you list fields explicitly — never build that list from the params themselves.",
      "The `validate_*` vs `*_constraint` distinction is genuinely important. Validations run in Elixir before the query and are cheap. Constraints (`unique_constraint`, `foreign_key_constraint`, `check_constraint`) do not run anything — they translate a Postgres error into a friendly changeset error when the insert fails. You need both: only the database can guarantee uniqueness under concurrency, and only a validation can give fast feedback.",
      "Because a changeset is data, you can build them in pipelines, have different changesets for different operations (`registration_changeset`, `password_changeset`, `admin_changeset`), and pass them into `Ecto.Multi` for transactional work. That composability is why Ecto separates 'describe the change' from 'apply the change'."
    ],
    diagram:`   %{"email" => "A@B.COM ", "role" => "admin", "hack" => 1}   untrusted
        │
        ▼  cast(schema, params, [:email, :password])      ← WHITELIST
   ┌───────────────────────────────────────────────────────────────┐
   │ %Ecto.Changeset{                                              │
   │   data:    %User{}          the original                      │
   │   changes: %{email: "a@b.com"}   only cast + changed fields   │
   │   errors:  [password: {"can't be blank", …}]                  │
   │   valid?:  false                                              │
   │   action:  nil | :insert | :update                            │
   │ }                    "role" and "hack" were DROPPED ✓         │
   └───────────────────────────────────────────────────────────────┘

   VALIDATIONS (in Elixir, before the query — fast feedback)
   validate_required  validate_format   validate_length
   validate_number    validate_inclusion/exclusion   validate_change
   validate_confirmation   update_change   put_change   delete_change

   CONSTRAINTS (translate a Postgres error into a field error)
   unique_constraint(:email)          ← ONLY the DB can guarantee this
   foreign_key_constraint(:user_id)   check_constraint(:total_cents, …)
   ⇒ needs the matching unique_index/constraint in a migration!

   Repo.insert(changeset) ⇒ {:ok, %User{}} | {:error, %Changeset{}}
                              └── straight into with + action_fallback`,
    takeaway:"cast whitelists and types; validate checks in Elixir; constraints translate database errors."
  },
  code:[
    {title:"A registration changeset", note:"Every technique in one place.", code:`defmodule Shop.Accounts.User do
  use Ecto.Schema
  import Ecto.Changeset

  schema "users" do
    field :email, :string
    field :role, Ecto.Enum, values: [:member, :admin], default: :member
    field :password_hash, :string, redact: true
    field :password, :string, virtual: true, redact: true
    field :password_confirmation, :string, virtual: true, redact: true
    timestamps(type: :utc_datetime_usec)
  end

  def registration_changeset(user, attrs) do
    user
    |> cast(attrs, [:email, :password, :password_confirmation])   # :role NOT listed
    |> validate_required([:email, :password])
    |> update_change(:email, &String.downcase/1)
    |> update_change(:email, &String.trim/1)
    |> validate_format(:email, ~r/^[^@\\s]+@[^@\\s]+$/, message: "must be a valid email")
    |> validate_length(:email, max: 160)
    |> validate_length(:password, min: 12, max: 72)
    |> validate_confirmation(:password, message: "does not match")
    |> hash_password()
    |> unique_constraint(:email)          # needs a unique_index in a migration
  end

  # a SEPARATE changeset for privileged changes — never merged with the above
  def admin_changeset(user, attrs) do
    user |> cast(attrs, [:role]) |> validate_inclusion(:role, [:member, :admin])
  end

  defp hash_password(%{valid?: true, changes: %{password: pw}} = cs) do
    put_change(cs, :password_hash, "hashed:" <> Base.encode16(:crypto.hash(:sha256, pw)))
  end
  defp hash_password(cs), do: cs
end`},

    {title:"Custom validations", note:"validate_change is the general escape hatch.", code:`import Ecto.Changeset

defmodule Validations do
  import Ecto.Changeset

  def validate_not_disposable(changeset, field) do
    validate_change(changeset, field, fn ^field, value ->
      domain = value |> to_string() |> String.split("@") |> List.last()
      if domain in ["mailinator.com", "tempmail.io"] do
        [{field, "disposable email addresses are not allowed"}]
      else
        []
      end
    end)
  end

  def validate_business_hours(changeset, field) do
    validate_change(changeset, field, fn ^field, %DateTime{} = dt ->
      if dt.hour in 9..17, do: [], else: [{field, "must be during business hours"}]
    end)
  end
end

%Shop.Accounts.User{}
|> cast(%{"email" => "x@mailinator.com"}, [:email])
|> Validations.validate_not_disposable(:email)
|> Map.get(:errors)`},

{
  id:58, mod:"9 · Postgres & Ecto", title:"Ecto.Query",
  front:"Write the query for 'paid orders over $50 for this user, newest first, 20 per page' — and explain why `^` appears.",
  back:"`from(o in Order, where: o.user_id == ^id and o.status == :paid and o.total_cents > 5000, order_by: [desc: o.inserted_at], limit: 20)`. The `^` (card 9) marks a value coming from Elixir; Ecto sends it as a **bound parameter** (`$1`), which is why Ecto queries are injection-safe by construction. Queries are composable data structures — you can build them in pieces and only hit the database when you call `Repo`.",
  phil:{
    lead:"An Ecto query is a value you build up, not a string you concatenate. That is what makes filtering, scoping and pagination composable.",
    body:[
      "Because a query is data, `list_orders` can start from a base query and pipe it through `filter_by_status`, `filter_by_date`, `paginate` — each a small function returning a query. You get dynamic filtering with no string building and no injection surface. Contrast with SQL string concatenation, where every optional filter is an `if` around a fragment of text.",
      "There are two syntaxes for the same thing. Keyword syntax (`from o in Order, where: ...`) reads like SQL and is nice for a whole query written at once. Macro/pipe syntax (`Order |> where([o], ...) |> order_by(...)`) composes, and is what you want inside context functions. Mixing them is normal.",
      "Two details to internalise early. Preloading is explicit — accessing an unloaded association gives you `NotLoaded`, never a surprise query, which is how Ecto structurally prevents lazy-loading N+1s. And `select` controls exactly which columns cross the wire; selecting whole schemas by default is fine until you are reading a million rows, at which point selecting a map of three fields is dramatically faster."

     where: o.total_cents > ^min,      |> where([o], o.total_cents > ^min)
     order_by: [desc: o.inserted_at],  |> order_by([o], desc: o.inserted_at)

     preload: [:items],                |> preload(:items)

    {title:"Composable scopes — the context pattern", note:"Every optional filter is a function, not an if around a string.", code:`defmodule Shop.Orders.Queries do
  import Ecto.Query
  alias Shop.Orders.Order

  def base, do: from(o in Order, as: :order)

  def for_user(q, user_id), do: where(q, [order: o], o.user_id == ^user_id)

  def with_status(q, nil), do: q
  def with_status(q, status) when is_binary(status),
    do: where(q, [order: o], o.status == ^String.to_existing_atom(status))

  def min_total(q, nil), do: q
  def min_total(q, cents), do: where(q, [order: o], o.total_cents >= ^cents)

  def since(q, nil), do: q
  def since(q, %DateTime{} = dt), do: where(q, [order: o], o.inserted_at >= ^dt)

  def newest_first(q), do: order_by(q, [order: o], desc: o.inserted_at)

  def page(q, page, per_page) do
    q |> limit(^per_page) |> offset(^((page - 1) * per_page))
  end

  def summary(q) do
    select(q, [order: o], %{id: o.id, status: o.status, total: o.total_cents})
  end
end

alias Shop.Orders.Queries, as: Q

Q.base()
|> Q.for_user(1)
|> Q.with_status("paid")
|> Q.min_total(5_000)
|> Q.newest_first()
|> Q.page(1, 20)
|> Q.summary()
|> Shop.Repo.all()`},

  id:59, mod:"9 · Postgres & Ecto", title:"Associations, preload and joins",
  front:"You list 100 orders and render each order's items. Why might that fire 101 queries, and what are your two ways out?",
  back:"Accessing `order.items` per order is the classic N+1 — except Ecto refuses to do it silently, giving you `NotLoaded`. Fix it with `preload(:items)`, which runs ONE extra query (`WHERE order_id IN (...)`) and is usually what you want, or with `join` + `preload` in a single query when you also need to filter on the association. `Repo.preload/2` does the same after the fact.",
  phil:{
    lead:"Ecto makes the number of queries visible in your code, which is the whole reason it refuses to lazy-load.",
    body:[
      "Two preloads, two strategies. Separate-query preload (`preload(:items)`) issues a second query with an `IN` clause. It is efficient, avoids row multiplication, and is the right default. Join-preload (`join: i in assoc(o, :items), preload: [items: i]`) fetches everything in one query — necessary when you filter or order by the association, but it multiplies rows for has_many, so a query returning 100 orders with 10 items each returns 1000 rows.",
      "The association macros describe where the foreign key lives: `belongs_to` on the side holding the key, `has_many`/`has_one` on the other, `many_to_many` through a join table, and `has_many :through` to reach across two hops. Getting the direction right is most of the battle.",
      "`Ecto.Multi` and `cast_assoc`/`put_assoc` let you insert a parent with children in one changeset, which is how you accept a nested JSON payload. Use `cast_assoc` when the children come from user params, and `put_assoc` when you already have structs."
    ],
    diagram:`   users 1 ──< orders 1 ──< order_items          >──< via join table
   ┌──────────────────┐   ┌──────────────────────────────────────┐
   │ belongs_to :user │   │ the schema holding the FOREIGN KEY   │
   │ has_many :items  │   │ the schema on the OTHER side         │
   │ has_one :profile │   │ many_to_many …, join_through: "..."  │
   │ has_many :skus, through: [:items, :sku]                     │
   └──────────────────┘   └──────────────────────────────────────┘

   N+1 (what other ORMs do silently)      ECTO: NotLoaded, so you cannot
   SELECT * FROM orders               (1)  ⇒ you must choose:
   SELECT * FROM items WHERE order_id=1
   SELECT * FROM items WHERE order_id=2   A) preload(:items)      2 queries
   … 100 more                             SELECT * FROM orders
                                          SELECT * FROM items
                                                WHERE order_id IN (…)  ✓
                                          B) join + preload      1 query
                                          …but rows multiply:
                                          100 orders × 10 items = 1000 rows

   USE preload  ─ almost always
   USE join+preload ─ when you FILTER or ORDER by the association

   Repo.preload(orders, [items: :product, user: []])   ← after the fact
   Ecto.assoc(user, :orders)                            ← query from a struct`,
    takeaway:"Ecto never lazy-loads. Preload with a second query by default; join-preload when you must filter on it."
  },

alias Shop.{Repo, Orders.Order}

# 1. the accident Ecto prevents

hd(orders).items        # #Ecto.Association.NotLoaded<:items>  ← no silent query
