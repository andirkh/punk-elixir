<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PunkElixir — Flashcards from zero to a production backend</title>

    <!-- Fonts and the stylesheet. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://esm.sh" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/styles.css" />

    <!-- Tailwind's CDN build is a classic script that reads a global, so it and
     its config are the only two non-module scripts on the page. Everything
     else below is an ES module. -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="./src/tailwind.config.js"></script>

    <!-- The import map names the libraries, so a module imports 'preact'
     rather than a URL and the version lives in exactly one place. Pinned
     by version; ?deps= keeps signals on the same preact instance as the
     components. mermaid is listed but not fetched at start — src/lib/
     mermaid.js imports it the first time a diagram is drawn. -->
    <script type="importmap">
      {
        "imports": {
          "preact": "https://esm.sh/preact@10.24.3",
          "preact/hooks": "https://esm.sh/preact@10.24.3/hooks",
          "@preact/signals": "https://esm.sh/@preact/signals@1.3.0?deps=preact@10.24.3",
          "htm": "https://esm.sh/htm@3.1.1",
          "mermaid": "https://esm.sh/mermaid@11.4.1"
        }
      }
    </script>

    <!-- The three modules needed to paint the first frame, fetched in parallel
     with this document rather than one after another down the import graph. -->
    <link rel="modulepreload" href="./src/main.js" />
    <link rel="modulepreload" href="./src/deck.js" />
    <link rel="modulepreload" href="./src/store.js" />
  </head>
  <body>
    <div id="root"></div>

    <!-- The whole app, in one import.

     What used to be a hundred and twenty <script> tags in load order is
     now a graph the browser walks itself: main.js imports the components,
     they import the store, the store imports the deck. Nothing is listed
     twice, and nothing is fetched that is not asked for — the deck's 99
     cards arrive one at a time, as they are read. -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
